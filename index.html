<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aula Magna 3D — Mondi sul pavimento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Palette Wimbledon (portale acerio) — ambra al posto del rosso, oro come accento */
:root{
  --green:#1B6D3F; --green2:#22804A; --greenD:#0E4423; --greenL:rgba(27,109,63,.08);
  --gold:#B8860B;  --gold2:#D4A017; --goldL:rgba(184,134,11,.10);
  --cream:#F5F9F5; --card:#FFFFFF;  --text:#1A2E1A; --muted:#4A6B4A; --light:#8BA88B;
  --brd:#C8DCC8;   --brd2:#A8C4A8;  --warn:#B8860B;
  --shadow:0 6px 24px rgba(14,68,35,.16);
  --body:'Atkinson Hyperlegible',Helvetica,Arial,sans-serif;
  --head:'Lexend',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#dfe6e9;color:var(--text);font-family:var(--body);font-size:18px;line-height:1.5}
button{font-family:var(--head);cursor:pointer}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;cursor:grab}
#c.drag{cursor:grabbing}

/* ---------- barra superiore ---------- */
.top{position:fixed;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:18px;padding:0 18px;
  background:rgba(255,255,255,.94);border-bottom:1px solid var(--brd);box-shadow:0 2px 12px rgba(27,109,63,.06);z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:700;font-size:20px;color:var(--greenD);white-space:nowrap}
.brand svg{width:30px;height:30px}
.brand small{display:block;font-weight:400;font-size:13px;color:var(--muted);letter-spacing:.02em}
.tabs{display:flex;gap:8px;margin:0 auto}
.tab{display:flex;align-items:center;gap:9px;border:1.5px solid var(--brd);background:#fff;color:var(--text);
  border-radius:999px;padding:7px 16px 7px 10px;font-size:16px;font-weight:500;transition:background .15s,border-color .15s}
.tab svg{width:24px;height:24px;flex:none}
.tab .sub{display:block;font-family:var(--body);font-size:12.5px;font-weight:400;color:var(--muted);line-height:1.1}
.tab span{text-align:left;line-height:1.15}
.tab:hover{border-color:var(--green2)}
.tab.on{background:var(--green);border-color:var(--green);color:#fff}
.tab.on .sub{color:rgba(255,255,255,.85)}
.tools{display:flex;gap:8px}
.ibtn{display:flex;align-items:center;gap:7px;border:1.5px solid var(--brd);background:#fff;border-radius:10px;padding:7px 12px;font-size:15px;color:var(--greenD)}
.ibtn svg{width:20px;height:20px}
.ibtn:hover{border-color:var(--green2)}

/* ---------- etichette nel mondo ---------- */
#labels{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.tag{position:absolute;left:0;top:0;pointer-events:auto;transform:translate(-9999px,-9999px);
  display:flex;align-items:center;gap:6px;white-space:nowrap;padding:4px 11px 4px 8px;border-radius:999px;
  background:rgba(255,255,255,.95);border:1.5px solid var(--green);color:var(--greenD);
  font-family:var(--head);font-size:14px;font-weight:500;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12);
  transition:opacity .25s, background .15s}
.tag i{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none}
.tag:hover,.tag.on{background:var(--gold);border-color:var(--gold);color:#fff}
.tag:hover i,.tag.on i{background:#fff}
.tag.small{font-size:12.5px;padding:2px 9px 2px 6px}
.tag.hide{opacity:0;pointer-events:none}

/* ---------- pannello informativo ---------- */
#lead{position:fixed;inset:0;pointer-events:none;z-index:9}
#lead line{stroke:var(--gold);stroke-width:2}
#lead circle{fill:var(--gold)}
.info{position:fixed;left:0;top:0;width:340px;max-height:calc(100vh - 170px);overflow:auto;z-index:10;
  background:var(--card);border-radius:14px;border-left:6px solid var(--green);box-shadow:var(--shadow);
  padding:16px 18px 16px 18px;display:none}
.info.open{display:block;animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.info h2{margin:0 34px 4px 0;font-family:var(--head);font-size:22px;line-height:1.2;color:var(--greenD)}
.info .sci{font-style:italic;color:var(--muted);font-size:16px;margin:0 0 6px}
.info .badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.badge{display:inline-block;font-family:var(--head);font-size:13px;font-weight:500;padding:2px 10px;border-radius:999px;background:var(--greenL);color:var(--greenD);border:1px solid var(--brd)}
.badge.gold{background:var(--goldL);color:#7a5a07;border-color:#e3cf9a}
.info dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 10px;font-size:16px}
.info dt{color:var(--muted)}
.info dd{margin:0;font-weight:700}
.info p{margin:0 0 8px}
.info .x{position:absolute;right:10px;top:10px;width:32px;height:32px;border:none;background:transparent;border-radius:8px;color:var(--muted)}
.info .x:hover{background:var(--greenL)}
.info .x svg{width:20px;height:20px}
.info .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{border:none;border-radius:10px;padding:8px 14px;font-size:15px;font-weight:600;background:var(--green);color:#fff}
.btn:hover{background:var(--green2)}
.btn.gold{background:var(--gold)}
.btn.ghost{background:#fff;color:var(--greenD);border:1.5px solid var(--brd)}
.info .note{font-size:14px;color:var(--muted);border-top:1px solid var(--brd);padding-top:8px;margin-top:6px}
.info details.doc{margin-top:10px;font-size:14px;color:var(--muted);border-top:1px solid var(--brd);padding-top:6px}
.info details.doc summary{cursor:pointer;font-family:var(--head);color:var(--greenD)}
.info details.doc a{color:var(--green);word-break:break-all}
.info details.doc ul{margin:4px 0 0;padding-left:18px}
.info .fig{display:block;width:100%;height:auto;margin:4px 0 10px;border-radius:8px;background:var(--cream)}

/* ---------- dock in basso (strumenti del mondo) ---------- */
.dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:12;background:rgba(255,255,255,.96);
  border:1px solid var(--brd);border-radius:16px;box-shadow:var(--shadow);padding:12px 18px;display:none}
.dock.open{display:block}

/* ---------- aiuto navigazione ---------- */
.help{position:fixed;left:16px;bottom:16px;z-index:11;background:rgba(255,255,255,.94);border:1px solid var(--brd);
  border-radius:14px;padding:10px 14px;font-size:15px;box-shadow:var(--shadow);max-width:290px}
.help h3{margin:0 0 6px;font-family:var(--head);font-size:15px;color:var(--greenD);display:flex;justify-content:space-between;align-items:center}
.help h3 button{border:none;background:none;color:var(--muted);font-size:13px;padding:0}
.help ul{list-style:none;margin:0;padding:0}
.help li{display:flex;gap:9px;align-items:center;margin:4px 0}
.help li svg{width:22px;height:22px;flex:none;color:var(--green)}
.help.min ul{display:none}

/* ---------- velo di transizione e caricamento ---------- */
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:15;transition:opacity .25s}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--cream);z-index:30;
  font-family:var(--head);font-size:20px;color:var(--greenD);transition:opacity .5s}
#loading.done{opacity:0;pointer-events:none}
.toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);z-index:14;background:var(--greenD);color:#fff;
  font-family:var(--head);font-size:16px;padding:9px 18px;border-radius:12px;box-shadow:var(--shadow);opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}

/* ---------- dock linea del tempo ---------- */
.tl{width:min(940px,calc(100vw - 360px))}
.tl-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tl-read{font-family:var(--head);color:var(--greenD);font-size:18px;min-width:290px}
.tl-read b{font-size:30px;font-weight:700;margin-right:4px}
.tl-btns{margin-left:auto;display:flex;gap:6px}
.tl-btns button{display:flex;align-items:center;gap:6px;border:1.5px solid var(--brd);background:#fff;border-radius:10px;padding:6px 12px;font-size:15px;color:var(--greenD)}
.tl-btns button svg{width:18px;height:18px}
.tl-btns button.play{background:var(--gold);border-color:var(--gold);color:#fff}
.tl-btns button:hover{border-color:var(--green2)}
.tl-track{position:relative;margin:30px 0 4px;height:40px}
.tl-bands{position:absolute;left:0;right:0;top:12px;height:16px;display:flex;border-radius:8px;overflow:hidden}
.tl-bands div{height:100%;font-family:var(--head);font-size:11px;font-weight:600;color:#fff;text-align:center;line-height:16px;letter-spacing:.04em;overflow:hidden;white-space:nowrap}
.tl-range{position:absolute;left:0;right:0;top:4px;width:100%;margin:0;height:32px;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.tl-range::-webkit-slider-runnable-track{height:32px;background:transparent}
.tl-range::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:32px;border-radius:5px;background:var(--greenD);border:2px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.35)}
.tl-range::-moz-range-thumb{width:14px;height:32px;border-radius:5px;background:var(--greenD);border:2px solid #fff}
.tl-stops{position:absolute;left:0;right:0;top:-24px;height:22px}
.tl-stops button{position:absolute;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;border:2px solid var(--green);background:#fff;padding:0}
.tl-stops button.on{background:var(--gold);border-color:var(--gold)}
.tl-stops button.ast{border-color:#7a5a07;border-style:dashed}
.tl-stops button:hover{background:var(--goldL)}
.tl-ticks{position:absolute;left:0;right:0;top:30px;height:12px;font-size:12px;color:var(--muted)}
.tl-ticks span{position:absolute;transform:translateX(-50%)}
.tl-note{font-size:14px;color:var(--muted);margin-top:8px}
.tl-stopname{font-family:var(--head);font-size:15px;color:#7a5a07;font-weight:600}
.reveal{margin-top:4px;padding:8px 10px;border-radius:10px;background:var(--goldL);border:1px solid #e3cf9a;display:none}
.reveal.on{display:block}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Aula magna in 3D"></canvas>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="9" width="26" height="18" rx="3" fill="none" stroke="#1B6D3F" stroke-width="2.4"/><path d="M3 15h26M11 9v18M21 9v18" stroke="#1B6D3F" stroke-width="1.6" opacity=".55"/><path d="M16 3l5 6H11z" fill="#B8860B"/></svg>
    <div>Aula Magna 3D<small>i mondi sul pavimento</small></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="tools">
    <button class="ibtn" id="btnHome" title="Torna alla vista iniziale (tasto H)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Vista iniziale</button>
  </div>
</header>

<div id="labels"></div>
<svg id="lead"><line id="leadLine" x1="0" y1="0" x2="0" y2="0" style="display:none"/><circle id="leadDot" r="5" cx="-20" cy="-20"/></svg>
<div class="info" id="info" role="dialog" aria-live="polite"></div>

<div class="help" id="help">
  <h3>Come muoversi <button id="helpMin">nascondi</button></h3>
  <ul>
    <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="6"/><path d="M12 2v7" /><path d="M6 9h6" stroke-width="3"/></svg>Trascina con il tasto sinistro per girare</li>
    <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="6"/><path d="M12 5v4" stroke-width="3"/></svg>Rotellina per avvicinarti</li>
    <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="6"/><path d="M12 2v7"/><path d="M12 9h6" stroke-width="3"/></svg>Tasto destro (o frecce) per spostarti</li>
    <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/></svg>Doppio clic per volare in un punto</li>
    <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="10" rx="5"/><circle cx="8" cy="12" r="1.6" fill="currentColor"/></svg>Clic sulle etichette per leggere</li>
  </ul>
</div>

<div id="flash"></div>
<div class="toast" id="toast"></div>
<div id="loading">Sto preparando l'aula magna…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   AULA MAGNA 3D — Scuola Sacra Famiglia, Orzinuovi
   Single file, Three.js r128, vanilla JS. Pubblicazione: acerio.app

   FOGLIO COORDINATE (ricavato dalla scansione RoomPlan Room/room.usdz;
   origine = centro scansione, y = 0 sul pavimento; scansione y-1.512)
   Stanza  x[-5.385, 5.300] (10.69 m)   z[-10.509, 10.509] (21.02 m)   h 3.02
   x = -5.385  PARETE CORRIDOIO, bianca, pilastri e trave alta blu.
       pilastri z  -6.64 · -3.15 · 0.55 · 3.97 · 7.57
       finestre interne (tende veneziane)  z[-2.675,0.075] [0.92,3.47] [4.40,7.11]
         y 0.95 → 2.65
       porta  z[8.32, 9.33]  h 2.18
   x = +5.300  PARETE ESTERNA, davanzale crema, vetrate su campi e alberi
       pilastri z  -6.62 · -3.12 · 0.34 · 3.79 · 7.33
       vetrate  z[-9.90,-6.96] [-6.28,-3.46] [-2.78,0.02] [0.66,3.42] [4.16,6.94] [7.715,8.445]
         y 0.85 → 2.72, tapparelle a quote diverse
   z = -10.509 PARETE CORTA bianca: 7 pile di sedie  x -1.64 … 3.74 (z -10.05)
   z = +10.509 PARETE CORTA bianca con trave blu; armadio x 4.88 z 8.98;
       tavolo x 2.22 z 9.77 (1.57×1.28); mensola x -1.66 z 9.59 (0.91×0.38)
   Pavimento: blocchi da 60 cm in diagonale — grigio 2×2 (30 cm),
       crema 3×3 (20 cm), rosa 2×2; colore = (riga+colonna) mod 3
   ===================================================================== */

// ---------- costanti stanza ----------
const ROOM={x0:-5.385,x1:5.300,z0:-10.509,z1:10.509,h:3.02};
const COR={x:-5.385,pil:[-6.64,-3.15,0.55,3.97,7.57],
  win:[[-2.675,0.075],[0.92,3.47],[4.40,7.11]],wy:[0.95,2.65],door:[8.32,9.33],dh:2.18};
const EXT={x:5.300,pil:[-6.62,-3.12,0.34,3.79,7.33],
  win:[[-9.90,-6.96],[-6.28,-3.46],[-2.78,0.02],[0.66,3.42],[4.16,6.94],[7.715,8.445]],wy:[0.85,2.72]};
const PIL={w:0.45,d:0.28};

// ---------- renderer ----------
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
let pixelRatio=Math.min(window.devicePixelRatio||1,1.25);   // iMac 2015: mai oltre 1.25
renderer.setPixelRatio(pixelRatio);
renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();
scene.background=new THREE.Color('#dfe6e9');
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.02,90);
const MAXANISO=Math.min(4,renderer.capabilities.getMaxAnisotropy());

// colore sRGB → lineare (con outputEncoding sRGB i colori dei materiali vanno convertiti)
const col=h=>new THREE.Color(h).convertSRGBToLinear();
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function texOf(c,rep){const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=MAXANISO;
  if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;}return t;}
// rumore deterministico (stesse tapparelle a ogni caricamento)
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%100000)/100000;};}
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>v<a?a:v>b?b:v;
const smooth=t=>t*t*(3-2*t);

// ---------- luci ----------
const hemi=new THREE.HemisphereLight(0xffffff,0xd8cfbf,0.62);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff6e8,0.42);sun.position.set(9,7,3);scene.add(sun);
const fill=new THREE.DirectionalLight(0xffffff,0.16);fill.position.set(-6,5,-8);scene.add(fill);
scene.add(new THREE.AmbientLight(0xffffff,0.20));

// ---------- unione geometrie (r128 non ha BufferGeometryUtils nel core) ----------
const _m4=new THREE.Matrix4();
function mergeParts(parts){ // parts: [{g, m (Matrix4), c (Color lineare)}] → BufferGeometry con colori
  let n=0;const gs=parts.map(p=>{const g=(p.g.index?p.g.toNonIndexed():p.g.clone());if(p.m)g.applyMatrix4(p.m);n+=g.attributes.position.count;return g;});
  const pos=new Float32Array(n*3),nor=new Float32Array(n*3),cl=new Float32Array(n*3);let o=0;
  gs.forEach((g,i)=>{const cnt=g.attributes.position.count;pos.set(g.attributes.position.array,o*3);
    if(!g.attributes.normal)g.computeVertexNormals();nor.set(g.attributes.normal.array,o*3);
    const c=parts[i].c||new THREE.Color(1,1,1);for(let k=0;k<cnt;k++){cl[(o+k)*3]=c.r;cl[(o+k)*3+1]=c.g;cl[(o+k)*3+2]=c.b;}
    o+=cnt;g.dispose();});
  const out=new THREE.BufferGeometry();out.setAttribute('position',new THREE.BufferAttribute(pos,3));
  out.setAttribute('normal',new THREE.BufferAttribute(nor,3));out.setAttribute('color',new THREE.BufferAttribute(cl,3));return out;}
function M(x,y,z,rx,ry,rz,sx,sy,sz){const m=new THREE.Matrix4();m.compose(new THREE.Vector3(x||0,y||0,z||0),
  new THREE.Quaternion().setFromEuler(new THREE.Euler(rx||0,ry||0,rz||0)),new THREE.Vector3(sx??1,sy??sx??1,sz??sx??1));return m;}

/* =====================================================================
   1. L'AULA MAGNA
   ===================================================================== */
const room=new THREE.Group();scene.add(room);
const C={white:col('#EEF0EF'),whiteShort:col('#F1F2F1'),cream:col('#DDD6C6'),blue:col('#4A729C'),
  skirt:col('#B39C80'),frameExt:col('#6B6862'),frameInt:col('#C4C6C6'),ceil:col('#F2F1EC')};
const matWall=new THREE.MeshLambertMaterial({color:C.white});
const matShort=new THREE.MeshLambertMaterial({color:C.whiteShort});
const matCream=new THREE.MeshLambertMaterial({color:C.cream});
const matBlue=new THREE.MeshLambertMaterial({color:C.blue});
const matSkirt=new THREE.MeshLambertMaterial({color:C.skirt});
const matFrameE=new THREE.MeshLambertMaterial({color:C.frameExt});
const matFrameI=new THREE.MeshLambertMaterial({color:C.frameInt});
function box(w,h,d,mat,x,y,z,parent){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);(parent||room).add(m);return m;}

// --- pavimento: texture procedurale del gres a blocchi diagonali ---
function floorTexture(){
  const PX=6;                       // pixel per cm → periodo 180 cm = 1080 px
  const S=180*PX,c=mkCanvas(S,S),g=c.getContext('2d'),r=rng(7);
  const COLS=[['#6F7275','#5f6265','#82858a'],['#E3D8BD','#d2c7ab','#efe6cf'],['#B98C82','#a77b71','#c99e94']];
  g.fillStyle='#7d7b76';g.fillRect(0,0,S,S);          // fuga
  function tile(x,y,s,set){const v=(r()-.5)*0.06;g.fillStyle=set[0];g.fillRect(x+1,y+1,s-2,s-2);
    g.globalAlpha=0.10+v;g.fillStyle=v>0?'#fff':'#000';g.fillRect(x+1,y+1,s-2,s-2);g.globalAlpha=1;
    // granigliatura
    const n=Math.floor(s*s/55);for(let i=0;i<n;i++){g.fillStyle=r()<.5?set[1]:set[2];g.globalAlpha=.55;
      g.fillRect(x+1+r()*(s-3),y+1+r()*(s-3),1.6,1.6);}g.globalAlpha=1;}
  for(let br=0;br<3;br++)for(let bc=0;bc<3;bc++){
    const k=(br+bc)%3,X=bc*60*PX,Y=br*60*PX;

(function mergeStatic(){room.updateMatrixWorld(true);const groups=new Map(),drop=[];
  room.traverse(o=>{if(!o.isMesh||o.isInstancedMesh||o===floor||o===ceil)return;const m=o.material;
    if(m.transparent||m.map||!(o.geometry instanceof THREE.BoxGeometry))return;
    if(!groups.has(m))groups.set(m,[]);groups.get(m).push({g:o.geometry,m:o.matrixWorld.clone()});drop.push(o);});
  drop.forEach(o=>o.parent.remove(o));
  groups.forEach((parts,mat)=>{const g=mergeParts(parts);g.deleteAttribute('color');room.add(new THREE.Mesh(g,mat));});})();

   Trascina = ruota · rotellina = zoom · destro/frecce = sposta · doppio clic = vola
   La telecamera non esce mai dall'aula: se serve, si accorcia la distanza.
   ===================================================================== */
const VIEW={target:new THREE.Vector3(0.4,0.3,-1.2),r:12.2,theta:-0.43,phi:1.38};   // dall'angolo della porta sul corridoio
const view={target:VIEW.target.clone(),r:VIEW.r,theta:VIEW.theta,phi:VIEW.phi};
const goal={target:view.target.clone(),r:view.r,theta:view.theta,phi:view.phi};
const LIM={rMin:0.25,rMax:16,phiMin:0.12,phiMax:1.50};
const IN={x0:ROOM.x0+0.35,x1:ROOM.x1-0.35,z0:ROOM.z0+0.3,z1:ROOM.z1-0.3,y0:0.10,y1:ROOM.h-0.12};
const _v=new THREE.Vector3(),_dir=new THREE.Vector3();
function camPos(t,r,th,ph,out){return out.set(t.x+r*Math.sin(ph)*Math.sin(th),t.y+r*Math.cos(ph),t.z+r*Math.sin(ph)*Math.cos(th));}
function inside(p){return p.x>IN.x0&&p.x<IN.x1&&p.z>IN.z0&&p.z<IN.z1&&p.y>IN.y0&&p.y<IN.y1;}
function fitRadius(t,r,th,ph){let lo=0,hi=r;camPos(t,r,th,ph,_v);if(inside(_v))return r;
  for(let i=0;i<18;i++){const m=(lo+hi)/2;camPos(t,m,th,ph,_v);if(inside(_v))lo=m;else hi=m;}return Math.max(lo,0.05);}
function clampTarget(t){t.x=clamp(t.x,IN.x0,IN.x1);t.z=clamp(t.z,IN.z0,IN.z1);t.y=clamp(t.y,0,2.6);}
function flyTo(target,r,theta,phi){goal.target.copy(target);clampTarget(goal.target);if(r!=null)goal.r=r;if(theta!=null)goal.theta=theta;if(phi!=null)goal.phi=phi;}
function updateCamera(dt){const k=1-Math.pow(0.0009,dt);           // smorzamento indipendente dal frame-rate
  view.target.lerp(goal.target,k);view.r=lerp(view.r,goal.r,k);
  let dth=goal.theta-view.theta;view.theta+=dth*k;view.phi=lerp(view.phi,goal.phi,k);
  const r=fitRadius(view.target,view.r,view.theta,view.phi);camPos(view.target,r,view.theta,view.phi,camera.position);
  camera.lookAt(view.target);}
let drag=null,downAt=null;

canvas.addEventListener('pointerdown',e=>{canvas.focus();drag={b:e.button,x:e.clientX,y:e.clientY,shift:e.shiftKey};downAt={x:e.clientX,y:e.clientY,t:performance.now()};
  canvas.setPointerCapture(e.pointerId);canvas.classList.add('drag');});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;

/* =====================================================================
   COSTRUTTORE DI ANIMALI LOW-POLY (condiviso dai mondi)
   Il corpo è un "tubo" lungo una curva nel piano sagittale (x avanti, y su):
   ogni punto è [x, y, raggio verticale, raggio laterale]. Coda e collo sono
   gruppi separati per poterli far ondeggiare; le zampe sono catene di giunti.
   Si progetta in METRI REALI; il mondo poi scala (es. 1:10).
   ===================================================================== */
function tube(pts,sides,sub){sides=sides||8;sub=sub||4;
  const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p[0],p[1],0)),false,'catmullrom',0.5);
  const n=(pts.length-1)*sub+1,pos=[],idx=[],side=new THREE.Vector3(0,0,1),nr=new THREE.Vector3(),c=new THREE.Vector3(),tg=new THREE.Vector3();
  for(let i=0;i<n;i++){const t=i/(n-1);curve.getPoint(t,c);curve.getTangent(t,tg);
    const f=t*(pts.length-1),k=Math.min(Math.floor(f),pts.length-2),u=f-k;
    const ry=lerp(pts[k][2],pts[k+1][2],u),rz=lerp(pts[k][3]??pts[k][2],pts[k+1][3]??pts[k+1][2],u);
    nr.crossVectors(side,tg).normalize();
    for(let j=0;j<sides;j++){const a=j/sides*Math.PI*2;pos.push(c.x+nr.x*Math.cos(a)*ry,c.y+nr.y*Math.cos(a)*ry,Math.sin(a)*rz);}}
  for(let i=0;i<n-1;i++)for(let j=0;j<sides;j++){const a=i*sides+j,b=i*sides+(j+1)%sides,c2=(i+1)*sides+j,d=(i+1)*sides+(j+1)%sides;idx.push(a,b,c2,b,d,c2);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);return g;}
const _cA=new THREE.Color();
function shadeGeo(g,cBack,cBelly,stripe,offX){g.computeVertexNormals();const p=g.attributes.position,n=g.attributes.normal,cnt=p.count,arr=new Float32Array(cnt*3);
  for(let i=0;i<cnt;i++){const ny=n.getY(i);_cA.copy(cBelly).lerp(cBack,smooth(clamp((ny+0.7)/0.95,0,1)));
    if(stripe&&ny>0.05&&Math.sin((p.getX(i)+(offX||0))*stripe.f)>0.5)_cA.lerp(stripe.c,0.5);
    arr[i*3]=_cA.r;arr[i*3+1]=_cA.g;arr[i*3+2]=_cA.b;}
  g.setAttribute('color',new THREE.BufferAttribute(arr,3));return g;}
function buildRig(sp){
  const cB=col(sp.col[0]),cL=col(sp.col[1]),stripe=sp.stripe?{c:col(sp.stripe),f:sp.stripeF||6}:null;
  const mat=new THREE.MeshPhongMaterial({vertexColors:true,flatShading:true,shininess:6,specular:0x0a0a0a});
  const acc=new THREE.MeshPhongMaterial({color:col(sp.accent||sp.col[0]),flatShading:true,shininess:6,side:THREE.DoubleSide});
  const root=new THREE.Group(),body=new THREE.Group();root.add(body);
  const R={root,body,legs:[],arms:[],wings:[],mat,acc,sp};
  const pc=k=>sp[k]?[col(sp[k][0]),col(sp[k][1])]:null,cHead=pc('headCol'),cLimb=pc('limbCol');
  const mk=(geo,parent,offX,cc)=>{shadeGeo(geo,cc?cc[0]:cB,cc?cc[1]:cL,cc?null:stripe,offX);const m=new THREE.Mesh(geo,mat);parent.add(m);return m;};
  R.mk=mk;
  if(sp.torso)mk(tube(sp.torso,sp.sides),body,0);
  if(sp.tail){const P=sp.tail.pts,mid=Math.floor(P.length/2);
    const t1=new THREE.Group();t1.position.set(sp.tail.pivot[0],sp.tail.pivot[1],0);body.add(t1);mk(tube(P.slice(0,mid+1),sp.sides),t1,sp.tail.pivot[0]);
    const t2=new THREE.Group();t2.position.set(P[mid][0],P[mid][1],0);t1.add(t2);
    mk(tube(P.slice(mid).map(p=>[p[0]-P[mid][0],p[1]-P[mid][1],p[2],p[3]]),sp.sides),t2,sp.tail.pivot[0]+P[mid][0]);R.tail1=t1;R.tail2=t2;}
  if(sp.neck){const nk=new THREE.Group();nk.position.set(sp.neck.pivot[0],sp.neck.pivot[1],0);body.add(nk);mk(tube(sp.neck.pts,sp.sides),nk,sp.neck.pivot[0]);R.neck=nk;
    const last=sp.neck.pts[sp.neck.pts.length-1],h=new THREE.Group();h.position.set(last[0],last[1],0);h.rotation.z=sp.head.tilt||0;nk.add(h);R.head=h;R.headRest=sp.head.tilt||0;
    mk(tube(sp.head.pts,sp.sides),h,0,cHead);
    if(sp.head.jaw){const J=sp.head.jaw,j=new THREE.Group();j.position.set(J.pivot[0],J.pivot[1],0);h.add(j);
      mk(tube(J.pts.map(p=>[p[0]-J.pivot[0],p[1]-J.pivot[1],p[2],p[3]]),Math.max(6,(sp.sides||8)-2)),j,0);R.jaw=j;}
    if(sp.head.eye){const e=sp.head.eye,eg=new THREE.SphereGeometry(e[3],6,4),em=new THREE.MeshBasicMaterial({color:0x15120e});
      [-1,1].forEach(s=>{const m=new THREE.Mesh(eg,em);m.position.set(e[0],e[1],s*e[2]);h.add(m);});}}
  const limb=(L,parent)=>{const hip=new THREE.Group();hip.position.set(L.x,L.y,L.z);parent.add(hip);const joints=[];let cur=hip;
    L.segs.forEach((s,i)=>{const j=i===0?hip:new THREE.Group();if(i>0){j.position.y=-L.segs[i-1][0];cur.add(j);}
      j.rotation.z=L.rest[i]||0;const g=new THREE.CylinderGeometry(s[1],s[2],s[0],6,1);g.translate(0,-s[0]/2,0);mk(g,j,0,L.arm?cHead||cLimb:cLimb);joints.push(j);cur=j;});
    let foot=null;if(L.foot){foot=new THREE.Group();foot.position.y=-L.segs[L.segs.length-1][0];cur.add(foot);
      const g=new THREE.BoxGeometry(L.foot[0],L.foot[2],L.foot[1]);g.translate(L.foot[0]*0.28,-L.foot[2]/2,0);mk(g,foot,0,sp.footCol?[col(sp.footCol),col(sp.footCol)]:cLimb);}
    return {hip,joints,foot,rest:L.rest.slice(),phase:L.phase||0,fore:!!L.fore};};
  (sp.legs||[]).forEach(L=>R.legs.push(limb(L,body)));
  (sp.arms||[]).forEach(L=>R.arms.push(limb({...L,arm:true},body)));
  R.legs.forEach(L=>{if(L.foot)L.foot.rotation.z=-L.rest.reduce((a,b)=>a+b,0);});
  if(sp.extras)sp.extras(R);
  root.updateMatrixWorld(true);const bb=new THREE.Box3().setFromObject(root);
  body.position.y=-bb.min.y;R.bodyY=body.position.y;R.size=bb.getSize(new THREE.Vector3());
  if(!sp.fly){const sh=new THREE.Mesh(new THREE.PlaneGeometry(1,1),matBlob.clone());sh.material.opacity=0.55;sh.rotation.x=-Math.PI/2;
    sh.scale.set(R.size.x*0.75,Math.max(R.size.z*1.3,R.size.x*0.28),1);sh.position.set((bb.min.x+bb.max.x)/2,0.04*Math.max(0.3,R.size.y),0);sh.renderOrder=1;root.add(sh);}
  return R;}
// animazione: phase = ciclo del passo, amp = 0 fermo … 1 cammina
function poseRig(R,phase,amp,t,seed,grazing){const sp=R.sp,A=(sp.A??0.36)*amp,K=(sp.K??0.6)*amp;
  R.legs.forEach(L=>{const ph=phase+L.phase,s=Math.sin(ph),c=Math.max(0,Math.cos(ph)),j=L.joints,sg=L.fore?1:-1;
    j[0].rotation.z=L.rest[0]+A*s*(L.fore?0.85:1);if(j[1])j[1].rotation.z=L.rest[1]+sg*K*c;if(j[2])j[2].rotation.z=L.rest[2]-sg*K*0.65*c;
    if(L.foot)L.foot.rotation.z=-(j.reduce((a,q)=>a+q.rotation.z,0))+(L.fore?0:0.25*A*s);});
  R.arms.forEach((L,i)=>{L.joints[0].rotation.z=L.rest[0]+0.12*Math.sin(t*1.3+i+seed)+(sp.human?-0.5*A*Math.sin(phase+(i?Math.PI:0)):0);});
  R.body.position.y=R.bodyY+(sp.bob??0.012)*R.size.y*amp*Math.cos(phase*2);
  if(R.tail1){R.tail1.rotation.y=0.10*Math.sin(t*0.9+seed)+0.06*amp*Math.sin(phase);R.tail2.rotation.y=0.16*Math.sin(t*0.9+seed-0.8);}
  if(R.neck){const gz=grazing||0;R.neck.rotation.z=lerp(0.04*Math.sin(t*0.6+seed),sp.grazeAng??-0.5,gz);R.neck.rotation.y=0.15*Math.sin(t*0.35+seed*2)*(1-amp*0.6);}

  if(R.jaw){const o=Math.pow(Math.max(0,Math.sin(t*0.55+seed*3)),12);R.jaw.rotation.z=-(sp.jawOpen??0.35)*o;}
  R.wings.forEach((w,i)=>{w.rotation.x=(i?1:-1)*(0.15+(sp.flap??0.55)*Math.sin(t*(sp.flapF??5)+seed));});}

/* ---------- modelli: famiglie di forme (proporzioni rispetto all'altezza dell'anca H) ---------- */
function tplTheropod(o){const H=o.H,b=o.bulk||1,X=v=>v*H,R=v=>v*H*b;
  const sp={col:o.col,stripe:o.stripe,stripeF:Math.PI*2/(0.42*H),accent:o.accent,sides:H<0.4?6:8,A:o.A??0.38,K:o.K??0.65,jawOpen:o.jawOpen,
    torso:[[X(-.32),X(.04),R(.25),R(.21)],[0,0,R(.34),R(.29)],[X(.30),X(-.07),R(.37),R(.31)],[X(.56),X(-.04),R(.30),R(.25)],[X(.70),X(.05),R(.21),R(.18)]]};
  const T=o.tail*H;sp.tail={pivot:[X(-.28),X(.03)],pts:[[X(.06),0,R(.23),R(.19)],[-.25*T,X(.02),R(.165),R(.14)],[-.5*T,X(.01),R(.11),R(.09)],[-.75*T,X(-.02),R(.06),R(.05)],[-T,X(-.05),X(.012),X(.012)]]};
  const N=o.neck*H,a=o.neckAng,nk=o.neckThin||1;

// ---------- terreno del plastico ----------
function islandMask(x,z){const u=(x-ISL.cx)/ISL.a,v=(z-ISL.cz)/ISL.b,an=Math.atan2(v,u);
  const wob=1+0.05*Math.sin(an*5+1)+0.035*Math.sin(an*9+2)+0.02*Math.sin(an*17);
  return 1-Math.pow(Math.pow(Math.abs(u),4)+Math.pow(Math.abs(v),4),0.25)/wob;}
function lakeF(x,z){const u=(x-LAKE.x)/LAKE.a,v=(z-LAKE.z)/LAKE.b;return 1-Math.sqrt(u*u+v*v);}
function groundH(x,z){const m=islandMask(x,z);if(m<=0)return 0;const e=smooth(clamp(m/0.06,0,1));
  let h=0.075+0.06*Math.sin(x*0.85+1.3)*Math.cos(z*0.5-0.4)+0.04*Math.sin(z*1.25+x*0.45)+0.018*Math.sin(x*2.6-z*1.9);
  h+=0.16*Math.exp(-((x+2.2)**2/2.2+(z+6.2)**2/4));                   // collina verso la parete delle sedie
  const l=lakeF(x,z);if(l>-0.3)h=lerp(h,0.012,smooth(clamp((l+0.3)/0.38,0,1)));
  return Math.max(0.012,h)*e;}
const SOIL=[[252,'#B78657'],[205,'#A48858'],[198,'#7E8C50'],[150,'#6F8E4A'],[120,'#6B9248'],[66,'#6E9A4C'],[35,'#80A453'],[0,'#88AA5A']].map(s=>[s[0],col(s[1])]);
const soilAt=t=>{for(let i=0;i<SOIL.length-1;i++){const a=SOIL[i],b=SOIL[i+1];if(t<=a[0]&&t>=b[0])return a[1].clone().lerp(b[1],(a[0]-t)/(a[0]-b[0]));}return SOIL[SOIL.length-1][1].clone();};
let groundMat,dustT=0;
function buildGround(){const GX=78,GZ=168,x0=ISL.cx-ISL.a*1.06,x1=ISL.cx+ISL.a*1.06,z0=ISL.cz-ISL.b*1.03,z1=ISL.cz+ISL.b*1.03;
  const pos=[],clr=[],idx=[],r=rng(5);
  for(let j=0;j<=GZ;j++)for(let i=0;i<=GX;i++){const x=lerp(x0,x1,i/GX),z=lerp(z0,z1,j/GZ),m=islandMask(x,z);
    pos.push(x,groundH(x,z),z);let v=0.86+0.1*Math.sin(x*7.1+z*3.3)*Math.cos(z*5.7-x*2.1)+(r()-.5)*0.08;
    if(m<0.03)v*=0.62;const l=lakeF(x,z);if(l>-0.42&&l<-0.18)v*=1.12;clr.push(v,v*0.98,v*0.94);}
  for(let j=0;j<GZ;j++)for(let i=0;i<GX;i++){const a=j*(GX+1)+i,b=a+1,c=a+GX+1,d=c+1;
    const mx=Math.max(...[a,b,c,d].map(k=>islandMask(pos[k*3],pos[k*3+2])));if(mx<=-0.02)continue;idx.push(a,c,b,b,c,d);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(clr,3));g.setIndex(idx);g.computeVertexNormals();
  // polygonOffset: il terreno vince sempre sul pavimento dove i due quasi coincidono (bordo, emersione)
  groundMat=new THREE.MeshLambertMaterial({vertexColors:true,color:soilAt(T0),polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-4});
  const m=new THREE.Mesh(g,groundMat);m.name='plastico';root.add(m);W.surfaces.push(m);
  const water=new THREE.Mesh(new THREE.CircleGeometry(1,40),new THREE.MeshPhongMaterial({color:col('#4E86A6'),shininess:90,specular:0x667788,transparent:true,opacity:0.88}));
  water.rotation.x=-Math.PI/2;water.scale.set(LAKE.a*1.02,LAKE.b*1.02,1);water.position.set(LAKE.x,0.034,LAKE.z);root.add(water);}

  switch(type){
  case 'conifera':trunk(1.0,0.045,0.025);for(let i=0;i<4;i++)add(new THREE.ConeGeometry(0.30-0.06*i,0.5,7),M(0,0.5+0.27*i,0),i%2?'#2F5233':'#355A37');break;
  case 'araucaria':trunk(1.55,0.04,0.025,'#5e4a33');for(let i=0;i<4;i++)add(new THREE.ConeGeometry(0.36-0.07*i,0.16,8),M(0,1.2+0.13*i,0),'#3B5B33');break;
  case 'felce':for(let i=0;i<8;i++){const a=i/8*Math.PI*2;add(new THREE.ConeGeometry(0.035,0.26,4),M(Math.cos(a)*0.08,0.09,Math.sin(a)*0.08,0,-a,0).multiply(M(0,0,0,0,0,-1.0)),i%2?'#4F7A35':'#5C8A3C');}break;
  case 'equiseto':for(let i=0;i<7;i++){const h=0.18+r()*0.2;add(new THREE.CylinderGeometry(0.008,0.011,h,5),M((r()-.5)*0.12,h/2,(r()-.5)*0.12,(r()-.5)*0.2,0,(r()-.5)*0.2),'#6E8B3D');}break;
  case 'cicade':trunk(0.2,0.08,0.06,'#6b5634');for(let i=0;i<10;i++){const a=i/10*Math.PI*2;add(new THREE.ConeGeometry(0.05,0.38,4),M(Math.cos(a)*0.12,0.3,Math.sin(a)*0.12,0,-a,0).multiply(M(0,0,0,0,0,-0.85)).multiply(M(1,1,0.3)),'#4E7A33');}break;
  case 'felceArborea':trunk(0.95,0.04,0.028,'#4d3b28');for(let i=0;i<9;i++){const a=i/9*Math.PI*2;add(new THREE.ConeGeometry(0.05,0.55,4),M(Math.cos(a)*0.2,0.92,Math.sin(a)*0.2,0,-a,0).multiply(M(0,0,0,0,0,-1.3)).multiply(M(1,1,0.25)),'#4C7D3A');}break;
  case 'ginkgo':trunk(0.8,0.05,0.03);[[0,1.0,0,0.3],[0.15,1.2,0.1,0.24],[-0.12,1.15,-0.08,0.26]].forEach(p=>add(new THREE.IcosahedronGeometry(p[3],0),M(p[0],p[1],p[2]),'#7FA046'));break;
  case 'cespuglio':[[0,0.08,0,0.11],[0.08,0.06,0.05,0.08],[-0.07,0.06,-0.04,0.08]].forEach(p=>add(new THREE.IcosahedronGeometry(p[3],0),M(p[0],p[1],p[2]),'#5E8F3E'));break;
  case 'fiore':for(let i=0;i<6;i++){const a=i/6*Math.PI*2;add(new THREE.IcosahedronGeometry(0.022,0),M(Math.cos(a)*0.09,0.15+r()*0.04,Math.sin(a)*0.09),'#ffffff');}break;
  case 'latifoglia':trunk(0.75,0.06,0.035);[[0,0.95,0,0.34],[0.2,0.85,0.1,0.25],[-0.18,0.9,-0.12,0.27],[0.02,1.15,-0.05,0.24]].forEach(p=>add(new THREE.IcosahedronGeometry(p[3],0),M(p[0],p[1],p[2]),'#4F8239'));break;
  case 'erba':for(let i=0;i<9;i++){const h=0.08+r()*0.08;add(new THREE.ConeGeometry(0.01,h,3),M((r()-.5)*0.1,h/2,(r()-.5)*0.1,(r()-.5)*0.5,0,(r()-.5)*0.5),i%2?'#7DA24A':'#8DB055');}break;
  case 'palma':{let x=0,y=0;for(let i=0;i<4;i++){add(new THREE.CylinderGeometry(0.03,0.038,0.3,6),M(x,y+0.15,0,0,0,-0.08*i),'#7a6243');x+=0.025*i;y+=0.29;}
    for(let i=0;i<8;i++){const a=i/8*Math.PI*2;add(new THREE.ConeGeometry(0.05,0.5,4),M(x+Math.cos(a)*0.18,y,Math.sin(a)*0.18,0,-a,0).multiply(M(0,0,0,0,0,-1.45)).multiply(M(1,1,0.25)),'#4E8236');}}break;}
  return mergeParts(P);}

function buildFlora(){const r=rng(99);const FLOWER=['#F2D34B','#F7F3EA','#E58FB0','#B48BD6','#F0A04B'].map(col);
  FLORA.forEach(([type,n,from,to,delay,survive,smin,smax,edge])=>{const geo=plantGeo(type),mat=new THREE.MeshLambertMaterial({vertexColors:true});
    const im=new THREE.InstancedMesh(geo,mat,n);im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);root.add(im);const items=[];
    for(let i=0;i<n;i++){let x,z,k=0;do{x=ISL.cx+(r()*2-1)*ISL.a*0.95;z=ISL.cz+(r()*2-1)*ISL.b*0.95;k++;}
      while(k<60&&(islandMask(x,z)<0.07||lakeF(x,z)>-0.12||Math.hypot(x-FIRE.x,z-FIRE.z)<0.7||(edge&&k<45&&islandMask(x,z)>0.42)));
      const it={x,z,y:groundH(x,z),rot:r()*Math.PI*2,size:smin+r()*(smax-smin),appear:from-r()*delay,vanish:r()<survive?-1:to,s:0};
      if(type==='fiore'){im.setColorAt(i,FLOWER[Math.floor(r()*FLOWER.length)]);}items.push(it);}
    if(im.instanceColor)im.instanceColor.needsUpdate=true;flora.push({im,items});});}
const _q=new THREE.Quaternion(),_e=new THREE.Euler(),_s=new THREE.Vector3(),_t=new THREE.Vector3(),_mm=new THREE.Matrix4();
function updateFlora(dt,force){const k=1-Math.pow(0.02,dt);
  flora.forEach(f=>{let dirty=force;f.items.forEach((it,i)=>{const on=tNow<=it.appear&&tNow>=it.vanish?1:0;
    if(Math.abs(it.s-on)>0.002||force){it.s=force?on:lerp(it.s,on,k);if(Math.abs(it.s-on)<0.003)it.s=on;
      const s=Math.max(1e-4,it.s*it.size);_mm.compose(_t.set(it.x,it.y,it.z),_q.setFromEuler(_e.set(0,it.rot,0)),_s.set(s,s,s));f.im.setMatrixAt(i,_mm);dirty=true;}});
    if(dirty)f.im.instanceMatrix.needsUpdate=true;});}

  openPanel({title:p.n,badges:[[(p.a>T0?'252':fmtNum(p.a))+'–'+(p.b===0?'oggi':fmtNum(p.b)+' milioni di anni fa'),'gold']],text:[e.ambiente||''].filter(Boolean),doc:{nota:e.nota,fonti:e.fonti},
    note:'Sul pavimento questo periodo è lungo '+((Math.min(p.a,T0)-p.b)/T0*LEN).toFixed(1).replace('.',',')+' metri.',
    actions:[{label:'Vai all\'inizio del '+p.n,fn:()=>setGoal(Math.min(p.a,T0)-0.5)}]},()=>new THREE.Vector3(STRIP.x1,0.05,zOf((Math.min(p.a,T0)+p.b)/2)));}
function openAsteroid(){const e=DATI_TEMPO.estinzione;
  openPanel({title:'L\'asteroide di Chicxulub',badges:[['fine del Cretaceo'],['66 milioni di anni fa','gold']],text:e.testo,doc:{nota:e.nota,fonti:e.fonti},
    note:'Sul pavimento l\'asteroide cade a '+(66/T0*LEN).toFixed(1).replace('.',',')+' metri da «Oggi».',
    actions:[{label:'Rivedi l\'impatto',fn:()=>{setGoal(67,true);setTimeout(()=>setGoal(65.5),300);}}]},()=>new THREE.Vector3(STRIP.x1,0.05,zOf(66)));}
function openHuman(){const u=DATI_TEMPO.umani;const hum=animals.find(a=>a.human);
  openPanel({title:'Homo sapiens',sci:'«uomo sapiente»',badges:[['Cenozoico'],['da circa '+Math.round(u.homo_sapiens_anni).toLocaleString('it-IT')+' anni fa','gold']],
    text:u.testo,doc:{nota:u.nota,fonti:u.fonti},fig:`<p class="tl-stopname">Anche i nostri denti raccontano che cosa mangiamo</p>${teethSVG('umani')}`,
    note:'Sulla linea del tempo l\'uomo occupa solo gli ultimi '+(u.homo_sapiens_anni/1e6/T0*LEN*100).toFixed(1).replace('.',',')+' cm prima di «Oggi». Da qui comincia la storia che si studia in terza.'},
    ()=>hum&&hum.app>0.5?labelAnchor(hum):new THREE.Vector3(STRIP.x1,0.05,zOf(0.3)));}

// ---------- pannello di controllo (dock) ----------
const dock=document.createElement('div');dock.className='dock tl';W.dock=dock;document.body.appendChild(dock);
const ICON_PREV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
const ICON_NEXT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
const ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
dock.innerHTML=`<div class="tl-row"><div class="tl-read"><b id="tlMa"></b><span id="tlUnit"></span></div><span class="badge" id="tlEra"></span><span class="tl-stopname" id="tlStop"></span>
  <div class="tl-btns"><button id="tlPrev" title="Tappa precedente">${ICON_PREV}Prima</button><button class="play" id="tlPlay" title="Viaggio nel tempo">${ICON_PLAY}Viaggia</button><button id="tlNext" title="Tappa successiva">Dopo${ICON_NEXT}</button></div></div>
  <div class="tl-track"><div class="tl-stops" id="tlStops"></div><div class="tl-bands">${PERIODI.map(p=>`<div style="flex:${Math.min(p.a,T0)-p.b};background:${p.c}">${p.n.toUpperCase()}</div>`).join('')}</div>
  <input class="tl-range" id="tlRange" type="range" min="0" max="${T0*10}" step="1" aria-label="Linea del tempo"><div class="tl-ticks">${[250,200,150,100,50,0].map(t=>`<span style="left:${(T0-t)/T0*100}%">${t||'oggi'}</span>`).join('')}</div></div>
  <div class="tl-note">Sul pavimento, lungo le vetrate: 1 metro = circa 13 milioni di anni. Animali e piante del plastico in scala 1:10. Nel plastico compaiono insieme animali vissuti nello stesso periodo, anche se in continenti diversi.</div>`;
const $=id=>dock.querySelector('#'+id);
const range=$('tlRange');range.addEventListener('input',()=>{playing=false;updPlayBtn();setGoal(T0-range.value/10);});
$('tlPrev').onclick=()=>{playing=false;updPlayBtn();nextStop(-1);};$('tlNext').onclick=()=>{playing=false;updPlayBtn();nextStop(1);};
$('tlPlay').onclick=()=>{playing=!playing;if(playing){if(tGoal<0.05)setGoal(T0,true);playWait=0.4;}updPlayBtn();};
function updPlayBtn(){$('tlPlay').innerHTML=playing?ICON_PAUSE+'Pausa':ICON_PLAY+'Viaggia';}
STOPS.forEach((s,i)=>{const b=document.createElement('button');b.style.left=((T0-s.t)/T0*100)+'%';if(i>0&&Math.abs(STOPS[i-1].t-s.t)<3){s.nudge=(STOPS[i-1].nudge||0)+1;b.style.marginLeft=(s.nudge*13)+'px';}b.title=fmtT(s.t)+' — '+s.name;if(s.ast)b.classList.add('ast');
  b.onclick=()=>{playing=false;updPlayBtn();goStop(i);};$('tlStops').appendChild(b);s.el=b;});
let lastStopShown=-2;
function updateDock(){const txt=fmtT(tNow),m=txt.match(/^([\d.,]+)\s(.*)$/);
  $('tlMa').textContent=m?m[1]:txt;$('tlUnit').textContent=m?m[2]:'';$('tlEra').textContent=periodOf(tNow).n;
  if(document.activeElement!==range)range.value=String(Math.round((T0-tNow)*10));
  const si=nearestStop(tNow);if(si!==lastStopShown){lastStopShown=si;$('tlStop').textContent=si>=0?STOPS[si].name:'';STOPS.forEach((s,i)=>s.el.classList.toggle('on',i===si));}
  cursorLabel.el.querySelector('span').textContent=txt;}

// ---------- ciclo del mondo ----------
W.build=()=>{buildGround();buildFlora();buildStrip();buildAnimals();buildFire();buildMeteor();updateFlora(0,true);};
W.setTime=t=>setGoal(t,true);W.stops=STOPS;W.animals=animals;
W.enter=()=>{};W.entered=()=>{toast('Usa la linea del tempo in basso, oppure fai clic sulla striscia colorata sul pavimento',4200);};
W.exit=()=>{playing=false;updPlayBtn();};
W.pickables=()=>[strip,...animals.filter(a=>a.app>0.5).map(a=>a.R.root)];
W.update=(dt,t)=>{
  if(playing){if(playWait>0){playWait-=dt;}else{const i=STOPS.findIndex(s=>s.t<tGoal-0.05);
      if(Math.abs(tNow-tGoal)<0.05){if(i<0){playing=false;updPlayBtn();}else{goStop(i);playWait=Math.abs(STOPS[i].t-tNow)>0.01?2.8:0;}}}}
  // avvicinamento al tempo obiettivo: veloce nei grandi salti, preciso vicino all'arrivo
  const k=1-Math.pow(0.04,dt);let nt=lerp(tNow,tGoal,k);if(Math.abs(nt-tGoal)<0.002)nt=tGoal;
  if(tGoal<1&&tNow>=1)nt=Math.max(tGoal,tNow-Math.max(1.5,(tNow-tGoal)*k));
  if(lastT>66&&nt<=66&&tGoal<=66)startMeteor();lastT=tNow=nt;
  groundMat.color.copy(soilAt(tNow));if(dustT>0){dustT=Math.max(0,dustT-dt*0.35);groundMat.color.lerp(col('#77736a'),dustT*0.7);}
  cursor.position.z=zOf(tNow);updateFlora(dt,false);updateAnimals(dt,t);updateMeteor(dt);
  fire.visible=tNow<=0.31;if(fire.visible){const f=1+0.25*Math.sin(t*17)+0.15*Math.sin(t*29);fire.userData.f1.scale.set(1,f,1);fire.userData.f2.scale.set(1,2-f,1);}
  updateDock();};
registerWorld(W);return W;})();

/* =====================================================================
   5. CICLO PRINCIPALE + controllo prestazioni (iMac late 2015)
   ===================================================================== */
const clock=new THREE.Clock();let fpsAcc=0,fpsN=0,fpsChecked=false,elapsed=0;
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
const DTMAX=/[?&]prova=1/.test(location.search)?5:0.05;   // prova=1: solo per gli screenshot automatici
function loop(){const dt=Math.min(clock.getDelta(),DTMAX);elapsed+=dt;
  keyPan(dt);runTweens(dt);if(current&&current.update)current.update(dt,elapsed);
  updateCamera(dt);renderer.render(scene,camera);updateLabels();updatePanel();
  // dopo 4 s, se il frame-rate è basso, si abbassa la risoluzione di rendering
  if(!fpsChecked&&elapsed>2){fpsAcc+=dt;fpsN++;if(fpsAcc>2){fpsChecked=true;const fps=fpsN/fpsAcc;
    if(fps<40&&pixelRatio>0.8){pixelRatio=0.8;renderer.setPixelRatio(pixelRatio);resize();}}}
  if(fpsBox){fpsF++;fpsT+=dt;if(fpsT>=0.5){const r=renderer.info.render;
    fpsBox.textContent=`${Math.round(fpsF/fpsT)} fps · ${r.calls} draw call · ${Math.round(r.triangles/1000)}k triangoli · risoluzione ${pixelRatio}`;fpsF=0;fpsT=0;}}
  requestAnimationFrame(loop);}
// ?fps=1 → contatore prestazioni (per le prove sugli iMac del laboratorio)
let fpsBox=null,fpsF=0,fpsT=0;
if(/[?&]fps=1/.test(location.search)){fpsBox=document.createElement('div');
  fpsBox.style.cssText='position:fixed;right:16px;top:74px;z-index:25;background:rgba(14,68,35,.9);color:#fff;font:600 14px Lexend,sans-serif;padding:6px 12px;border-radius:10px';
  document.body.appendChild(fpsBox);}
document.getElementById('helpMin').onclick=()=>{const h=document.getElementById('help');h.classList.toggle('min');
  document.getElementById('helpMin').textContent=h.classList.contains('min')?'mostra':'nascondi';};
renderTabs();updateCamera(1);
// link diretti per i docenti: ?mondo=tempo&t=153  (t = milioni di anni fa)
const QS=new URLSearchParams(location.search);
requestAnimationFrame(()=>requestAnimationFrame(()=>{document.getElementById('loading').classList.add('done');loop();
  const m=QS.get('mondo');if(m&&WORLDS.find(w=>w.id===m)){switchWorld(m).then(()=>{const w=current;
    if(QS.has('t')&&w&&w.setTime)w.setTime(parseFloat(QS.get('t')));if(QS.has('cam')){const c=QS.get('cam').split(',').map(Number);
      if(c.length===6)flyTo(new THREE.Vector3(c[0],c[1],c[2]),c[3],c[4],c[5]);}});}}));
window.__aula={scene,camera,renderer,switchWorld,flyTo,view,goal,WORLDS,get current(){return current;}};
</script>
