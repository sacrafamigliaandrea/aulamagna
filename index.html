<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aula Magna 3D — Mondi sul pavimento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Palette Wimbledon (portale acerio) — ambra al posto del rosso, oro come accento */
:root{
  --green:#1B6D3F; --green2:#22804A; --greenD:#0E4423; --greenL:rgba(27,109,63,.08);
  --gold:#B8860B;  --gold2:#D4A017; --goldL:rgba(184,134,11,.10);
  --cream:#F5F9F5; --card:#FFFFFF;  --text:#1A2E1A; --muted:#4A6B4A; --light:#8BA88B;
  --brd:#C8DCC8;   --brd2:#A8C4A8;  --warn:#B8860B;
  --shadow:0 6px 24px rgba(14,68,35,.16);
  --body:'Atkinson Hyperlegible',Helvetica,Arial,sans-serif;
  --head:'Lexend',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#dfe6e9;color:var(--text);font-family:var(--body);font-size:18px;line-height:1.5}
button{font-family:var(--head);cursor:pointer}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;cursor:grab}
#c.drag{cursor:grabbing}

/* ---------- barra superiore ---------- */
.top{position:fixed;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:18px;padding:0 18px;
  background:rgba(255,255,255,.94);border-bottom:1px solid var(--brd);box-shadow:0 2px 12px rgba(27,109,63,.06);z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:700;font-size:20px;color:var(--greenD);white-space:nowrap}
.brand svg{width:30px;height:30px}
.brand small{display:block;font-weight:400;font-size:13px;color:var(--muted);letter-spacing:.02em}
.tabs{display:flex;gap:8px;margin:0 auto}
.tab{display:flex;align-items:center;gap:9px;border:1.5px solid var(--brd);background:#fff;color:var(--text);
  border-radius:999px;padding:7px 16px 7px 10px;font-size:16px;font-weight:500;transition:background .15s,border-color .15s}
.tab svg{width:24px;height:24px;flex:none}
.tab .sub{display:block;font-family:var(--body);font-size:12.5px;font-weight:400;color:var(--muted);line-height:1.1}
.tab span{text-align:left;line-height:1.15}
.tab:hover{border-color:var(--green2)}
.tab.on{background:var(--green);border-color:var(--green);color:#fff}
.tab.on .sub{color:rgba(255,255,255,.85)}
.tools{display:flex;gap:8px}
.ibtn{display:flex;align-items:center;gap:7px;border:1.5px solid var(--brd);background:#fff;border-radius:10px;padding:7px 12px;font-size:15px;color:var(--greenD)}
.ibtn svg{width:20px;height:20px}
.ibtn:hover{border-color:var(--green2)}

/* ---------- etichette nel mondo ---------- */
#labels{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.tag{position:absolute;left:0;top:0;pointer-events:auto;transform:translate(-9999px,-9999px);
  display:flex;align-items:center;gap:6px;white-space:nowrap;padding:4px 11px 4px 8px;border-radius:999px;
  background:rgba(255,255,255,.95);border:1.5px solid var(--green);color:var(--greenD);
  font-family:var(--head);font-size:14px;font-weight:500;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12);
  transition:opacity .25s, background .15s}
.tag i{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none}
.tag:hover,.tag.on{background:var(--gold);border-color:var(--gold);color:#fff}
.tag:hover i,.tag.on i{background:#fff}
.tag.small{font-size:12.5px;padding:2px 9px 2px 6px}
.tag.hide{opacity:0;pointer-events:none}

/* ---------- pannello informativo ---------- */
#lead{position:fixed;inset:0;pointer-events:none;z-index:9}
#lead line{stroke:var(--gold);stroke-width:2}
#lead circle{fill:var(--gold)}
.info{position:fixed;left:0;top:0;width:340px;max-height:calc(100vh - 170px);overflow:auto;z-index:10;
  background:var(--card);border-radius:14px;border-left:6px solid var(--green);box-shadow:var(--shadow);
  padding:16px 18px 16px 18px;display:none}
.info.open{display:block;animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.info h2{margin:0 34px 4px 0;font-family:var(--head);font-size:22px;line-height:1.2;color:var(--greenD)}
.info .sci{font-style:italic;color:var(--muted);font-size:16px;margin:0 0 6px}
.info .badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.badge{display:inline-block;font-family:var(--head);font-size:13px;font-weight:500;padding:2px 10px;border-radius:999px;background:var(--greenL);color:var(--greenD);border:1px solid var(--brd)}
.badge.gold{background:var(--goldL);color:#7a5a07;border-color:#e3cf9a}
.info dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 10px;font-size:16px}
.info dt{color:var(--muted)}
.info dd{margin:0;font-weight:700}
.info p{margin:0 0 8px}
.info .x{position:absolute;right:10px;top:10px;width:32px;height:32px;border:none;background:transparent;border-radius:8px;color:var(--muted)}
.info .x:hover{background:var(--greenL)}
.info .x svg{width:20px;height:20px}
.info .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{border:none;border-radius:10px;padding:8px 14px;font-size:15px;font-weight:600;background:var(--green);color:#fff}
.btn:hover{background:var(--green2)}
.btn.gold{background:var(--gold)}
.btn.ghost{background:#fff;color:var(--greenD);border:1.5px solid var(--brd)}
.info .note{font-size:14px;color:var(--muted);border-top:1px solid var(--brd);padding-top:8px;margin-top:6px}
.info details.doc{margin-top:10px;font-size:14px;color:var(--muted);border-top:1px solid var(--brd);padding-top:6px}
.info details.doc summary{cursor:pointer;font-family:var(--head);color:var(--greenD)}
.info details.doc a{color:var(--green);word-break:break-all}
.info details.doc ul{margin:4px 0 0;padding-left:18px}
.info .fig{display:block;width:100%;height:auto;margin:4px 0 10px;border-radius:8px;background:var(--cream)}

/* ---------- dock in basso (strumenti del mondo) ---------- */
.dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:12;background:rgba(255,255,255,.96);
  border:1px solid var(--brd);border-radius:16px;box-shadow:var(--shadow);padding:12px 18px;display:none}
.dock.open{display:block}

/* ---------- aiuto navigazione ---------- */
.help{position:fixed;left:16px;bottom:16px;z-index:11;background:rgba(255,255,255,.94);border:1px solid var(--brd);
  border-radius:14px;padding:10px 14px;font-size:15px;box-shadow:var(--shadow);max-width:290px}
.help h3{margin:0 0 6px;font-family:var(--head);font-size:15px;color:var(--greenD);display:flex;justify-content:space-between;align-items:center}
.help h3 button{border:none;background:none;color:var(--muted);font-size:13px;padding:0}
.help ul{list-style:none;margin:0;padding:0}
.help li{display:flex;gap:9px;align-items:center;margin:4px 0}
.help li svg{width:22px;height:22px;flex:none;color:var(--green)}
.help.min ul{display:none}

/* ---------- velo di transizione e caricamento ---------- */
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:15;transition:opacity .25s}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--cream);z-index:30;
  font-family:var(--head);font-size:20px;color:var(--greenD);transition:opacity .5s}
#loading.done{opacity:0;pointer-events:none}
.toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);z-index:14;background:var(--greenD);color:#fff;
  font-family:var(--head);font-size:16px;padding:9px 18px;border-radius:12px;box-shadow:var(--shadow);opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
/* ---------- volo iniziale ---------- */
.intro-cap{position:fixed;left:50%;bottom:54px;transform:translateX(-50%);z-index:13;max-width:min(980px,86vw);text-align:center;
  background:rgba(14,68,35,.92);color:#fff;font-family:var(--head);font-size:26px;font-weight:500;line-height:1.3;padding:14px 28px;border-radius:16px;
  box-shadow:var(--shadow);opacity:0;transition:opacity .45s;pointer-events:none}
.intro-cap.on{opacity:1}
.intro-cap small{display:block;font-family:var(--body);font-size:17px;font-weight:400;opacity:.9;margin-top:2px}
.intro-skip{position:fixed;right:20px;bottom:22px;z-index:14;display:none}
.intro-bar{position:fixed;left:0;bottom:0;height:5px;background:var(--gold);z-index:14;width:0}
.tabs.pulse .tab:not(.on){animation:pulse 1.1s ease-in-out 4}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(212,160,23,.45);border-color:var(--gold)}}

/* ---------- etichette speciali ---------- */
.tag.sea{background:none;border:none;box-shadow:none;color:#2c5f8a;font-style:italic;font-weight:600;pointer-events:none;font-size:15px}
.tag.state{background:none;border:none;box-shadow:none;color:#5f6058;font-weight:600;letter-spacing:.06em;text-transform:uppercase;pointer-events:none;font-size:12px}
.tag.sea i,.tag.state i{display:none}
.tag.reg{background:rgba(255,255,255,.88);border-color:#6b7d6b;color:#2d3b2d;text-transform:uppercase;letter-spacing:.04em;font-size:12.5px}
.tag.home{background:var(--gold);border-color:var(--gold);color:#fff}
.tag.home i{background:#fff}
.tag.unesco{border-color:#4B3F8F;color:#2E2660}          /* siti UNESCO: viola per i culturali, verde per i naturali */
.tag.unesco.nat{border-color:#1E7A4C;color:#14502F}
/* ---------- dock Italia ---------- */
.it{width:min(1000px,calc(100vw - 360px))}
.it-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.it-row+.it-row{margin-top:10px;padding-top:10px;border-top:1px solid var(--brd)}
.seg{display:flex;border:1.5px solid var(--green);border-radius:10px;overflow:hidden}
.seg button{border:none;background:#fff;color:var(--greenD);font-size:15px;padding:7px 14px}
.seg button.on{background:var(--green);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--brd);border-radius:999px;padding:4px 11px;font-family:var(--head);font-size:14px;cursor:pointer;background:#fff;user-select:none}
.chip input{display:none}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.off{opacity:.45}
.legend{display:flex;gap:10px;font-size:13px;color:var(--muted);margin-left:auto}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{display:inline-block;width:18px;height:11px;border-radius:3px}
.legend .btn{padding:5px 11px;font-size:14px}
.cmp-chip{display:inline-flex;align-items:center;gap:6px;background:var(--greenL);border:1px solid var(--brd);border-radius:999px;padding:3px 6px 3px 11px;font-family:var(--head);font-size:14px}
.cmp-chip button{border:none;background:none;color:var(--muted);width:22px;height:22px;border-radius:50%;padding:0;font-size:15px;line-height:1}
.cmp-chip button:hover{background:#fff}
.it select{font-family:var(--body);font-size:15px;padding:6px 8px;border-radius:9px;border:1.5px solid var(--brd);background:#fff;color:var(--text)}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center;font-size:15px;margin:4px 0 12px}
.bars .bar{height:14px;border-radius:7px;background:var(--green);min-width:3px}
.bars h4{grid-column:1/-1;margin:6px 0 0;font-family:var(--head);font-size:15px;color:var(--greenD)}
/* ---------- gioco raccolta differenziata ---------- */
.rac{width:min(980px,calc(100vw - 360px))}
.rac-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.rac-row+.rac-row{margin-top:10px;padding-top:10px;border-top:1px solid var(--brd)}
.rac .lbl{display:block;font-family:var(--head);font-size:13px;color:var(--muted);margin-bottom:3px}
.rac-en{flex:1 1 260px;display:grid;grid-template-columns:1fr auto;column-gap:10px;align-items:center}
.rac-en .lbl{grid-column:1/-1}
.rac-en .bar{height:16px;border-radius:8px;background:#E3EBE3;overflow:hidden}
.rac-en .bar i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .15s}
.rac-en .bar i.low{background:var(--warn)}
.rac-en b{font-family:var(--head);font-size:20px;color:var(--greenD)}
.rac-bag #racBag{display:flex;gap:6px}
.slot{display:inline-flex;align-items:center;min-width:120px;max-width:190px;height:34px;padding:0 10px;border:1.5px dashed var(--brd2);border-radius:9px;font-size:14px;color:var(--light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.full{border-style:solid;border-color:var(--green);color:var(--text);background:var(--greenL);font-weight:700}
.rac-cnt b{font-family:var(--head);font-size:22px;color:var(--greenD)}
.rac-tools .btn{font-size:14px;padding:7px 12px}
.rac-seed{margin-left:auto;font-size:13px;color:var(--muted)}
.rac-seed code{font-family:ui-monospace,Menlo,monospace;background:var(--greenL);padding:2px 6px;border-radius:5px;color:var(--greenD)}
.coach{position:fixed;left:50%;bottom:190px;transform:translateX(-50%);z-index:13;max-width:min(720px,80vw);background:var(--greenD);color:#fff;
  font-family:var(--head);font-size:18px;line-height:1.35;padding:12px 20px;border-radius:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .3s}
.coach.on{opacity:1}
.rtip{position:fixed;left:0;top:0;z-index:16;display:none;pointer-events:none;background:#fff;border:1.5px solid var(--green);border-radius:10px;padding:5px 10px;box-shadow:var(--shadow);font-size:15px}
.rtip b{display:block;font-family:var(--head);color:var(--greenD)}
.rtip span{font-size:13px;color:var(--muted)}
.rmodal{position:fixed;inset:0;z-index:22;background:rgba(14,40,24,.38);display:none;align-items:center;justify-content:center}
.rmodal.open{display:flex}
.rcard{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:26px 30px;width:min(640px,92vw);max-height:88vh;overflow:auto;border-top:6px solid var(--green)}
.rcard h2{font-family:var(--head);font-size:28px;margin:0 0 8px;color:var(--greenD)}
.rcard p{font-size:20px;margin:0 0 14px}
.rstep{font-family:var(--head);font-size:14px;color:var(--gold);font-weight:600;margin-bottom:6px}
.racts{display:flex;justify-content:flex-end;gap:10px;margin-top:10px}
.racts .btn{font-size:17px;padding:10px 18px}
.rbins{display:flex;gap:8px;margin:4px 0 12px}
.rbins figure{margin:0;flex:1;text-align:center}
.rbins img{width:100%;border-radius:8px;display:block}
.rbins figcaption{font-family:var(--head);font-size:12.5px;color:var(--muted);margin-top:3px}
.rcard.deb dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:17px;margin:6px 0 12px}
.rcard.deb dt{color:var(--muted)}.rcard.deb dd{margin:0;font-weight:700}
.deb-sub{font-size:20px}.deb-note{font-size:16px!important;color:var(--muted)}
.rcard h3{font-family:var(--head);font-size:18px;color:var(--greenD);margin:14px 0 6px}
.deb-err,.deb-q{font-size:17px;margin:0 0 8px;padding-left:22px}
.deb-err li,.deb-q li{margin:4px 0}
.reveal.wrong{background:var(--warnL);border-color:#e3c27a}
/* ---------- dock linea del tempo ---------- */
.tl{width:min(940px,calc(100vw - 360px))}
.tl-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tl-read{font-family:var(--head);color:var(--greenD);font-size:18px;min-width:290px}
.tl-read b{font-size:30px;font-weight:700;margin-right:4px}
.tl-btns{margin-left:auto;display:flex;gap:6px}
.tl-btns button{display:flex;align-items:center;gap:6px;border:1.5px solid var(--brd);background:#fff;border-radius:10px;padding:6px 12px;font-size:15px;color:var(--greenD)}
.tl-btns button svg{width:18px;height:18px}
.tl-btns button.play{background:var(--gold);border-color:var(--gold);color:#fff}
.tl-btns button:hover{border-color:var(--green2)}
.tl-track{position:relative;margin:30px 0 4px;height:40px}
.tl-bands{position:absolute;left:0;right:0;top:12px;height:16px;display:flex;border-radius:8px;overflow:hidden}
.tl-bands div{height:100%;font-family:var(--head);font-size:11px;font-weight:600;color:#fff;text-align:center;line-height:16px;letter-spacing:.04em;overflow:hidden;white-space:nowrap}
.tl-range{position:absolute;left:0;right:0;top:4px;width:100%;margin:0;height:32px;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.tl-range::-webkit-slider-runnable-track{height:32px;background:transparent}
.tl-range::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:32px;border-radius:5px;background:var(--greenD);border:2px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.35)}
.tl-range::-moz-range-thumb{width:14px;height:32px;border-radius:5px;background:var(--greenD);border:2px solid #fff}
.tl-stops{position:absolute;left:0;right:0;top:-24px;height:22px}
.tl-stops button{position:absolute;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;border:2px solid var(--green);background:#fff;padding:0}
.tl-stops button.on{background:var(--gold);border-color:var(--gold)}
.tl-stops button.ast{border-color:#7a5a07;border-style:dashed}
.tl-stops button:hover{background:var(--goldL)}
.tl-ticks{position:absolute;left:0;right:0;top:30px;height:12px;font-size:12px;color:var(--muted)}
.tl-ticks span{position:absolute;transform:translateX(-50%)}
.tl-note{font-size:14px;color:var(--muted);margin-top:8px}
.tl-stopname{font-family:var(--head);font-size:15px;color:#7a5a07;font-weight:600}
.reveal{margin-top:4px;padding:8px 10px;border-radius:10px;background:var(--goldL);border:1px solid #e3cf9a;display:none}
.reveal.on{display:block}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Aula magna in 3D"></canvas>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="9" width="26" height="18" rx="3" fill="none" stroke="#1B6D3F" stroke-width="2.4"/><path d="M3 15h26M11 9v18M21 9v18" stroke="#1B6D3F" stroke-width="1.6" opacity=".55"/><path d="M16 3l5 6H11z" fill="#B8860B"/></svg>
    <div>Aula Magna 3D<small>i mondi sul pavimento</small></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="tools">
    <button class="ibtn" id="btnHome" title="Torna alla vista iniziale (tasto H)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Vista iniziale</button>
  </div>
</header>

<div id="labels"></div>
<svg id="lead"><line id="leadLine" x1="0" y1="0" x2="0" y2="0" style="display:none"/><circle id="leadDot" r="5" cx="-20" cy="-20"/></svg>
<div class="info" id="info" role="dialog" aria-live="polite"></div>

<div class="help" id="help">
  <h3>Come muoversi <button id="helpMin">nascondi</button></h3>
  <ul>
    <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="6"/><path d="M12 2v7" /><path d="M6 9h6" stroke-width="3"/></svg>Trascina con il tasto sinistro per girare</li>
    <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="6"/><path d="M12 5v4" stroke-width="3"/></svg>Rotellina per avvicinarti</li>
    <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="6"/><path d="M12 2v7"/><path d="M12 9h6" stroke-width="3"/></svg>Tasto destro (o frecce) per spostarti</li>
    <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/></svg>Doppio clic per volare in un punto</li>
    <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="10" rx="5"/><circle cx="8" cy="12" r="1.6" fill="currentColor"/></svg>Clic sulle etichette per leggere</li>
  </ul>
</div>

<div class="intro-cap" id="introCap"></div><button class="btn ghost intro-skip" id="introSkip">Salta la presentazione</button><div class="intro-bar" id="introBar"></div>
<div id="flash"></div>
<div class="toast" id="toast"></div>
<div id="loading">Sto preparando l'aula magna…</div>

function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}

// ---------- unione geometrie (r128 non ha BufferGeometryUtils nel core) ----------
const _m4=new THREE.Matrix4();
function mergeParts(parts){ // parts: [{g, m (Matrix4), c (Color lineare)}] → BufferGeometry con colori
  let n=0;const gs=parts.map(p=>{const g=(p.g.index?p.g.toNonIndexed():p.g.clone());if(p.m)g.applyMatrix4(p.m);n+=g.attributes.position.count;return g;});
  const pos=new Float32Array(n*3),nor=new Float32Array(n*3),cl=new Float32Array(n*3);let o=0;
  gs.forEach((g,i)=>{const cnt=g.attributes.position.count;pos.set(g.attributes.position.array,o*3);
    if(!g.attributes.normal)g.computeVertexNormals();nor.set(g.attributes.normal.array,o*3);
    const c=parts[i].c||new THREE.Color(1,1,1);for(let k=0;k<cnt;k++){cl[(o+k)*3]=c.r;cl[(o+k)*3+1]=c.g;cl[(o+k)*3+2]=c.b;}
    o+=cnt;g.dispose();});
  const out=new THREE.BufferGeometry();out.setAttribute('position',new THREE.BufferAttribute(pos,3));
  out.setAttribute('normal',new THREE.BufferAttribute(nor,3));out.setAttribute('color',new THREE.BufferAttribute(cl,3));return out;}
function M(x,y,z,rx,ry,rz,sx,sy,sz){const m=new THREE.Matrix4();m.compose(new THREE.Vector3(x||0,y||0,z||0),
  new THREE.Quaternion().setFromEuler(new THREE.Euler(rx||0,ry||0,rz||0)),new THREE.Vector3(sx??1,sy??sx??1,sz??sx??1));return m;}

/* =====================================================================

const room=new THREE.Group();scene.add(room);
const C={white:col('#EEF0EF'),whiteShort:col('#F1F2F1'),cream:col('#DDD6C6'),blue:col('#4A729C'),

const matWall=new THREE.MeshLambertMaterial({color:C.white});

// --- pavimento: texture procedurale del gres a blocchi diagonali ---
function floorTexture(){
  const PX=6;                       // pixel per cm → periodo 180 cm = 1080 px
  const S=180*PX,c=mkCanvas(S,S),g=c.getContext('2d'),r=rng(7);
  const COLS=[['#6F7275','#5f6265','#82858a'],['#E3D8BD','#d2c7ab','#efe6cf'],['#B98C82','#a77b71','#c99e94']];
  g.fillStyle='#7d7b76';g.fillRect(0,0,S,S);          // fuga
  function tile(x,y,s,set){const v=(r()-.5)*0.06;g.fillStyle=set[0];g.fillRect(x+1,y+1,s-2,s-2);
    g.globalAlpha=0.10+v;g.fillStyle=v>0?'#fff':'#000';g.fillRect(x+1,y+1,s-2,s-2);g.globalAlpha=1;
    // granigliatura
    const n=Math.floor(s*s/55);for(let i=0;i<n;i++){g.fillStyle=r()<.5?set[1]:set[2];g.globalAlpha=.55;
      g.fillRect(x+1+r()*(s-3),y+1+r()*(s-3),1.6,1.6);}g.globalAlpha=1;}
  for(let br=0;br<3;br++)for(let bc=0;bc<3;bc++){
    const k=(br+bc)%3,X=bc*60*PX,Y=br*60*PX;
    if(k===1){for(let i=0;i<3;i++)for(let j=0;j<3;j++)tile(X+j*20*PX,Y+i*20*PX,20*PX,COLS[1]);}
    else{for(let i=0;i<2;i++)for(let j=0;j<2;j++)tile(X+j*30*PX,Y+i*30*PX,30*PX,COLS[k]);}}
  const t=texOf(c,true);t.repeat.set((ROOM.x1-ROOM.x0)/1.8,(ROOM.z1-ROOM.z0)/1.8);return t;}
const floorMat=new THREE.MeshPhongMaterial({map:floorTexture(),shininess:38,specular:0x1c1c1c});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(ROOM.x1-ROOM.x0,ROOM.z1-ROOM.z0),floorMat);
floor.rotation.x=-Math.PI/2;floor.position.set((ROOM.x0+ROOM.x1)/2,0,(ROOM.z0+ROOM.z1)/2);floor.name='pavimento';room.add(floor);

(function lights(){const c=mkCanvas(128,128),g=c.getContext('2d');g.fillStyle='#f4f6f8';g.fillRect(0,0,128,128);
  g.fillStyle='#ffffff';g.fillRect(8,8,112,112);g.strokeStyle='#c9ced3';g.lineWidth=2;
  for(let i=1;i<10;i++){g.beginPath();g.moveTo(8,8+i*11.2);g.lineTo(120,8+i*11.2);g.stroke();}
  g.fillStyle='#b8bec4';g.fillRect(60,8,8,112);
  const mat=new THREE.MeshBasicMaterial({map:texOf(c),toneMapped:false});

  const im=new THREE.InstancedMesh(geo,mat,xs.length*zs.length);let k=0;

// fasce perimetrali lisce del controsoffitto (velette)

// --- parete con aperture: pieni sopra/sotto le aperture, pieni fra le aperture ---
// lungo z (pareti lunghe). side=+1 se la parete sta a x crescente rispetto alla stanza
function wallZ(x,side,openings,matLow,matHigh){
  const T=0.20,cx=x+side*T/2,H=ROOM.h;const ops=openings.slice().sort((a,b)=>a.a-b.a);let z=ROOM.z0;
  ops.forEach(o=>{if(o.a>z+0.001)box(T,H,o.a-z,matLow,cx,H/2,(z+o.a)/2);
    if(o.y0>0.001)box(T,o.y0,o.b-o.a,matLow,cx,o.y0/2,(o.a+o.b)/2);
    box(T,H-o.y1,o.b-o.a,matHigh||matLow,cx,(o.y1+H)/2,(o.a+o.b)/2);z=o.b;});
  if(z<ROOM.z1)box(T,H,ROOM.z1-z,matLow,cx,H/2,(z+ROOM.z1)/2);}

// pareti corte

box(ROOM.x1-ROOM.x0,0.08,0.012,matSkirt,(ROOM.x0+ROOM.x1)/2,0.04,ROOM.z1-0.006);
// diffusori sonori dorati sui pilastri
const matSpk=new THREE.MeshLambertMaterial({color:col('#B79A63')});
COR.pil.forEach(z=>box(0.012,0.20,0.13,matSpk,COR.x+PIL.d+0.006,2.30,z+0.06));

// --- vetrate esterne: telaio antracite, 3 ante sopra, 2 specchiature sotto, tapparelle ---
const matGlass=new THREE.MeshBasicMaterial({color:col('#cfdde6'),transparent:true,opacity:0.16,depthWrite:false});
const matShutter=new THREE.MeshLambertMaterial({color:col('#8d8f8c')});
function windowFrame(x,side,a,b,y0,y1,mat,upper,lower,transom,shutter){
  const w=b-a,zc=(a+b)/2,fx=x-side*0.035,F=0.06;     // telaio poco dentro il filo parete
  box(0.07,F,w,mat,fx,y0+F/2,zc);box(0.07,F,w,mat,fx,y1-F/2,zc);
  box(0.07,y1-y0,F,mat,fx,(y0+y1)/2,a+F/2);box(0.07,y1-y0,F,mat,fx,(y0+y1)/2,b-F/2);
  const ty=y0+transom;box(0.07,0.07,w,mat,fx,ty,zc);
  for(let i=1;i<upper;i++){const z=a+w*i/upper;box(0.07,y1-ty,0.07,mat,fx,(ty+y1)/2,z);}
  for(let i=1;i<lower;i++){const z=a+w*i/lower;box(0.07,ty-y0,0.06,mat,fx,(y0+ty)/2,z);}
  const g=new THREE.Mesh(new THREE.PlaneGeometry(w,y1-y0),matGlass);g.rotation.y=-side*Math.PI/2;
  g.position.set(x-side*0.03,(y0+y1)/2,zc);room.add(g);
  if(shutter>0){box(0.02,shutter,w-0.1,matShutter,x+side*0.02,y1-0.06-shutter/2,zc);}}
{const r=rng(11);EXT.win.forEach(w=>windowFrame(EXT.x,+1,w[0],w[1],EXT.wy[0],EXT.wy[1],matFrameE,
  (w[1]-w[0])>1.2?3:1,(w[1]-w[0])>1.2?2:1,0.62,0.10+r()*0.30));}
// davanzali

// --- finestre verso il corridoio: telaio argento + veneziane abbassate ---
function blindTexture(){const c=mkCanvas(64,256),g=c.getContext('2d');
  for(let y=0;y<256;y+=8){g.fillStyle='#e9ebeb';g.fillRect(0,y,64,6);g.fillStyle='#b9bdbf';g.fillRect(0,y+6,64,2);}
  const t=texOf(c,true);return t;}
const matBlind=new THREE.MeshLambertMaterial({map:blindTexture(),transparent:true,opacity:0.88});
COR.win.forEach(w=>{windowFrame(COR.x,-1,w[0],w[1],COR.wy[0],COR.wy[1],matFrameI,3,2,0.30,0);
  const bl=new THREE.Mesh(new THREE.PlaneGeometry(w[1]-w[0]-0.1,COR.wy[1]-COR.wy[0]-0.1),matBlind);

  bl.material.map.repeat.set(1,(COR.wy[1]-COR.wy[0])/0.32);
  bl.rotation.y=Math.PI/2;bl.position.set(COR.x-0.07,(COR.wy[0]+COR.wy[1])/2,(w[0]+w[1])/2);room.add(bl);});

[COR.door[0],COR.door[1]].forEach(z=>box(0.22,COR.dh,0.05,matFrameI,COR.x-0.06,COR.dh/2,z));

// --- fuori: campagna (lato esterno) e corridoio (lato interno), dipinti su tela ---
function landscapeTexture(){const W=2048,H=640,c=mkCanvas(W,H),g=c.getContext('2d'),r=rng(21);
  const sky=g.createLinearGradient(0,0,0,H*0.55);sky.addColorStop(0,'#c7d5df');sky.addColorStop(1,'#e8eef0');
  g.fillStyle=sky;g.fillRect(0,0,W,H);
  // campi lontani
  g.fillStyle='#a9b59a';g.fillRect(0,H*0.50,W,H*0.04);g.fillStyle='#8fa36f';g.fillRect(0,H*0.54,W,H*0.10);
  g.fillStyle='#7f9659';g.fillRect(0,H*0.64,W,H*0.36);
  for(let i=0;i<14;i++){g.fillStyle=r()<.5?'#97a86c':'#b9b47a';g.fillRect(r()*W,H*0.55+r()*H*0.1,120+r()*300,8+r()*14);}
  // filari e alberi lontani
  for(let i=0;i<160;i++){const x=r()*W,h=8+r()*22;g.fillStyle=r()<.5?'#5d6e4c':'#6c7d57';
    g.beginPath();g.ellipse(x,H*0.535,6+r()*14,h,0,0,Math.PI*2);g.fill();}
  // cipressi e cedri vicini
  for(let i=0;i<22;i++){const x=r()*W,h=120+r()*170,base=H*0.70+r()*H*0.2;
    if(r()<.55){g.fillStyle='#2f4a2c';g.beginPath();g.moveTo(x,base-h);g.quadraticCurveTo(x+22,base-h*0.5,x+12,base);
      g.lineTo(x-12,base);g.quadraticCurveTo(x-22,base-h*0.5,x,base-h);g.fill();}
    else{g.fillStyle='#3e5338';for(let k=0;k<5;k++){g.beginPath();g.ellipse(x+(r()-.5)*60,base-h*0.25-k*h*0.15,70-k*9,22,0,0,Math.PI*2);g.fill();}
      g.fillStyle='#4a3a2c';g.fillRect(x-4,base-h*0.2,8,h*0.2);}}
  // casa bianca col tetto grigio
  g.fillStyle='#efeee9';g.fillRect(W*0.62,H*0.30,300,H*0.32);g.fillStyle='#8f9294';
  g.beginPath();g.moveTo(W*0.62-30,H*0.31);g.lineTo(W*0.62+150,H*0.22);g.lineTo(W*0.62+330,H*0.31);g.fill();
  g.fillStyle='#cfd8de';g.fillRect(W*0.62+60,H*0.38,60,34);g.fillRect(W*0.62+170,H*0.38,60,34);
  return texOf(c);}
const outside=new THREE.Mesh(new THREE.PlaneGeometry(46,12),new THREE.MeshBasicMaterial({map:landscapeTexture(),toneMapped:false}));
outside.rotation.y=-Math.PI/2;outside.position.set(EXT.x+9,1.6,0);room.add(outside);

(function mergeStatic(){room.updateMatrixWorld(true);const groups=new Map(),drop=[];
  room.traverse(o=>{if(!o.isMesh||o.isInstancedMesh||o===floor||o===ceil)return;const m=o.material;
    if(m.transparent||m.map||!(o.geometry instanceof THREE.BoxGeometry))return;
    if(!groups.has(m))groups.set(m,[]);groups.get(m).push({g:o.geometry,m:o.matrixWorld.clone()});drop.push(o);});
  drop.forEach(o=>o.parent.remove(o));

/* =====================================================================
   2. TELECAMERA ORBITALE (scritta a mano: niente dipendenze extra)
   Trascina = ruota · rotellina = zoom · destro/frecce = sposta · doppio clic = vola
   La telecamera non esce mai dall'aula: se serve, si accorcia la distanza.
   ===================================================================== */
const VIEW={target:new THREE.Vector3(0.4,0.3,-1.2),r:12.2,theta:-0.43,phi:1.38};   // dall'angolo della porta sul corridoio
const view={target:VIEW.target.clone(),r:VIEW.r,theta:VIEW.theta,phi:VIEW.phi};
const goal={target:view.target.clone(),r:view.r,theta:view.theta,phi:view.phi};
const LIM={rMin:0.25,rMax:16,phiMin:0.12,phiMax:1.50};
const IN={x0:ROOM.x0+0.35,x1:ROOM.x1-0.35,z0:ROOM.z0+0.3,z1:ROOM.z1-0.3,y0:0.10,y1:ROOM.h-0.12};
const _v=new THREE.Vector3(),_dir=new THREE.Vector3();
function camPos(t,r,th,ph,out){return out.set(t.x+r*Math.sin(ph)*Math.sin(th),t.y+r*Math.cos(ph),t.z+r*Math.sin(ph)*Math.cos(th));}
function inside(p){return p.x>IN.x0&&p.x<IN.x1&&p.z>IN.z0&&p.z<IN.z1&&p.y>IN.y0&&p.y<IN.y1;}
function fitRadius(t,r,th,ph){let lo=0,hi=r;camPos(t,r,th,ph,_v);if(inside(_v))return r;
  for(let i=0;i<18;i++){const m=(lo+hi)/2;camPos(t,m,th,ph,_v);if(inside(_v))lo=m;else hi=m;}return Math.max(lo,0.05);}
function clampTarget(t){t.x=clamp(t.x,IN.x0,IN.x1);t.z=clamp(t.z,IN.z0,IN.z1);t.y=clamp(t.y,0,2.6);}
function flyTo(target,r,theta,phi){goal.target.copy(target);clampTarget(goal.target);if(r!=null)goal.r=r;if(theta!=null)goal.theta=theta;if(phi!=null)goal.phi=phi;}
function updateCamera(dt){const k=1-Math.pow(0.0009,dt);           // smorzamento indipendente dal frame-rate
  view.target.lerp(goal.target,k);view.r=lerp(view.r,goal.r,k);
  let dth=goal.theta-view.theta;view.theta+=dth*k;view.phi=lerp(view.phi,goal.phi,k);
  const r=fitRadius(view.target,view.r,view.theta,view.phi);camPos(view.target,r,view.theta,view.phi,camera.position);
  camera.lookAt(view.target);}
let drag=null,downAt=null;
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{canvas.focus();drag={b:e.button,x:e.clientX,y:e.clientY,shift:e.shiftKey};downAt={x:e.clientX,y:e.clientY,t:performance.now()};
  canvas.setPointerCapture(e.pointerId);canvas.classList.add('drag');});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
  if(drag.b===2||drag.b===1||drag.shift){pan(dx,dy);}
  else{goal.theta-=dx*0.0055;goal.phi=clamp(goal.phi-dy*0.0045,LIM.phiMin,LIM.phiMax);}});
canvas.addEventListener('pointermove',e=>{if(!drag&&current&&current.built&&current.onHover)current.onHover(e);});
canvas.addEventListener('pointerleave',()=>{if(current&&current.onHover)current.onHover(null);});
canvas.addEventListener('pointerup',e=>{canvas.classList.remove('drag');const d=downAt;drag=null;
  if(d&&Math.hypot(e.clientX-d.x,e.clientY-d.y)<5&&performance.now()-d.t<500&&e.button===0)onClick(e);});
function pan(dx,dy){const s=Math.max(view.r,0.6)*0.0016;_dir.set(Math.sin(view.theta),0,Math.cos(view.theta));
  const right=new THREE.Vector3(_dir.z,0,-_dir.x);goal.target.addScaledVector(right,-dx*s).addScaledVector(_dir,-dy*s);clampTarget(goal.target);}
canvas.addEventListener('wheel',e=>{e.preventDefault();const f=Math.exp(e.deltaY*0.0012);goal.r=clamp(goal.r*f,LIM.rMin,LIM.rMax);
  if(goal.r>view.r*0.999){/* allontanandosi non si supera l'aula */goal.r=Math.min(goal.r,fitRadius(goal.target,goal.r,goal.theta,goal.phi)+0.5);}},{passive:false});
canvas.addEventListener('dblclick',e=>{const hit=pickWorld(e);if(hit){flyTo(hit.point,Math.min(goal.r,1.6));}});
const keys={};addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys[e.key]=true;
  if(e.key==='h'||e.key==='H'||e.key==='Home')resetView();
  if(e.key==='+'||e.key==='=')goal.r=clamp(goal.r*0.85,LIM.rMin,LIM.rMax);
  if(e.key==='-')goal.r=clamp(goal.r*1.15,LIM.rMin,LIM.rMax);
  if(e.key==='Escape')closePanel();});
addEventListener('keyup',e=>{keys[e.key]=false;});
function keyPan(dt){const s=220*dt;if(keys.ArrowLeft)pan(s,0);if(keys.ArrowRight)pan(-s,0);if(keys.ArrowUp)pan(0,s);if(keys.ArrowDown)pan(0,-s);}

const ray=new THREE.Raycaster(),_ndc=new THREE.Vector2();
function setRay(e){_ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(_ndc,camera);}
function pickWorld(e){setRay(e);const objs=[floor];if(current&&current.surfaces)objs.push(...current.surfaces);
  const h=ray.intersectObjects(objs,true);return h[0]||null;}
function onClick(e){if(!current||!current.pickables)return;setRay(e);
  const h=ray.intersectObjects(current.pickables(),true);if(!h.length)return;

const labelBox=document.getElementById('labels');const LABELS=[];const _p=new THREE.Vector3();
function addLabel(o){ // o: {text, anchor:()=>Vector3, world, onClick, small, maxDist, visible:()=>bool}
  const el=document.createElement('button');el.className='tag'+(o.small?' small':'')+(o.cls?' '+o.cls:'');el.innerHTML='<i></i><span></span>';
  if(o.dot)el.querySelector('i').style.background=o.dot;
  el.querySelector('span').textContent=o.text;el.onclick=ev=>{ev.stopPropagation();o.onClick&&o.onClick();};
  labelBox.appendChild(el);const L={...o,el,on:true};LABELS.push(L);return L;}
function updateLabels(){const W=innerWidth,H=innerHeight;
  for(const L of LABELS){const show=L.world===(current&&current.id)&&(!L.visible||L.visible());
    if(!show){if(L.on){L.el.style.transform='translate(-9999px,-9999px)';L.on=false;}continue;}
    const a=L.anchor();_p.copy(a).project(camera);const d=camera.position.distanceTo(a);
    if(_p.z>1||_p.z<-1||(L.maxDist&&d>L.maxDist)){L.el.style.transform='translate(-9999px,-9999px)';L.on=false;continue;}
    const x=(_p.x*0.5+0.5)*W,y=(-_p.y*0.5+0.5)*H;
    L.el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-100%)`;L.on=true;
    L.el.classList.toggle('on',panelState&&panelState.label===L);}}

/* =====================================================================
   4. I MONDI — ogni mondo è un modulo che si "carica" sul pavimento
   { id, tab:{title,sub,icon}, view, build(), enter(), exit(), update(dt,t),
     pickables(), surfaces, root (Group), dock (elemento HTML) }
   Per aggiungere una disciplina: scrivere un modulo e chiamare registerWorld().

const WORLDS=[];let current=null,switching=false;
const tweens=[];
function tween(dur,fn,done){return new Promise(res=>tweens.push({t:0,dur,fn,done:()=>{done&&done();res();}}));}
function runTweens(dt){for(let i=tweens.length-1;i>=0;i--){const w=tweens[i];w.t+=dt;const u=Math.min(1,w.t/w.dur);w.fn(u);
  if(u>=1){tweens.splice(i,1);w.done();}}}
function registerWorld(w){WORLDS.push(w);}
// "portale" a pavimento: un rettangolo luminoso che si allarga prima che il mondo emerga
const portal=(()=>{const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-.5,0,-.5),new THREE.Vector3(.5,0,-.5),
  new THREE.Vector3(.5,0,.5),new THREE.Vector3(-.5,0,.5),new THREE.Vector3(-.5,0,-.5)]);
  const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:0xD4A017,transparent:true,opacity:0,toneMapped:false}));l.position.y=0.012;scene.add(l);return l;})();
async function switchWorld(id){if(switching)return;const next=WORLDS.find(w=>w.id===id)||null;if(next===current)return;switching=true;closePanel();
  if(current){const w=current;w.dock&&w.dock.classList.remove('open');
    await tween(0.55,u=>{w.root.scale.y=Math.max(0.001,1-smooth(u));});w.root.visible=false;w.exit&&w.exit();}
  current=next;renderTabs();
  if(next){if(!next.built){toast('Sto preparando il mondo…',1800);await new Promise(r=>setTimeout(r,30));await next.build();next.built=true;scene.add(next.root);}
    next.root.visible=true;next.root.scale.y=0.001;next.enter&&next.enter();
    const fp=next.footprint;portal.position.set(fp.x,0.012,fp.z);portal.visible=true;
    flyTo(next.view.target,next.view.r,next.view.theta,next.view.phi);
    await tween(0.6,u=>{const s=smooth(u);portal.scale.set(fp.w*s+0.01,1,fp.d*s+0.01);portal.material.opacity=s;});
    await tween(1.1,u=>{next.root.scale.y=Math.max(0.001,smooth(u));portal.material.opacity=1-u;});
    portal.visible=false;next.dock&&next.dock.classList.add('open');{const h=document.getElementById('help');h.classList.add('min');document.getElementById('helpMin').textContent='mostra';}next.entered&&next.entered();}
  else{flyTo(VIEW.target,VIEW.r,VIEW.theta,VIEW.phi);}
  switching=false;}

/* =====================================================================
   COSTRUTTORE DI ANIMALI LOW-POLY (condiviso dai mondi)
   Il corpo è un "tubo" lungo una curva nel piano sagittale (x avanti, y su):
   ogni punto è [x, y, raggio verticale, raggio laterale]. Coda e collo sono
   gruppi separati per poterli far ondeggiare; le zampe sono catene di giunti.
   Si progetta in METRI REALI; il mondo poi scala (es. 1:10).
   ===================================================================== */
function tube(pts,sides,sub){sides=sides||8;sub=sub||4;
  const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p[0],p[1],0)),false,'catmullrom',0.5);
  const n=(pts.length-1)*sub+1,pos=[],idx=[],side=new THREE.Vector3(0,0,1),nr=new THREE.Vector3(),c=new THREE.Vector3(),tg=new THREE.Vector3();
  for(let i=0;i<n;i++){const t=i/(n-1);curve.getPoint(t,c);curve.getTangent(t,tg);
    const f=t*(pts.length-1),k=Math.min(Math.floor(f),pts.length-2),u=f-k;
    const ry=lerp(pts[k][2],pts[k+1][2],u),rz=lerp(pts[k][3]??pts[k][2],pts[k+1][3]??pts[k+1][2],u);
    nr.crossVectors(side,tg).normalize();
    for(let j=0;j<sides;j++){const a=j/sides*Math.PI*2;pos.push(c.x+nr.x*Math.cos(a)*ry,c.y+nr.y*Math.cos(a)*ry,Math.sin(a)*rz);}}
  for(let i=0;i<n-1;i++)for(let j=0;j<sides;j++){const a=i*sides+j,b=i*sides+(j+1)%sides,c2=(i+1)*sides+j,d=(i+1)*sides+(j+1)%sides;idx.push(a,b,c2,b,d,c2);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);return g;}
const _cA=new THREE.Color();
function shadeGeo(g,cBack,cBelly,stripe,offX){g.computeVertexNormals();const p=g.attributes.position,n=g.attributes.normal,cnt=p.count,arr=new Float32Array(cnt*3);
  for(let i=0;i<cnt;i++){const ny=n.getY(i);_cA.copy(cBelly).lerp(cBack,smooth(clamp((ny+0.7)/0.95,0,1)));
    if(stripe&&ny>0.05&&Math.sin((p.getX(i)+(offX||0))*stripe.f)>0.5)_cA.lerp(stripe.c,0.5);
    arr[i*3]=_cA.r;arr[i*3+1]=_cA.g;arr[i*3+2]=_cA.b;}
  g.setAttribute('color',new THREE.BufferAttribute(arr,3));return g;}

function updateAnimals(dt,t){

    a.app=lerp(a.app,target,1-Math.pow(0.03,dt));if(Math.abs(a.app-target)<0.004)a.app=target;
    if(a.app===0){if(a.R.root.visible){a.R.root.visible=false;if(panelState&&panelState.animal===a)closePanel();}return;}
    const R=a.R;R.root.scale.setScalar(Math.max(1e-4,S*smooth(a.app)));
    if(a.fly){a.orbit.cx+=Math.sin(t*0.05+a.seed)*0.002;const an=t*a.orbit.w+a.seed;
      a.x=a.orbit.cx+Math.cos(an)*a.orbit.r;a.z=a.orbit.cz+Math.sin(an)*a.orbit.r;a.h=-(an+(a.orbit.w>0?Math.PI/2:-Math.PI/2));
      R.root.position.set(a.x,a.alt+0.12*Math.sin(t*0.7+a.seed),a.z);R.root.rotation.set(0,a.h,(a.orbit.w>0?1:-1)*0.25);
      poseRig(R,0,0,t,a.seed,0);return;}

      if(a.timer<=0){a.state='walk';pickTarget(a);a.timer=8+Math.random()*8;}}
    else{a.graze=lerp(a.graze,0,1-Math.pow(0.05,dt));const dx=a.tx-a.x,dz=a.tz-a.z,d=Math.hypot(dx,dz);
      const want=Math.atan2(-dz,dx);let dh=want-a.h;while(dh>Math.PI)dh-=6.283;while(dh<-Math.PI)dh+=6.283;
      a.h+=clamp(dh,-1,1)*Math.min(1,dt*1.4);a.amp=lerp(a.amp,Math.abs(dh)>1.2?0.4:1,1-Math.pow(0.1,dt));

      let sx=0,sz=0;animals.forEach(b=>{if(b===a||b.app<0.5||b.fly)return;const ex=a.x-b.x,ez=a.z-b.z,dd=Math.hypot(ex,ez),min=(a.R.size.x+b.R.size.x)*S*0.38;

function fmtT(t){if(t<0.0008)return'Oggi';if(t<1)return Math.round(t*1000)*1000>=1000?(Math.round(t*1000)*1000).toLocaleString('it-IT')+' anni fa':'Oggi';
  return(t<10?t.toFixed(1).replace('.',','):Math.round(t))+' milioni di anni fa';}

// tappe: gruppi di specie vissute nello stesso momento (+ asteroide, uomo, oggi)
const STOPS=(()=>{const list=SPECIE.filter(s=>!s.fuoriTappa&&s.id!=='homo').slice().sort((a,b)=>b.inizio-a.inizio),out=[];let g=null;
  list.forEach(s=>{if(g&&s.inizio>=g.lo-0.01&&s.fine<=g.hi+0.01&&Math.min(g.hi,s.inizio)>=Math.max(g.lo,s.fine)){g.hi=Math.min(g.hi,s.inizio);g.lo=Math.max(g.lo,s.fine);g.sp.push(s);}
    else{g={hi:s.inizio,lo:s.fine,sp:[s]};out.push(g);}});
  const st=out.map(g=>({t:(g.hi+g.lo)/2,name:g.sp.map(s=>s.etichetta||s.nome).join(', ')}));
