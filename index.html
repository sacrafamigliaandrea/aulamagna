e. Le pareti delle forre laviche sono alte 5-15 m (altezza delle gole, non profondità dell'acqua).","sorgente":"Monti Nebrodi: nasce dall'unione dei torrenti Cutò, Martello e Saracena, presso Maniace (CT, Sicilia)","sorgente_lat":37.8624,"sorgente_lon":14.8078,"foce":"Mar Ionio (Golfo di Catania), località Primosole","foce_lat":37.4006,"foce_lon":15.0888,"regioni":["Sicilia"],"testo":"Il Simeto nasce sui Monti Nebrodi, in Sicilia. Scorre vicino all'Etna, tra gole di roccia lavica. Sfocia nel Mar Ionio, vicino a Catania.","note":"Coordinate della sorgente approssimate (centro di Maniace, OpenStreetMap): nessuna fonte dà il punto esatto della confluenza. Lunghezza 113 km (it.wiki, Università di Catania); en.wiki 116 km. Bacino 4186 km² (it.wiki), 4029 (en.wiki), circa 4200 (Università di Catania).","fonti":["https://it.wikipedia.org/wiki/Simeto","https://en.wikipedia.org/wiki/Simeto","https://nominatim.openstreetmap.org/search?format=json&q=Maniace,Catania"]},{"id":"tirso","nome":"Tirso","lunghezza_km":152,"portata_media_m3s":16,"bacino_km2":3375,"profondita_m":null,"profondita_nota":"Nessuna fonte attendibile (Wikipedia, enti di bacino) indica una profondità tipica o massima: la profondità cambia molto da tratto a tratto e con le piene.","sorgente":"Pendici di Punta Pianedda, altopiano di Buddusò (SS, Sardegna), 985 m","sorgente_lat":40.5813,"sorgente_lon":9.3662,"foce":"Golfo di Oristano","foce_lat":39.885,"foce_lon":8.5406,"regioni":["Sardegna"],"testo":"Il Tirso è il fiume principale della Sardegna. Nasce sull'altopiano di Buddusò. Una diga forma il grande lago Omodeo. Sfocia nel Golfo di Oristano.","note":"Portata 16 m³/s alla foce. Coordinate della sorgente = vetta di Punta Pianedda (OpenStreetMap): la sorgente è sulle sue pendici, posizione approssimata. Il lago Omodeo è artificiale (diga di Santa Chiara 1924, poi diga Eleonora d'Arborea).","fonti":["https://it.wikipedia.org/wiki/Tirso_(fiume)","https://nominatim.openstreetmap.org/search?format=json&q=Punta+Pianedda"]}],"monti":[{"id":"monte-bianco","nome":"Monte Bianco","altezza_m":4807,"lat":45.8328,"lon":6.865,"catena":"Alpi Graie (Alpi occidentali), massiccio del Monte Bianco","regione":"Valle d'Aosta (confine con la Francia)","tipo":"montagna","testo":"Il Monte Bianco è la montagna più alta delle Alpi. È alto circa 4807 metri. La cima è coperta da una calotta di neve e ghiaccio. Per questo la sua altezza cambia un po' ogni volta che la misurano.","note":"Altezza variabile per lo spessore di neve e ghiaccio (roccia della cima circa 4792 m). Misure: 4810,90 m (2007), 4807,81 (2021), 4805,59 (2023, minimo), 4808,76 (2025), 4807,47 (17 settembre 2026, geometri francesi). Molti libri riportano ancora 4810 m. Il confine sulla vetta è conteso: le carte italiane (IGM) lo pongono sulla cima, quelle francesi (IGN) mettono la cima tutta in Francia.","fonti":["https://it.wikipedia.org/wiki/Monte_Bianco","https://en.wikipedia.org/wiki/Mont_Blanc","https://ilpost.it/2026/10/16/monte-bianco-altitudine","https://it.euronews.com/2026/10/14/monte-bianco-nuove-misure-in-francia-la-vetta-cresce-di-quasi-2-metri-a-4807-di-altezza"]},{"id":"monte-rosa","nome":"Monte Rosa","altezza_m":4634,"lat":45.9368,"lon":7.8671,"catena":"Alpi Pennine, massiccio del Monte Rosa","regione":"Piemonte e Valle d'Aosta (confine con la Svizzera)","tipo":"montagna","vetta_principale":{"nome":"Punta Dufour","altezza_m":4634,"lat":45.9368,"lon":7.8671,"territorio":"interamente in Svizzera (Vallese)"},"vetta_italiana":{"nome":"Punta Gnifetti (Signalkuppe)","altezza_m":4554,"lat":45.9272,"lon":7.8769,"territorio":"sul confine Italia-Svizzera (Piemonte/Vallese); sulla cima c'è la Capanna Regina Margherita"},"punto_piu_alto_in_italia":{"nome":"Grenzgipfel ('cima di confine')","altezza_m":4618,"territorio":"sul confine Italia-Svizzera"},"testo":"Il Monte Rosa è un grande massiccio con tante cime. La più alta è la Punta Dufour, alta 4634 metri, che si trova in Svizzera. Sulla Punta Gnifetti, tra Italia e Svizzera, c'è la Capanna Margherita. È il rifugio più alto d'Europa.","note":"altezza_m, lat e lon si riferiscono alla Punta Dufour (interamente svizzera). La Punta Gnifetti è a 4554 m (en.wiki, OSM per le coordinate); it.wiki 'Monte Rosa' scrive 4559 m. Il punto più alto sul lato italiano del massiccio è la Grenzgipfel (4618 m), sul confine; la Punta Nordend (4609 m) è anch'essa sul confine.","fonti":["https://it.wikipedia.org/wiki/Monte_Rosa","https://en.wikipedia.org/wiki/Monte_Rosa","https://en.wikipedia.org/wiki/Dufourspitze","https://en.wikipedia.org/wiki/Signalkuppe","https://nominatim.openstreetmap.org/search?format=json&q=Punta+Gnifetti"]},{"id":"cervino","nome":"Cervino","altezza_m":4478,"lat":45.9764,"lon":7.6583,"catena":"Alpi Pennine","regione":"Valle d'Aosta (confine con la Svizzera)","tipo":"montagna","testo":"Il Cervino ha la forma di una grande piramide di roccia. È alto 4478 metri. Si trova al confine tra la Valle d'Aosta e la Svizzera.","note":"4477,54 m nell'infobox it.wiki; 4478 m nel testo e nella maggior parte delle fonti.","fonti":["https://it.wikipedia.org/wiki/Cervino"]},{"id":"gran-paradiso","nome":"Gran Paradiso","altezza_m":4061,"lat":45.5186,"lon":7.2673,"catena":"Alpi Graie, massiccio del Gran Paradiso","regione":"Valle d'Aosta","tipo":"montagna","testo":"Il Gran Paradiso è alto 4061 metri. La sua cima si trova tutta in Valle d'Aosta. Dà il nome a un parco nazionale dove vivono gli stambecchi.","note":"Non è la vetta più alta interamente italiana: secondo it.wiki lo superano Corno Nero (4321 m) e Piramide Vincent (4215 m), nel massiccio del Monte Rosa. È la cima più alta dell'unico massiccio sopra i 4000 m tutto in Italia. Quota precisa 4061,20 m.","fonti":["https://it.wikipedia.org/wiki/Gran_Paradiso"]},{"id":"ortles","nome":"Ortles","altezza_m":3905,"lat":46.5106,"lon":10.5419,"catena":"Alpi Retiche meridionali, gruppo Ortles-Cevedale","regione":"Trentino-Alto Adige (provincia di Bolzano)","tipo":"montagna","testo":"L'Ortles è la montagna più alta dell'Alto Adige. È alto 3905 metri. Sulle sue pareti ci sono ghiacciai.","note":"Interamente in territorio altoatesino, comune di Stelvio.","fonti":["https://it.wikipedia.org/wiki/Ortles"]},{"id":"adamello","nome":"Adamello","altezza_m":3539,"lat":46.1561,"lon":10.4964,"catena":"Alpi Retiche meridionali, gruppo dell'Adamello","regione":"Lombardia (provincia di Brescia)","tipo":"montagna","testo":"L'Adamello è la montagna più alta della provincia di Brescia. È alto 3539 metri. Si trova sopra la Valcamonica, la valle del fiume Oglio.","note":"La vetta è sul confine tra i comuni di Edolo e Saviore dell'Adamello (BS). Il ghiacciaio dell'Adamello si estende tra Lombardia e Trentino.","fonti":["https://it.wikipedia.org/wiki/Adamello_(monte)","https://it.wikipedia.org/wiki/Adamello"]},{"id":"marmolada","nome":"Marmolada","altezza_m":3343,"lat":46.4347,"lon":11.8508,"catena":"Dolomiti","regione":"Trentino-Alto Adige e Veneto (confine tra le province di Trento e Belluno)","tipo":"montagna","testo":"La Marmolada è la montagna più alta delle Dolomiti. La sua cima si chiama Punta Penia ed è alta 3343 metri. Ha il ghiacciaio più grande delle Dolomiti.","note":"Coordinate del massiccio (en.wiki); nessuna fonte consultata dà coordinate separate per Punta Penia. Dal 2018 il confine provinciale segue lo spartiacque: Punta Penia è condivisa tra Trento e Belluno. it.wiki riporta anche 3342 m.","fonti":["https://it.wikipedia.org/wiki/Marmolada","https://en.wikipedia.org/wiki/Marmolada"]},{"id":"monviso","nome":"Monviso","altezza_m":3841,"lat":44.6685,"lon":7.0901,"catena":"Alpi Cozie","regione":"Piemonte (provincia di Cuneo)","tipo":"montagna","testo":"Il Monviso è la montagna più alta delle Alpi Cozie. È alto 3841 metri e ha la forma di una piramide. Ai suoi piedi, a Pian del Re, nasce il fiume Po.","note":"","fonti":["https://it.wikipedia.org/wiki/Monviso"]},{"id":"corno-grande","nome":"Corno Grande (Gran Sasso)","altezza_m":2912,"lat":42.4692,"lon":13.5656,"catena":"Appennino centrale, massiccio del Gran Sasso d'Italia","regione":"Abruzzo","tipo":"montagna","testo":"Il Corno Grande è la cima più alta del Gran Sasso. È anche la montagna più alta degli Appennini: 2912 metri. Sul suo lato nord c'è il piccolo ghiacciaio del Calderone.","note":"Quota della vetta occidentale. Il ghiacciaio del Calderone era considerato il più meridionale d'Europa.","fonti":["https://it.wikipedia.org/wiki/Corno_Grande"]},{"id":"monte-amaro","nome":"Monte Amaro (Majella)","altezza_m":2793,"lat":42.0863,"lon":14.0859,"catena":"Appennino abruzzese, massiccio della Majella","regione":"Abruzzo","tipo":"montagna","testo":"Il Monte Amaro è la cima più alta della Majella. È alto 2793 metri. È la seconda montagna più alta degli Appennini.","note":"","fonti":["https://it.wikipedia.org/wiki/Monte_Amaro_(Majella)"]},{"id":"monte-pollino","nome":"Monte Pollino","altezza_m":2248,"lat":39.9076,"lon":16.1883,"catena":"Appennino meridionale, massiccio del Pollino","regione":"Basilicata e Calabria","tipo":"montagna","testo":"Il Monte Pollino è alto 2248 metri. Si trova tra la Basilicata e la Calabria. Dà il nome a un grande parco nazionale.","note":"Non è la cima più alta del massiccio: la Serra Dolcedorme (circa 2267 m) è più alta. Le fonti consultate non dicono su quale lato del confine regionale cada la vetta.","fonti":["https://it.wikipedia.org/wiki/Monte_Pollino"]},{"id":"montalto","nome":"Montalto (Aspromonte)","altezza_m":1956,"lat":38.1591,"lon":15.9206,"catena":"Aspromonte (Appennino calabro)","regione":"Calabria (città metropolitana di Reggio Calabria)","tipo":"montagna","testo":"Il Montalto è la cima più alta dell'Aspromonte. È alto 1956 metri. Si trova in Calabria, nella punta dello stivale.","note":"","fonti":["https://it.wikipedia.org/wiki/Montalto_(Aspromonte)"]},{"id":"punta-la-marmora","nome":"Punta La Marmora (Gennargentu)","altezza_m":1834,"lat":39.9881,"lon":9.3242,"catena":"Massiccio del Gennargentu","regione":"Sardegna (provincia di Nuoro)","tipo":"montagna","testo":"Punta La Marmora è la cima più alta della Sardegna. È alta 1834 metri. Fa parte del massiccio del Gennargentu.","note":"Coordinate precise da en.wiki (it.wiki dà solo 39°59'N 9°20'E).","fonti":["https://it.wikipedia.org/wiki/Punta_La_Marmora","https://en.wikipedia.org/wiki/Punta_La_Marmora"]},{"id":"monte-cimone","nome":"Monte Cimone","altezza_m":2165,"lat":44.1938,"lon":10.7013,"catena":"Appennino tosco-emiliano (Appennino settentrionale)","regione":"Emilia-Romagna (provincia di Modena)","tipo":"montagna","testo":"Il Monte Cimone è la montagna più alta dell'Appennino settentrionale. È alto 2165 metri. Si trova in Emilia-Romagna, in provincia di Modena.","note":"La voce it.wiki è segnalata come povera di fonti; l'altezza (2165 m) è confermata anche dalla pagina di disambiguazione 'Monte Cimone'.","fonti":["https://it.wikipedia.org/wiki/Monte_Cimone_(Appennino)"]},{"id":"etna","nome":"Etna","altezza_m":3403,"lat":37.755,"lon":14.995,"catena":"Vulcano isolato della Sicilia orientale","regione":"Sicilia (città metropolitana di Catania)","tipo":"vulcano attivo","testo":"L'Etna è il vulcano attivo più alto d'Europa. È alto circa 3403 metri. La sua altezza cambia con le eruzioni. Si trova in Sicilia, vicino a Catania.","note":"3403 m misurati dall'INGV dopo i parossismi dell'estate 2024 (bollettino del 17 settembre 2024); la cima è ora il bordo del Cratere Centrale (Voragine). Valori precedenti: 3357 m (2021, cratere di Sud-Est), 3326 m (2018). Non sono state trovate misure ufficiali più recenti. Coordinate: en.wiki (rilievo GPS 2005); it.wiki dà 37.7508, 14.9932.","fonti":["https://it.wikipedia.org/wiki/Etna","https://en.wikipedia.org/wiki/Mount_Etna"]},{"id":"vesuvio","nome":"Vesuvio","altezza_m":1281,"lat":40.8214,"lon":14.4261,"catena":"Complesso vulcanico Somma-Vesuvio","regione":"Campania (città metropolitana di Napoli)","tipo":"vulcano attivo","testo":"Il Vesuvio è un vulcano vicino a Napoli. Nel 79 dopo Cristo la sua eruzione seppellì Pompei. L'ultima eruzione è del 1944. Oggi riposa, ma è ancora un vulcano attivo.","note":"Attivo ma quiescente dal marzo 1944. L'altezza varia con la forma del cono. Coordinate della vetta da en.wiki; it.wiki dà 40.8226, 14.4292.","fonti":["https://it.wikipedia.org/wiki/Vesuvio","https://en.wikipedia.org/wiki/Mount_Vesuvius"]},{"id":"stromboli","nome":"Stromboli","altezza_m":924,"lat":38.7939,"lon":15.2111,"catena":"Isole Eolie (arco vulcanico eoliano)","regione":"Sicilia (città metropolitana di Messina)","tipo":"vulcano attivo","testo":"Lo Stromboli è un'isola vulcanica delle Eolie. Il vulcano è alto 924 metri sopra il mare. Fa piccole esplosioni quasi continue, a distanza di minuti o di ore.","note":"Vetta: I Vancori. 924 m (en.wiki infobox, INGV, GeoPop) è il valore più citato; it.wiki e Wikivoyage riportano 926 m. Le coordinate sono quelle dell'isola (en.wiki), non esattamente della vetta. Dal fondo del mare il cono è alto circa 3000 m.","fonti":["https://it.wikipedia.org/wiki/Stromboli","https://en.wikipedia.org/wiki/Stromboli","https://www.italysvolcanoes.com/STROMBOLI_geogr.html","https://www.geopop.it/stromboli-tutto-sul-vulcano-attivo-delle-isole-delle-eolie/"]}],"laghi":[{"id":"garda","nome":"Lago di Garda","superficie_km2":370,"profondita_max_m":346,"lat":45.6333,"lon":10.6667,"regioni":["Lombardia","Veneto","Trentino-Alto Adige"],"origine":"glaciale","testo":"Il Lago di Garda è il lago più grande d'Italia. Bagna la Lombardia, il Veneto e il Trentino. In alcuni punti è profondo 346 metri.","note":"Superficie 368 km² (infobox it.wiki), circa 370 (testo it.wiki ed elenco en.wiki), 369,98 (en.wiki). Origine discussa: escavazione glaciale (ipotesi più nota) su una valle fluviale preesistente, con possibile ruolo tettonico.","fonti":["https://it.wikipedia.org/wiki/Lago_di_Garda","https://en.wikipedia.org/wiki/Lake_Garda","https://en.wikipedia.org/wiki/List_of_lakes_of_Italy"]},{"id":"maggiore","nome":"Lago Maggiore","superficie_km2":212,"profondita_max_m":372,"lat":46.0981,"lon":8.7147,"regioni":["Piemonte","Lombardia"],"origine":"glaciale","testo":"Il Lago Maggiore è il secondo lago d'Italia per grandezza. La sua parte più a nord si trova in Svizzera. Il fiume Ticino lo attraversa.","note":"Anche in Svizzera (Canton Ticino), circa 80% della superficie è italiana. Superficie 212 km² (it.wiki), 212,5 (en.wiki), 210 (elenco en.wiki); varia con il livello dell'acqua. Profondità 372 m (infobox); il testo it.wiki parla di circa 380 m. Origine fluvioglaciale (escavazione glaciale su valle fluviale).","fonti":["https://it.wikipedia.org/wiki/Lago_Maggiore","https://en.wikipedia.org/wiki/Lake_Maggiore"]},{"id":"como","nome":"Lago di Como","superficie_km2":146,"profondita_max_m":410,"lat":45.9903,"lon":9.2617,"regioni":["Lombardia"],"origine":"glaciale","testo":"Il Lago di Como ha la forma di una Y rovesciata. È il lago più profondo d'Italia. Il fiume Adda lo attraversa.","note":"Profondità massima molto discordante: 410 m (elenco en.wiki, fonti divulgative), 412 m (infobox it.wiki), 418 m (testo it.wiki), 425 m (en.wiki). Scelto 410 come valore più citato. Superficie 145 km² (it.wiki) o 146 (en.wiki). Origine fluvio-glaciale.","fonti":["https://it.wikipedia.org/wiki/Lago_di_Como","https://en.wikipedia.org/wiki/Lake_Como","https://en.wikipedia.org/wiki/List_of_lakes_of_Italy"]},{"id":"iseo","nome":"Lago d'Iseo","superficie_km2":65.3,"profondita_max_m":251,"lat":45.7167,"lon":10.0833,"regioni":["Lombardia"],"origine":"glaciale","testo":"Il Lago d'Iseo si trova tra le province di Brescia e Bergamo. Al centro c'è Monte Isola, la più grande isola di lago in Italia. Il fiume Oglio lo attraversa.","note":"Profondità 251 m (testo it.wiki, en.wiki, elenco en.wiki); l'infobox it.wiki riporta 258 m. Detto anche Sebino. Monte Isola: 'la più grande isola lacustre naturale d'Italia' (it.wiki); l'affermazione 'più grande d'Europa', diffusa online, non è confermata dalle fonti consultate.","fonti":["https://it.wikipedia.org/wiki/Lago_d%27Iseo","https://en.wikipedia.org/wiki/Lake_Iseo","https://en.wikipedia.org/wiki/List_of_lakes_of_Italy"]},{"id":"trasimeno","nome":"Lago Trasimeno","superficie_km2":128,"profondita_max_m":6,"lat":43.1333,"lon":12.1,"regioni":["Umbria"],"origine":"tettonica","testo":"Il Trasimeno è il quarto lago d'Italia per grandezza. È molto basso: al massimo circa 6 metri. Si trova in Umbria e non ha un fiume emissario naturale.","note":"Lago laminare (profondità media 4,3 m); la profondità varia con la siccità. Elenco en.wiki: 124 km² e 7 m. Origine tettonica e alluvionale. L'emissario è artificiale.","fonti":["https://it.wikipedia.org/wiki/Lago_Trasimeno","https://en.wikipedia.org/wiki/List_of_lakes_of_Italy"]},{"id":"bolsena","nome":"Lago di Bolsena","superficie_km2":113.5,"profondita_max_m":151,"lat":42.6,"lon":11.9333,"regioni":["Lazio"],"origine":"vulcanica","testo":"Il Lago di Bolsena è nato da antichi vulcani. È il lago vulcanico più grande d'Europa. Si trova nel Lazio, in provincia di Viterbo.","note":"Profondità 151 m (en.wiki, testo it.wiki); l'infobox it.wiki riporta 180 m. Si è formato per lo sprofondamento (collasso calderico) dei vulcani dei Monti Volsini.","fonti":["https://it.wikipedia.org/wiki/Lago_di_Bolsena","https://en.wikipedia.org/wiki/Lake_Bolsena"]},{"id":"bracciano","nome":"Lago di Bracciano","superficie_km2":56.8,"profondita_max_m":165,"lat":42.1211,"lon":12.2319,"regioni":["Lazio"],"origine":"vulcanica","testo":"Il Lago di Bracciano è di origine vulcanica. Si trova vicino a Roma. La sua acqua è una riserva di acqua potabile per la città.","note":"Superficie 56,76 km² (en.wiki), 56,5 (it.wiki). Profondità 165 m (en.wiki) o circa 160 m (it.wiki, fonte debole). Depressione vulcano-tettonica del complesso Sabatino.","fonti":["https://it.wikipedia.org/wiki/Lago_di_Bracciano","https://en.wikipedia.org/wiki/Lake_Bracciano"]},{"id":"lugano","nome":"Lago di Lugano (Ceresio)","superficie_km2":48.7,"profondita_max_m":288,"lat":45.9833,"lon":8.9667,"regioni":["Lombardia"],"origine":"glaciale","testo":"Il Lago di Lugano è diviso tra Italia e Svizzera. La parte più grande è in Svizzera. Si chiama anche Ceresio.","note":"Circa 18 km² su 48,7 sono italiani (province di Como e Varese); il resto è nel Canton Ticino.","fonti":["https://it.wikipedia.org/wiki/Lago_di_Lugano","https://en.wikipedia.org/wiki/Lake_Lugano"]},{"id":"orta","nome":"Lago d'Orta","superficie_km2":18.1,"profondita_max_m":143,"lat":45.8128,"lon":8.3956,"regioni":["Piemonte"],"origine":"glaciale","testo":"Il Lago d'Orta si trova in Piemonte. In mezzo c'è la piccola isola di San Giulio. Il suo emissario scorre verso nord, cosa rara sulle Alpi.","note":"Elenco en.wiki: 18,2 km² e 144 m. Province di Novara e Verbano-Cusio-Ossola. Emissario: Nigoglia, a Omegna.","fonti":["https://it.wikipedia.org/wiki/Lago_d%27Orta","https://en.wikipedia.org/wiki/List_of_lakes_of_Italy"]},{"id":"varano","nome":"Lago di Varano","superficie_km2":60.5,"profondita_max_m":5,"lat":41.8792,"lon":15.7461,"regioni":["Puglia"],"origine":"costiera (laguna)","testo":"Il Lago di Varano si trova sul Gargano, in Puglia. È un lago costiero, separato dal mare da una striscia di terra. È il lago costiero più grande d'Italia.","note":"La voce it.wiki è segnalata come senza fonti sufficienti. Acqua salmastra, profondità media 3 m.","fonti":["https://it.wikipedia.org/wiki/Lago_di_Varano"]}],"capoluoghi":[{"regione":"Abruzzo","capoluogo":"L'Aquila","lat":42.354,"lon":13.392},{"regione":"Basilicata","capoluogo":"Potenza","lat":40.6333,"lon":15.8},{"regione":"Calabria","capoluogo":"Catanzaro","lat":38.91,"lon":16.5875},{"regione":"Campania","capoluogo":"Napoli","lat":40.8358,"lon":14.2486},{"regione":"Emilia-Romagna","capoluogo":"Bologna","lat":44.4939,"lon":11.3428},{"regione":"Friuli-Venezia Giulia","capoluogo":"Trieste","lat":45.6503,"lon":13.7703},{"regione":"Lazio","capoluogo":"Roma","lat":41.8931,"lon":12.4828},{"regione":"Liguria","capoluogo":"Genova","lat":44.4072,"lon":8.9339},{"regione":"Lombardia","capoluogo":"Milano","lat":45.4669,"lon":9.19},{"regione":"Marche","capoluogo":"Ancona","lat":43.6167,"lon":13.5167},{"regione":"Molise","capoluogo":"Campobasso","lat":41.561,"lon":14.6684},{"regione":"Piemonte","capoluogo":"Torino","lat":45.0792,"lon":7.6761},{"regione":"Puglia","capoluogo":"Bari","lat":41.1253,"lon":16.8667},{"regione":"Sardegna","capoluogo":"Cagliari","lat":39.2167,"lon":9.1167},{"regione":"Sicilia","capoluogo":"Palermo","lat":38.1157,"lon":13.3613},{"regione":"Toscana","capoluogo":"Firenze","lat":43.7714,"lon":11.2542},{"regione":"Trentino-Alto Adige","capoluogo":"Trento","lat":46.0667,"lon":11.1167},{"regione":"Umbria","capoluogo":"Perugia","lat":43.1119,"lon":12.3885},{"regione":"Valle d'Aosta","capoluogo":"Aosta","lat":45.7372,"lon":7.3206},{"regione":"Veneto","capoluogo":"Venezia","lat":45.4397,"lon":12.3319},{"regione":"Lombardia","capoluogo":"Orzinuovi (la nostra scuola)","lat":45.402,"lon":9.9243,"speciale":true,"nota":"Comune in provincia di Brescia, 89 m s.l.m. Non è un capoluogo: voce speciale per la scuola. Coordinate del centro (OpenStreetMap)."}],"unesco":{"aggiornato_al":"2026-10-20","totale":62,"culturali":56,"naturali":6,"transnazionali":7,"ultima_iscrizione":"2026 — Sistema dei teatri condominiali all'italiana (48ª sessione del Comitato del Patrimonio Mondiale, Busan, 19-29 luglio 2026)","nota_conteggio":"Siti italiani nella Lista del Patrimonio Mondiale al 20/10/2026: 62 (56 culturali, 6 naturali, nessuno misto; 7 condivisi con altri Stati). Il DM 221/2025 (Nuove Indicazioni) cita «60 siti»: il testo precede le iscrizioni del 2025 (domus de janas, 47ª sessione, Parigi) e del 2026 (teatri condominiali, 48ª sessione, Busan). Fonti del conteggio: dataset UNESCO «World Heritage List» (whc001, data.unesco.org, aggiornato il 19/10/2026) e it.wikipedia.","nota_punti":"I siti seriali o diffusi sono formati da più luoghi, a volte in regioni diverse: sulla carta hanno un solo spillo, su un punto rappresentativo scelto tra le componenti ufficiali UNESCO (preferendo il luogo più noto, o quello che non si sovrappone ad altri siti). Il nome del luogo dello spillo è nella scheda («Sulla carta»). Due coppie di siti a meno di 5 km (Tivoli; Padova) hanno un'etichetta comune.","esclusi":"Non rientrano nel conteggio la Città del Vaticano (Santa Sede, 1984) e il Centro storico di San Marino e Monte Titano (San Marino, 2008), che appartengono ad altri Stati.","divergenze":["Monte San Giorgio: il dataset UNESCO indica 2003 (anno del sito); it.wikipedia 2010 (ingresso della parte italiana). Usato 2010.","Faggete primordiali: il dataset UNESCO indica 2007; l'Italia vi entra nel 2017. Usato 2017.","Carsismo nei gessi: la coordinata di it.wikipedia (45°22'47.8\" N) è errata; usate le coordinate delle componenti UNESCO.","Faggete, Palafitte, Città termali: le coordinate di it.wikipedia indicano punti all'estero; usate le componenti italiane del dataset UNESCO.","Ferrovia Retica: il punto UNESCO è in Svizzera; usato Tirano.","Via Appia: 19 tratti (it.wikipedia) contro 21 componenti (dataset UNESCO).","Orto botanico di Padova: «primo orto botanico del mondo» (UNESCO); Pisa rivendica la priorità (1544)."],"fonti":["https://data.unesco.org/explore/dataset/whc001/","https://whc.unesco.org/en/statesparties/it","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia","https://en.wikipedia.org/wiki/List_of_World_Heritage_Sites_in_Italy"],"siti":[{"id":"valcamonica","whc":94,"nome":"Incisioni rupestri della Val Camonica","etichetta":"Val Camonica","luogo":"Val Camonica","anno":1979,"tipo":"culturale","regioni":["Lombardia"],"lat":46.0268,"lon":10.3536,"componenti_italia":6,"diffuso":true,"punto":"Capo di Ponte (BS), Parco nazionale delle incisioni rupestri","testo":"In Val Camonica, in provincia di Brescia, sulle rocce ci sono più di 140.000 figure incise. Le hanno fatte gli uomini della preistoria, nell'arco di 8000 anni.","note":"Primo sito italiano iscritto (1979). Sei parchi in Val Camonica: lo spillo è sul Parco nazionale delle incisioni rupestri di Naquane, a Capo di Ponte.","fonti":["https://whc.unesco.org/en/list/94/","https://it.wikipedia.org/wiki/Incisioni_rupestri_della_Val_Camonica","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"roma","whc":91,"nome":"Centro storico di Roma, le proprietà extraterritoriali della Santa Sede e la basilica di San Paolo fuori le mura","etichetta":"Roma","luogo":"Roma","anno":1980,"tipo":"culturale","regioni":["Lazio"],"lat":41.8902,"lon":12.4923,"componenti_italia":3,"diffuso":false,"condiviso_con":["Santa Sede"],"testo":"Roma fu il centro dell'antico Impero romano e poi della Chiesa cattolica. Nel centro storico ci sono i Fori, il Pantheon e tante chiese antichissime.","note":"Iscritto nel 1980, esteso nel 1990 alle mura di Urbano VIII. Sito condiviso con la Santa Sede. La Città del Vaticano è un sito a parte della Santa Sede (1984) e non rientra nel conteggio italiano.","fonti":["https://whc.unesco.org/en/list/91/","https://it.wikipedia.org/wiki/Centro_storico_di_Roma","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"cenacolo","whc":93,"nome":"Chiesa e convento domenicano di Santa Maria delle Grazie con l'Ultima Cena di Leonardo da Vinci","etichetta":"Cenacolo di Leonardo","luogo":"Milano","anno":1980,"tipo":"culturale","regioni":["Lombardia"],"lat":45.466,"lon":9.171,"componenti_italia":1,"diffuso":false,"testo":"A Milano, nel convento di Santa Maria delle Grazie, c'è l'Ultima Cena di Leonardo da Vinci. Leonardo la dipinse sul muro del refettorio tra il 1495 e il 1497.","note":"Il dipinto è sulla parete nord del refettorio del convento; date 1495-1497 dalla scheda UNESCO.","fonti":["https://whc.unesco.org/en/list/93/","https://it.wikipedia.org/wiki/Ultima_Cena_(Leonardo)","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"firenze","whc":174,"nome":"Centro storico di Firenze","etichetta":"Firenze","luogo":"Firenze","anno":1982,"tipo":"culturale","regioni":["Toscana"],"lat":43.7731,"lon":11.2561,"componenti_italia":1,"diffuso":false,"testo":"Firenze è la città del Rinascimento: qui lavorarono artisti come Giotto, Brunelleschi e Michelangelo. Il Duomo ha una cupola gigantesca, progettata da Brunelleschi.","note":"","fonti":["https://whc.unesco.org/en/list/174/","https://it.wikipedia.org/wiki/Centro_storico_di_Firenze","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"venezia","whc":394,"nome":"Venezia e la sua laguna","etichetta":"Venezia","luogo":"Venezia","anno":1987,"tipo":"culturale","regioni":["Veneto"],"lat":45.4343,"lon":12.3389,"componenti_italia":1,"diffuso":false,"testo":"Venezia è costruita su 118 piccole isole, in mezzo a una laguna. Al posto delle strade ci sono i canali e ci si sposta in barca.","note":"118 isole secondo la scheda UNESCO.","fonti":["https://whc.unesco.org/en/list/394/","https://it.wikipedia.org/wiki/Venezia","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"pisa","whc":395,"nome":"Piazza del Duomo, Pisa","etichetta":"Pisa: Piazza del Duomo","luogo":"Pisa","anno":1987,"tipo":"culturale","regioni":["Toscana"],"lat":43.7231,"lon":10.3964,"componenti_italia":1,"diffuso":false,"testo":"Su un grande prato ci sono il Duomo, il Battistero, il Camposanto e il campanile. Il campanile è la famosa Torre pendente.","note":"Detta anche Piazza dei Miracoli.","fonti":["https://whc.unesco.org/en/list/395/","https://it.wikipedia.org/wiki/Piazza_dei_Miracoli","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"san-gimignano","whc":550,"nome":"Centro storico di San Gimignano","etichetta":"San Gimignano","luogo":"San Gimignano","anno":1990,"tipo":"culturale","regioni":["Toscana"],"lat":43.4681,"lon":11.0417,"componenti_italia":1,"diffuso":false,"testo":"Nel Medioevo le famiglie ricche di San Gimignano costruirono circa 72 torri, per mostrare la loro potenza. Oggi ne restano 14.","note":"72 torri e 14 superstiti secondo la scheda UNESCO.","fonti":["https://whc.unesco.org/en/list/550/","https://it.wikipedia.org/wiki/San_Gimignano","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"matera","whc":670,"nome":"I Sassi e il parco delle chiese rupestri di Matera","etichetta":"Matera","luogo":"Matera","anno":1993,"tipo":"culturale","regioni":["Basilicata"],"lat":40.6664,"lon":16.6103,"componenti_italia":1,"diffuso":false,"testo":"I Sassi di Matera sono case e chiese scavate nella roccia. Le persone abitano questi luoghi fin dalla preistoria.","note":"","fonti":["https://whc.unesco.org/en/list/670/","https://it.wikipedia.org/wiki/Sassi_di_Matera","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"vicenza","whc":712,"nome":"Città di Vicenza e le ville del Palladio nel Veneto","etichetta":"Vicenza e ville di Palladio","luogo":"Vicenza","anno":1994,"tipo":"culturale","regioni":["Veneto"],"lat":45.5492,"lon":11.5494,"componenti_italia":25,"diffuso":true,"punto":"Vicenza","testo":"Nel Cinquecento l'architetto Andrea Palladio costruì a Vicenza palazzi ispirati agli antichi templi romani. Progettò anche molte ville di campagna in tutto il Veneto.","note":"Iscritto nel 1994, esteso nel 1996 alle ville: oggi la città con 23 edifici di Palladio e 24 ville sparse in quattro province venete. Lo spillo è sulla città.","fonti":["https://whc.unesco.org/en/list/712/","https://it.wikipedia.org/wiki/Citt%C3%A0_di_Vicenza_e_le_ville_palladiane_del_Veneto","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"siena","whc":717,"nome":"Centro storico di Siena","etichetta":"Siena","luogo":"Siena","anno":1995,"tipo":"culturale","regioni":["Toscana"],"lat":43.3186,"lon":11.3317,"componenti_italia":1,"diffuso":false,"testo":"Siena è una città del Medioevo rimasta quasi com'era. Al centro c'è Piazza del Campo, una grande piazza a forma di conchiglia.","note":"","fonti":["https://whc.unesco.org/en/list/717/","https://it.wikipedia.org/wiki/Siena","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"napoli","whc":726,"nome":"Centro storico di Napoli","etichetta":"Napoli","luogo":"Napoli","anno":1995,"tipo":"culturale","regioni":["Campania"],"lat":40.8488,"lon":14.2468,"componenti_italia":4,"diffuso":false,"testo":"Napoli fu fondata dagli antichi Greci, che la chiamarono Neapolis, cioè «città nuova». Nel centro storico le strade seguono ancora il disegno della città antica.","note":"Fondazione di Neapolis nel 470 a.C. secondo la scheda UNESCO (altre fonti indicano date diverse per gli insediamenti greci precedenti). Quattro componenti, tutte nel comune di Napoli.","fonti":["https://whc.unesco.org/en/list/726/","https://it.wikipedia.org/wiki/Centro_storico_di_Napoli","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"crespi","whc":730,"nome":"Crespi d'Adda","etichetta":"Crespi d'Adda","luogo":"Crespi d'Adda","anno":1995,"tipo":"culturale","regioni":["Lombardia"],"lat":45.5933,"lon":9.5383,"componenti_italia":1,"diffuso":false,"testo":"Crespi d'Adda è un villaggio costruito alla fine dell'Ottocento intorno a una fabbrica di cotone. Il proprietario fece costruire anche le case, la scuola e la chiesa per gli operai.","note":"Villaggio operaio nel comune di Capriate San Gervasio (BG).","fonti":["https://whc.unesco.org/en/list/730/","https://it.wikipedia.org/wiki/Crespi_d%27Adda","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"ferrara","whc":733,"nome":"Ferrara, città del Rinascimento, e il suo Delta del Po","etichetta":"Ferrara e Delta del Po","luogo":"Ferrara","anno":1995,"tipo":"culturale","regioni":["Emilia-Romagna"],"lat":44.8372,"lon":11.6198,"componenti_italia":2,"diffuso":true,"punto":"Ferrara","testo":"Nel Rinascimento Ferrara era la città della famiglia d'Este, che la riempì di palazzi e di artisti. Il sito comprende anche il Delta del Po, dove il fiume arriva al mare.","note":"Iscritto nel 1995, esteso nel 1999 al Delta del Po con le «delizie» estensi. Lo spillo è sulla città.","fonti":["https://whc.unesco.org/en/list/733/","https://it.wikipedia.org/wiki/Ferrara","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"castel-del-monte","whc":398,"nome":"Castel del Monte","etichetta":"Castel del Monte","luogo":"Andria","anno":1996,"tipo":"culturale","regioni":["Puglia"],"lat":41.0848,"lon":16.2709,"componenti_italia":1,"diffuso":false,"testo":"L'imperatore Federico II fece costruire questo castello nel Duecento, su una collina della Puglia. Ha una forma perfetta a otto lati, con otto torri anch'esse a otto lati.","note":"","fonti":["https://whc.unesco.org/en/list/398/","https://it.wikipedia.org/wiki/Castel_del_Monte","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"alberobello","whc":787,"nome":"I trulli di Alberobello","etichetta":"Trulli di Alberobello","luogo":"Alberobello","anno":1996,"tipo":"culturale","regioni":["Puglia"],"lat":40.7845,"lon":17.238,"componenti_italia":6,"diffuso":false,"testo":"I trulli sono case di pietra con il tetto a cono. Sono costruiti a secco: le pietre stanno insieme senza calce né cemento.","note":"","fonti":["https://whc.unesco.org/en/list/787/","https://it.wikipedia.org/wiki/Trullo","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"ravenna","whc":788,"nome":"Monumenti paleocristiani di Ravenna","etichetta":"Ravenna","luogo":"Ravenna","anno":1996,"tipo":"culturale","regioni":["Emilia-Romagna"],"lat":44.4206,"lon":12.1964,"componenti_italia":8,"diffuso":false,"testo":"Ravenna fu la capitale dell'Impero romano d'Occidente nel V secolo. Le sue chiese antiche sono piene di mosaici d'oro e di colori.","note":"Otto monumenti; lo spillo è su San Vitale.","fonti":["https://whc.unesco.org/en/list/788/","https://it.wikipedia.org/wiki/Monumenti_paleocristiani_di_Ravenna","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"pienza","whc":789,"nome":"Centro storico di Pienza","etichetta":"Pienza","luogo":"Pienza","anno":1996,"tipo":"culturale","regioni":["Toscana"],"lat":43.0769,"lon":11.6786,"componenti_italia":1,"diffuso":false,"testo":"Nel 1459 papa Pio II decise di trasformare il suo paese natale in una «città ideale». Gli diede anche un nuovo nome: Pienza, da Pio.","note":"Progetto dell'architetto Bernardo Rossellino, allievo di Leon Battista Alberti.","fonti":["https://whc.unesco.org/en/list/789/","https://it.wikipedia.org/wiki/Pienza","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"caserta","whc":549,"nome":"Reggia di Caserta con il parco, l'Acquedotto Vanvitelliano e il complesso di San Leucio","etichetta":"Reggia di Caserta","luogo":"Caserta","anno":1997,"tipo":"culturale","regioni":["Campania"],"lat":41.0733,"lon":14.3264,"componenti_italia":1,"diffuso":false,"testo":"Il re Carlo di Borbone fece costruire questa reggia a metà del Settecento, per competere con Versailles. Ha un parco immenso, con fontane e una grande cascata.","note":"L'acquedotto attraversa anche la provincia di Benevento.","fonti":["https://whc.unesco.org/en/list/549/","https://it.wikipedia.org/wiki/Reggia_di_Caserta","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"residenze-sabaude","whc":823,"nome":"Residenze della Casa Reale di Savoia","etichetta":"Residenze Sabaude","luogo":"Torino","anno":1997,"tipo":"culturale","regioni":["Piemonte"],"lat":45.073,"lon":7.6866,"componenti_italia":14,"diffuso":true,"punto":"Torino, Palazzo Reale","testo":"Quando i Savoia fecero di Torino la loro capitale, costruirono palazzi e castelli in città e nei dintorni. Tra questi ci sono il Palazzo Reale e la Reggia di Venaria.","note":"Quattordici componenti a Torino e nelle province di Torino e Cuneo; lo spillo è sul Palazzo Reale (zona di comando).","fonti":["https://whc.unesco.org/en/list/823/","https://it.wikipedia.org/wiki/Residenze_sabaude_in_Piemonte","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"orto-padova","whc":824,"nome":"Orto botanico di Padova","etichetta":"Orto botanico di Padova","luogo":"Padova","anno":1997,"tipo":"culturale","regioni":["Veneto"],"lat":45.3991,"lon":11.8807,"componenti_italia":1,"diffuso":false,"testo":"È uno dei più antichi orti botanici del mondo: nacque nel 1545 per studiare le piante medicinali. Al centro c'è un giardino rotondo, che rappresenta il mondo.","note":"La scheda UNESCO lo definisce il primo orto botanico del mondo; l'orto di Pisa (1544) rivendica la priorità ma ha cambiato sede, mentre quello di Padova è ancora nel luogo originario.","fonti":["https://whc.unesco.org/en/list/824/","https://it.wikipedia.org/wiki/Orto_botanico_di_Padova","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"cinque-terre","whc":826,"nome":"Portovenere, Cinque Terre e Isole (Palmaria, Tino e Tinetto)","etichetta":"Cinque Terre","luogo":"Cinque Terre","anno":1997,"tipo":"culturale","regioni":["Liguria"],"lat":44.1069,"lon":9.7292,"componenti_italia":4,"diffuso":true,"punto":"Cinque Terre","testo":"Le Cinque Terre sono cinque paesi colorati, aggrappati alle rocce sopra il mare. Sulle colline ripide gli abitanti hanno costruito muretti di pietra per coltivare la vite.","note":"Il sito comprende anche Portovenere e le isole Palmaria, Tino e Tinetto.","fonti":["https://whc.unesco.org/en/list/826/","https://it.wikipedia.org/wiki/Cinque_Terre","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"modena","whc":827,"nome":"Cattedrale, Torre Civica e Piazza Grande di Modena","etichetta":"Modena","luogo":"Modena","anno":1997,"tipo":"culturale","regioni":["Emilia-Romagna"],"lat":44.6462,"lon":10.9257,"componenti_italia":1,"diffuso":false,"testo":"Il Duomo di Modena fu costruito nel XII secolo ed è decorato con sculture che raccontano storie della Bibbia. Accanto c'è la Ghirlandina, l'alta torre simbolo della città.","note":"Architetto Lanfranco, scultore Wiligelmo (scheda UNESCO).","fonti":["https://whc.unesco.org/en/list/827/","https://it.wikipedia.org/wiki/Duomo_di_Modena","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"pompei","whc":829,"nome":"Aree archeologiche di Pompei, Ercolano e Torre Annunziata","etichetta":"Pompei ed Ercolano","luogo":"Pompei","anno":1997,"tipo":"culturale","regioni":["Campania"],"lat":40.7511,"lon":14.4861,"componenti_italia":7,"diffuso":true,"punto":"Pompei","testo":"Nel 79 dopo Cristo il Vesuvio eruttò e seppellì le città romane di Pompei ed Ercolano. Oggi si cammina tra case, strade e botteghe di quasi 2000 anni fa.","note":"Sette componenti tra Pompei, Ercolano e Torre Annunziata (Oplontis); lo spillo è su Pompei.","fonti":["https://whc.unesco.org/en/list/829/","https://it.wikipedia.org/wiki/Scavi_archeologici_di_Pompei","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"costiera-amalfitana","whc":830,"nome":"Costiera Amalfitana","etichetta":"Costiera Amalfitana","luogo":"Amalfi","anno":1997,"tipo":"culturale","regioni":["Campania"],"lat":40.6333,"lon":14.6028,"componenti_italia":1,"diffuso":false,"testo":"È una costa di montagne a picco sul mare, con paesi come Amalfi e Ravello. Sui pendii gli abitanti hanno costruito terrazze per coltivare limoni, viti e ulivi.","note":"","fonti":["https://whc.unesco.org/en/list/830/","https://it.wikipedia.org/wiki/Costiera_amalfitana","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"agrigento","whc":831,"nome":"Area archeologica di Agrigento","etichetta":"Agrigento: Valle dei Templi","luogo":"Agrigento","anno":1997,"tipo":"culturale","regioni":["Sicilia"],"lat":37.2897,"lon":13.5933,"componenti_italia":1,"diffuso":false,"testo":"Agrigento fu fondata dai Greci nel VI secolo avanti Cristo. Nella Valle dei Templi si vedono ancora grandi templi greci, come il Tempio della Concordia.","note":"","fonti":["https://whc.unesco.org/en/list/831/","https://it.wikipedia.org/wiki/Valle_dei_Templi","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"villa-casale","whc":832,"nome":"Villa romana del Casale","etichetta":"Villa del Casale","luogo":"Piazza Armerina","anno":1997,"tipo":"culturale","regioni":["Sicilia"],"lat":37.3661,"lon":14.3342,"componenti_italia":1,"diffuso":false,"testo":"Era una villa di campagna molto ricca, costruita dai Romani vicino a Piazza Armerina. I pavimenti sono coperti di mosaici con scene di caccia, giochi e animali.","note":"","fonti":["https://whc.unesco.org/en/list/832/","https://it.wikipedia.org/wiki/Villa_romana_del_Casale","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"su-nuraxi","whc":833,"nome":"Su Nuraxi di Barumini","etichetta":"Su Nuraxi","luogo":"Barumini","anno":1997,"tipo":"culturale","regioni":["Sardegna"],"lat":39.7058,"lon":8.9914,"componenti_italia":1,"diffuso":false,"testo":"Su Nuraxi è un nuraghe: una grande torre di pietre costruita più di 3000 anni fa. Intorno c'è un villaggio di capanne rotonde.","note":"Età del Bronzo, fine del II millennio a.C. (scheda UNESCO).","fonti":["https://whc.unesco.org/en/list/833/","https://it.wikipedia.org/wiki/Su_Nuraxi","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"aquileia","whc":825,"nome":"Area archeologica e basilica patriarcale di Aquileia","etichetta":"Aquileia","luogo":"Aquileia","anno":1998,"tipo":"culturale","regioni":["Friuli-Venezia Giulia"],"lat":45.7683,"lon":13.3675,"componenti_italia":1,"diffuso":false,"testo":"Aquileia fu una delle città più grandi e ricche dell'Impero romano, poi distrutta da Attila. Nella basilica c'è un enorme pavimento a mosaico.","note":"","fonti":["https://whc.unesco.org/en/list/825/","https://it.wikipedia.org/wiki/Aquileia_(citt%C3%A0_antica)","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"urbino","whc":828,"nome":"Centro storico di Urbino","etichetta":"Urbino","luogo":"Urbino","anno":1998,"tipo":"culturale","regioni":["Marche"],"lat":43.7261,"lon":12.6359,"componenti_italia":1,"diffuso":false,"testo":"Nel Quattrocento Urbino era una piccola città sulle colline, piena di artisti e di studiosi. Qui nacque il pittore Raffaello.","note":"","fonti":["https://whc.unesco.org/en/list/828/","https://it.wikipedia.org/wiki/Urbino","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"cilento","whc":842,"nome":"Parco nazionale del Cilento e Vallo di Diano con i siti archeologici di Paestum e Velia e la Certosa di Padula","etichetta":"Cilento con Paestum e Velia","luogo":"Cilento","anno":1998,"tipo":"culturale","regioni":["Campania"],"lat":40.2833,"lon":15.4833,"componenti_italia":3,"diffuso":true,"punto":"interno del Parco del Cilento","testo":"Il Parco del Cilento unisce montagne, coste e antiche vie di passaggio. Dentro ci sono le città greche di Paestum e Velia e la grande Certosa di Padula.","note":"Tre componenti; lo spillo è sul punto UNESCO della componente principale (Paestum, Velia, Certosa di Padula, Monte Cervati e Vallo di Diano), nell'interno del parco.","fonti":["https://whc.unesco.org/en/list/842/","https://it.wikipedia.org/wiki/Parco_nazionale_del_Cilento,_Vallo_di_Diano_e_Alburni","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"villa-adriana","whc":907,"nome":"Villa Adriana (Tivoli)","etichetta":"Villa Adriana","luogo":"Tivoli","anno":1999,"tipo":"culturale","regioni":["Lazio"],"lat":41.9442,"lon":12.772,"componenti_italia":1,"diffuso":false,"testo":"L'imperatore Adriano fece costruire questa villa vicino a Tivoli nel II secolo dopo Cristo. Era grande come una piccola città, con edifici ispirati all'Egitto e alla Grecia.","note":"A circa 3 km da Villa d'Este: sulla carta i due siti hanno un'etichetta comune «Tivoli».","fonti":["https://whc.unesco.org/en/list/907/","https://it.wikipedia.org/wiki/Villa_Adriana","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"verona","whc":797,"nome":"Città di Verona","etichetta":"Verona","luogo":"Verona","anno":2000,"tipo":"culturale","regioni":["Veneto"],"lat":45.4386,"lon":10.9939,"componenti_italia":1,"diffuso":false,"testo":"Verona ha monumenti romani, medievali e del Rinascimento. Il più famoso è l'Arena, un anfiteatro romano dove ancora oggi si fanno spettacoli.","note":"","fonti":["https://whc.unesco.org/en/list/797/","https://it.wikipedia.org/wiki/Verona","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"eolie","whc":908,"nome":"Isole Eolie","etichetta":"Isole Eolie","luogo":"Isole Eolie","anno":2000,"tipo":"naturale","regioni":["Sicilia"],"lat":38.4879,"lon":14.9456,"componenti_italia":1,"diffuso":false,"testo":"Le Eolie sono sette isole nate da vulcani, nel mare a nord della Sicilia. Stromboli e Vulcano sono ancora attivi e danno il nome a due tipi di eruzione.","note":"Le eruzioni «stromboliane» e «vulcaniane» prendono il nome da Stromboli e Vulcano (scheda UNESCO).","fonti":["https://whc.unesco.org/en/list/908/","https://it.wikipedia.org/wiki/Isole_Eolie","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"assisi","whc":990,"nome":"Assisi, la basilica di San Francesco e altri siti francescani","etichetta":"Assisi","luogo":"Assisi","anno":2000,"tipo":"culturale","regioni":["Umbria"],"lat":43.0711,"lon":12.6147,"componenti_italia":2,"diffuso":false,"testo":"Assisi è la città dove nacque san Francesco. Nella basilica di San Francesco ci sono affreschi di grandi pittori come Giotto.","note":"Due componenti: la città con il paesaggio e Santa Maria degli Angeli; lo spillo è sulla città.","fonti":["https://whc.unesco.org/en/list/990/","https://it.wikipedia.org/wiki/Basilica_di_San_Francesco","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"villa-este","whc":1025,"nome":"Villa d'Este (Tivoli)","etichetta":"Villa d'Este","luogo":"Tivoli","anno":2001,"tipo":"culturale","regioni":["Lazio"],"lat":41.9639,"lon":12.7963,"componenti_italia":1,"diffuso":false,"testo":"Villa d'Este a Tivoli ha un giardino del Cinquecento pieno di fontane e giochi d'acqua. L'acqua scende dalla collina e fa funzionare le fontane senza motori.","note":"A circa 3 km da Villa Adriana: sulla carta i due siti hanno un'etichetta comune «Tivoli». Le fontane sono alimentate a caduta dall'acqua dell'Aniene.","fonti":["https://whc.unesco.org/en/list/1025/","https://it.wikipedia.org/wiki/Villa_d%27Este_(Tivoli)","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"val-di-noto","whc":1024,"nome":"Città tardo barocche del Val di Noto (Sicilia sud-orientale)","etichetta":"Val di Noto","luogo":"Noto","anno":2002,"tipo":"culturale","regioni":["Sicilia"],"lat":36.8932,"lon":15.0689,"componenti_italia":8,"diffuso":true,"punto":"Noto","testo":"Nel 1693 un terremoto distrusse molte città della Sicilia orientale. Otto di queste, come Noto, Ragusa e Catania, furono ricostruite in stile barocco, con chiese e palazzi pieni di decorazioni.","note":"Otto città: Caltagirone, Militello in Val di Catania, Catania, Modica, Noto, Palazzolo Acreide, Ragusa, Scicli. Lo spillo è su Noto.","fonti":["https://whc.unesco.org/en/list/1024/","https://it.wikipedia.org/wiki/Citt%C3%A0_tardo_barocche_del_Val_di_Noto","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"sacri-monti","whc":1068,"nome":"Sacri Monti del Piemonte e della Lombardia","etichetta":"Sacri Monti","luogo":"Varallo","anno":2003,"tipo":"culturale","regioni":["Piemonte","Lombardia"],"lat":45.8186,"lon":8.2547,"componenti_italia":9,"diffuso":true,"punto":"Sacro Monte di Varallo","testo":"I Sacri Monti sono gruppi di cappelle costruite su colline e monti tra il Cinquecento e il Seicento. Dentro, statue e affreschi raccontano storie della fede cristiana.","note":"Nove Sacri Monti (7 in Piemonte, 2 in Lombardia); lo spillo è su Varallo, il più antico («Nuova Gerusalemme»).","fonti":["https://whc.unesco.org/en/list/1068/","https://it.wikipedia.org/wiki/Sacri_Monti_del_Piemonte_e_della_Lombardia","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"val-d-orcia","whc":1026,"nome":"Val d'Orcia","etichetta":"Val d'Orcia","luogo":"Val d'Orcia","anno":2004,"tipo":"culturale","regioni":["Toscana"],"lat":43.0667,"lon":11.55,"componenti_italia":1,"diffuso":false,"testo":"La Val d'Orcia è una campagna di dolci colline, cipressi e casali. Nel Trecento e nel Quattrocento fu ridisegnata per essere bella come un dipinto.","note":"Paesaggio agrario del territorio di Siena, ridisegnato nel XIV-XV secolo (scheda UNESCO). Pienza è a circa 10 km.","fonti":["https://whc.unesco.org/en/list/1026/","https://it.wikipedia.org/wiki/Val_d%27Orcia","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"necropoli-etrusche","whc":1158,"nome":"Necropoli etrusche di Cerveteri e Tarquinia","etichetta":"Cerveteri e Tarquinia","luogo":"Tarquinia","anno":2004,"tipo":"culturale","regioni":["Lazio"],"lat":42.2504,"lon":11.7699,"componenti_italia":2,"diffuso":true,"punto":"Tarquinia","testo":"Gli Etruschi costruivano per i loro morti tombe simili a case. A Cerveteri ci sono grandi tombe rotonde, a Tarquinia tombe dipinte con scene di feste e di giochi.","note":"Due necropoli: Banditaccia (Cerveteri) e Monterozzi (Tarquinia), a circa 45 km l'una dall'altra; lo spillo è su Tarquinia.","fonti":["https://whc.unesco.org/en/list/1158/","https://it.wikipedia.org/wiki/Tombe_etrusche","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"siracusa","whc":1200,"nome":"Siracusa e la necropoli rupestre di Pantalica","etichetta":"Siracusa e Pantalica","luogo":"Siracusa","anno":2005,"tipo":"culturale","regioni":["Sicilia"],"lat":37.0594,"lon":15.2931,"componenti_italia":3,"diffuso":true,"punto":"Siracusa, isola di Ortigia","testo":"Siracusa fu una delle città greche più potenti del Mediterraneo e ha ancora un grande teatro greco. Poco lontano c'è Pantalica, con più di 5000 tombe scavate nella roccia.","note":"Tre componenti; lo spillo è su Ortigia. Pantalica è a circa 25 km.","fonti":["https://whc.unesco.org/en/list/1200/","https://it.wikipedia.org/wiki/Pantalica","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"genova","whc":1211,"nome":"Genova: le Strade Nuove e il sistema dei Palazzi dei Rolli","etichetta":"Genova: Palazzi dei Rolli","luogo":"Genova","anno":2006,"tipo":"culturale","regioni":["Liguria"],"lat":44.412,"lon":8.93,"componenti_italia":1,"diffuso":false,"testo":"Tra Cinquecento e Seicento le famiglie nobili di Genova costruirono splendidi palazzi lungo le Strade Nuove. I palazzi più belli erano scritti in elenchi, i «rolli», e ospitavano re e ambasciatori in visita.","note":"","fonti":["https://whc.unesco.org/en/list/1211/","https://it.wikipedia.org/wiki/Le_Strade_Nuove_e_il_sistema_dei_palazzi_dei_Rolli_di_Genova","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"ferrovia-retica","whc":1276,"nome":"Ferrovia Retica nel paesaggio di Albula e Bernina","etichetta":"Trenino del Bernina","luogo":"Tirano","anno":2008,"tipo":"culturale","regioni":["Lombardia"],"lat":46.2164,"lon":10.1689,"componenti_italia":1,"diffuso":false,"condiviso_con":["Svizzera"],"punto":"Tirano","testo":"Il trenino del Bernina parte da Tirano, in Valtellina, e sale fino in Svizzera tra ghiacciai e montagne. Lungo il percorso ci sono tanti ponti e gallerie, costruiti più di cento anni fa.","note":"Sito condiviso con la Svizzera: quasi tutto il tracciato è svizzero. Il punto UNESCO del sito (46,498 N, 9,846 E) è in Svizzera; lo spillo è su Tirano, l'unica parte italiana (coordinate di it.wikipedia).","fonti":["https://whc.unesco.org/en/list/1276/","https://it.wikipedia.org/wiki/Tirano","https://it.wikipedia.org/wiki/Ferrovia_del_Bernina","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"mantova","whc":1287,"nome":"Mantova e Sabbioneta","etichetta":"Mantova e Sabbioneta","luogo":"Mantova","anno":2008,"tipo":"culturale","regioni":["Lombardia"],"lat":45.1594,"lon":10.7944,"componenti_italia":2,"diffuso":true,"punto":"Mantova","testo":"Mantova e Sabbioneta erano città della famiglia Gonzaga nel Rinascimento. Sabbioneta fu progettata come una «città ideale», con strade regolari e mura a forma di stella.","note":"Due componenti a circa 30 km di distanza; lo spillo è su Mantova.","fonti":["https://whc.unesco.org/en/list/1287/","https://it.wikipedia.org/wiki/Sabbioneta","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"dolomiti","whc":1237,"nome":"Dolomiti","etichetta":"Dolomiti","luogo":"Dolomiti","anno":2009,"tipo":"naturale","regioni":["Veneto","Trentino-Alto Adige","Friuli-Venezia Giulia"],"lat":46.4317,"lon":11.8564,"componenti_italia":9,"diffuso":true,"punto":"Marmolada","testo":"Le Dolomiti sono montagne di roccia chiara, che al tramonto si tinge di rosa. Sono nate da antiche scogliere di un mare caldo, più di 200 milioni di anni fa.","note":"Nove sistemi montuosi in tre regioni e cinque province; lo spillo è sulla Marmolada, la cima più alta. Rocce di piattaforme carbonatiche del Triassico (scheda UNESCO).","fonti":["https://whc.unesco.org/en/list/1237/","https://it.wikipedia.org/wiki/Dolomiti","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"monte-san-giorgio","whc":1090,"nome":"Monte San Giorgio","etichetta":"Monte San Giorgio","luogo":"Monte San Giorgio","anno":2010,"tipo":"naturale","regioni":["Lombardia"],"lat":45.902,"lon":8.923,"componenti_italia":1,"diffuso":false,"anno_nota":"Sito iscritto nel 2003 per la parte svizzera; la parte italiana è stata aggiunta nel 2010.","condiviso_con":["Svizzera"],"testo":"Nella roccia di questo monte, tra Italia e Svizzera, ci sono fossili di rettili marini e di pesci. Vivevano in una laguna di mare caldo circa 240 milioni di anni fa, nel Triassico.","note":"Sito condiviso con la Svizzera: parte svizzera iscritta nel 2003, parte italiana (provincia di Varese) aggiunta nel 2010; nel conteggio italiano vale dal 2010. Fossili del Triassico medio, 245-230 milioni di anni fa (scheda UNESCO). Spillo sul punto UNESCO, al confine. Sito iscritto nel 2003 per la parte svizzera; la parte italiana è stata aggiunta nel 2010.","fonti":["https://whc.unesco.org/en/list/1090/","https://it.wikipedia.org/wiki/Monte_San_Giorgio_(UNESCO)","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"longobardi","whc":1318,"nome":"Longobardi in Italia. I luoghi del potere (568-774 d.C.)","etichetta":"Longobardi","luogo":"Brescia","anno":2011,"tipo":"culturale","regioni":["Friuli-Venezia Giulia","Lombardia","Umbria","Campania","Puglia"],"lat":45.5397,"lon":10.2261,"componenti_italia":7,"diffuso":true,"punto":"Brescia, Santa Giulia","testo":"I Longobardi arrivarono in Italia dal nord nel 568 e governarono gran parte della penisola per circa due secoli. A Brescia, vicino a noi, c'è il loro monastero di Santa Giulia, che oggi è un museo.","note":"Sette luoghi: Cividale del Friuli, Brescia, Castelseprio-Torba, Spoleto, Campello sul Clitunno, Benevento, Monte Sant'Angelo. Lo spillo è su Brescia (San Salvatore-Santa Giulia), la componente più vicina alla scuola.","fonti":["https://whc.unesco.org/en/list/1318/","https://it.wikipedia.org/wiki/Longobardi_in_Italia:_i_luoghi_del_potere","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"palafitte","whc":1363,"nome":"Siti palafitticoli preistorici dell'arco alpino","etichetta":"Palafitte","luogo":"Ledro","anno":2011,"tipo":"culturale","regioni":["Lombardia","Piemonte","Veneto","Trentino-Alto Adige","Friuli-Venezia Giulia"],"lat":45.8741,"lon":10.765,"componenti_italia":19,"diffuso":true,"condiviso_con":["Svizzera","Austria","Francia","Germania","Slovenia"],"punto":"Molina di Ledro (Trentino)","testo":"Migliaia di anni fa, sulle rive dei laghi, le persone costruivano case su pali di legno: le palafitte. Alcuni di questi villaggi erano vicino a noi, in provincia di Brescia, intorno al Lago di Garda.","note":"Sito di 111 componenti in sei Stati (Svizzera, Austria, Francia, Germania, Italia, Slovenia), databili 5000-500 a.C. In Italia 19 componenti in cinque regioni, tra cui Lavagnone, Lucone e San Sivino in provincia di Brescia. Lo spillo è su Molina di Ledro (Trentino), dove c'è un museo con palafitte ricostruite.","fonti":["https://whc.unesco.org/en/list/1363/","https://it.wikipedia.org/wiki/Siti_palafitticoli_preistorici_attorno_alle_Alpi","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"ville-medicee","whc":175,"nome":"Ville e giardini medicei in Toscana","etichetta":"Ville medicee","luogo":"Poggio a Caiano","anno":2013,"tipo":"culturale","regioni":["Toscana"],"lat":43.8175,"lon":11.0564,"componenti_italia":14,"diffuso":true,"punto":"villa di Poggio a Caiano","testo":"La famiglia de' Medici fece costruire in Toscana dodici ville e due giardini, tra il Quattrocento e il Seicento. Sono case di campagna eleganti, immerse nella natura, come la villa di Poggio a Caiano.","note":"Quattordici componenti, compreso il Giardino di Boboli a Firenze; lo spillo è sulla villa di Poggio a Caiano, per non sovrapporsi a Firenze.","fonti":["https://whc.unesco.org/en/list/175/","https://it.wikipedia.org/wiki/Ville_medicee","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"etna","whc":1427,"nome":"Monte Etna","etichetta":"Etna","luogo":"Etna","anno":2013,"tipo":"naturale","regioni":["Sicilia"],"lat":37.7561,"lon":14.9967,"componenti_italia":1,"diffuso":false,"testo":"L'Etna è il vulcano attivo più alto d'Europa e uno dei più attivi del mondo. Le sue eruzioni sono studiate da scienziati di tutto il mondo.","note":"La scheda UNESCO lo descrive come lo stratovulcano più attivo del mondo; il sito tutela 19.237 ettari della parte più alta.","fonti":["https://whc.unesco.org/en/list/1427/","https://it.wikipedia.org/wiki/Etna","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"langhe","whc":1390,"nome":"Paesaggi vitivinicoli del Piemonte: Langhe-Roero e Monferrato","etichetta":"Langhe-Roero e Monferrato","luogo":"Langhe","anno":2014,"tipo":"culturale","regioni":["Piemonte"],"lat":44.6086,"lon":7.9636,"componenti_italia":6,"diffuso":true,"punto":"Langa del Barolo","testo":"Sulle colline di Langhe, Roero e Monferrato si coltiva la vite da secoli. Il paesaggio è disegnato dai filari delle vigne, con castelli e paesi sulle cime.","note":"Sei componenti nelle province di Cuneo, Asti e Alessandria; lo spillo è sulla Langa del Barolo.","fonti":["https://whc.unesco.org/en/list/1390/","https://it.wikipedia.org/wiki/Paesaggio_vitivinicolo_del_Piemonte:_Langhe-Roero_e_Monferrato","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"palermo","whc":1487,"nome":"Palermo arabo-normanna e le cattedrali di Cefalù e Monreale","etichetta":"Palermo arabo-normanna","luogo":"Palermo","anno":2015,"tipo":"culturale","regioni":["Sicilia"],"lat":38.1108,"lon":13.3531,"componenti_italia":9,"diffuso":true,"punto":"Palermo, Palazzo Reale","testo":"Nel XII secolo i re normanni di Sicilia fecero lavorare insieme artisti arabi, bizantini e normanni. Così nacquero chiese e palazzi unici, con mosaici d'oro, come la Cappella Palatina e il Duomo di Monreale.","note":"Nove monumenti: sette a Palermo più le cattedrali di Cefalù e Monreale. Lo spillo è sul Palazzo Reale con la Cappella Palatina.","fonti":["https://whc.unesco.org/en/list/1487/","https://it.wikipedia.org/wiki/Palermo_arabo-normanna_e_le_cattedrali_di_Cefal%C3%B9_e_Monreale","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"faggete","whc":1133,"nome":"Antiche faggete primordiali dei Carpazi e di altre regioni d'Europa","etichetta":"Faggete antiche","luogo":"Parco nazionale d'Abruzzo","anno":2017,"tipo":"naturale","regioni":["Abruzzo","Basilicata","Calabria","Emilia-Romagna","Lazio","Puglia"],"lat":41.832,"lon":13.729,"componenti_italia":13,"diffuso":true,"anno_nota":"Sito istituito nel 2007; le faggete italiane sono entrate nel 2017 (e altre nel 2021).","condiviso_con":["altri 17 Stati europei"],"punto":"Valle Cervara, Parco nazionale d'Abruzzo","testo":"In alcuni boschi d'Italia ci sono faggi antichissimi, cresciuti quasi senza l'intervento dell'uomo. Fanno parte di un unico sito insieme alle faggete di altri 17 Paesi d'Europa.","note":"Sito transnazionale istituito nel 2007 (93 componenti in 18 Stati). L'Italia vi entra nel 2017 con 10 faggete; 3 aggiunte nel 2021, in tutto 13 (5 in Abruzzo, 1 in Basilicata, 2 in Calabria, 1 in Emilia-Romagna, 2 nel Lazio, 2 in Puglia, secondo it.wikipedia). Nel conteggio italiano vale dal 2017. Lo spillo è sulla Valle Cervara, nel Parco nazionale d'Abruzzo, Lazio e Molise. Sito istituito nel 2007; le faggete italiane sono entrate nel 2017 (e altre nel 2021).","fonti":["https://whc.unesco.org/en/list/1133/","https://it.wikipedia.org/wiki/Antiche_faggete_primordiali_dei_Carpazi_e_di_altre_regioni_d%27Europa","https://it.wikipedia.org/wiki/Patrimoni_dell%27umanit%C3%A0_d%27Italia"]},{"id":"opere-veneziane","whc":1533,"nome":"Opere di difesa veneziane tra il XVI e il XVII secolo: Stato da Terra – Stato da Mar occidentale","etichetta":"Fortezze veneziane","luogo":"Palmanova","anno":2017,"tipo":"culturale","regioni":["Friuli-Venezia Giulia","Lombardia","Veneto"],"lat":45.9061,"lon":13.3097,"componenti_italia":3,"diffuso":true,"condiviso_con":["Croazia","Montenegro"],"punto":"Palmanova","testo":"La Repubblica di Venezia costruì mura e fortezze per difendere le sue terre e i suoi porti. Palmanova è una città-fortezza a forma di stella a nove punte; fanno parte del sito anche le mura di Bergamo e Peschiera del Garda.","note":"Sei componenti in Italia, Croazia e Montenegro; in Italia Bergamo, Peschiera    «localizzare su una carta geografica le Regioni italiane e le principali
   città»; «articolazione costiera, arco alpino, aree interne, isole».
   Cartina in rilievo sul pavimento, NORD verso la parete delle sedie (z−).
   Scala 1 m = 120 km (1:120.000), rilievo esagerato 8 volte.
   Zona "confronto fiumi" verso la porta: i fiumi si staccano dalla cartina e
   si raddrizzano alla stessa scala (lunghezza), larghi in proporzione alla portata.
   Livello «Siti UNESCO»: le Indicazioni citano «i 60 siti Unesco presenti su tutto

const ICON_ITALIA='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14" opacity=".6"/></svg>';
const fmtIt=(v,d)=>(+v).toLocaleString('it-IT',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});
const ITALIA=(()=>{
const KM=120,VEX=8,BASE=0.025,MX0=-4.50,MZ0=-9.45,MW=GEO.wkm/KM,MH=GEO.hkm/KM,Q=GEO.q,NX=GEO.nx,NY=GEO.ny;
const CMP={x0:-4.15,z0:2.25,z1:8.75,row:1.08,first:3.15};          // zona confronto fiumi
const root=new THREE.Group();root.name='mondo-italia';
const W={id:'italia',order:1,root,footprint:{x:MX0+MW/2,z:(MZ0+CMP.z1)/2,w:MW+0.2,d:CMP.z1-MZ0+0.2},
  tab:{title:'Italia',sub:'Geografia · 3ª',icon:ICON_ITALIA},
  view:{target:new THREE.Vector3(-0.05,0.05,-4.3),r:8.2,theta:0,phi:1.2},surfaces:[]};
const ll2km=(lon,lat)=>[(lon-GEO.bbox[0])*GEO.kx,(GEO.bbox[3]-lat)*GEO.ky];
const km2w=(x,y)=>[MX0+x/KM,MZ0+y/KM];
const ll2w=(lon,lat)=>{const k=ll2km(lon,lat);return km2w(k[0],k[1]);};
let DEM=null,VEC=null;
async function decode(){const un=async b64=>{const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    return new Uint8Array(await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());};
  const d8=await un(GEO_DEM);DEM=new Float32Array(NX*NY);
  for(let j=0;j<NY;j++){let v=0;for(let i=0;i<NX;i++){v=(v+d8[j*NX+i])&255;DEM[j*NX+i]=v>=56?Math.pow((v-56)/199,2)*4810:-Math.pow((55-v)/55,2)*4500;}}
  const vb=await un(GEO_VEC);VEC=new Int16Array(vb.buffer,0,vb.byteLength>>1);}
function elevKm(x,y){const gx=clamp(x/GEO.wkm*(NX-1),0,NX-1.001),gy=clamp(y/GEO.hkm*(NY-1),0,NY-1.001),i=gx|0,j=gy|0,u=gx-i,v=gy-j,k=j*NX+i;
  return DEM[k]*(1-u)*(1-v)+DEM[k+1]*u*(1-v)+DEM[k+NX]*(1-u)*v+DEM[k+NX+1]*u*v;}
const hOf=e=>e>0?BASE+0.0015+e/1000/KM*VEX:BASE-0.003;
function yAtW(x,z){return hOf(elevKm((x-MX0)*KM,(z-MZ0)*KM));}
function pts(seg){const out=[];for(let i=0;i<seg[1];i++)out.push([VEC[(seg[0]+i)*2]/Q,VEC[(seg[0]+i)*2+1]/Q]);return out;}

// ---------- colori della carta (pianura, collina, montagna, vette) ----------
const HYPSO=[[0,'#86BC6A'],[200,'#A9CC7C'],[201,'#E6DD97'],[600,'#E3C985'],[601,'#D7AF73'],[1500,'#BF8E5B'],[2500,'#9C6D47'],[3000,'#B9AFA6'],[3400,'#F1EFEC'],[4810,'#FFFFFF']];
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const LUT=(()=>{const a=new Uint8Array(482*3);for(let k=0;k<482;k++){const e=k*10;let i=0;while(i<HYPSO.length-2&&e>HYPSO[i+1][0])i++;
  const A=hex(HYPSO[i][1]),B=hex(HYPSO[i+1][1]),t=clamp((e-HYPSO[i][0])/Math.max(1,HYPSO[i+1][0]-HYPSO[i][0]),0,1);for(let c=0;c<3;c++)a[k*3+c]=A[c]+(B[c]-A[c])*t;}return a;})();
const SEA0=hex('#BFE0EE'),SEA1=hex('#3D76A4'),GREY=hex('#DAD4C6');
const REGCOL=['#F4C38B','#B9D98C','#9FCBE6','#F3A6A0','#D7B6E6','#F6E08A','#A8DCC8','#F2B8D2','#C9C08E','#9EC3F0',
  '#F7CFA5','#BFE3A3','#E5A98F','#B7B4E8','#EFD27F','#9FD5D1','#E7B3C9','#D2C59A','#AFCFEA','#F1BE94'];
let texFisica=null,texRegioni=null,rasterBase=null,rasterGrey=null,mapMesh=null,seaMesh=null;
function ringPath(g,seg,sx,sy){const p=pts(seg);g.moveTo(p[0][0]*sx,p[0][1]*sy);for(let i=1;i<p.length;i++)g.lineTo(p[i][0]*sx,p[i][1]*sy);g.closePath();}
function bakeRasters(){const w=1024,h=Math.round(w*MH/MW),sx=w/GEO.wkm,sy=h/GEO.hkm;
  const mk=mkCanvas(w,h),mg=mk.getContext('2d');mg.fillStyle='#fff';
  GEO.regioni.forEach(r=>{mg.beginPath();r.r.forEach(s=>ringPath(mg,s,sx,sy));mg.fill('evenodd');});
  const MASK=mg.getImageData(0,0,w,h).data;
  const cA=mkCanvas(w,h),cB=mkCanvas(w,h),gA=cA.getContext('2d'),gB=cB.getContext('2d'),iA=gA.createImageData(w,h),iB=gB.createImageData(w,h),A=iA.data,B=iB.data;
  const d=GEO.wkm/w,L=[-0.55,-0.55,0.63];
  for(let j=0;j<h;j++){const y=(j+0.5)*d;for(let i=0;i<w;i++){const x=(i+0.5)*d,k=(j*w+i)*4,e=elevKm(x,y),ita=MASK[k+3]>127;
    let r,g,b,sh=1;
    if(e>0||ita){const gx=(elevKm(x+d,y)-elevKm(x-d,y))/(2000*d),gy=(elevKm(x,y+d)-elevKm(x,y-d))/(2000*d);
      const nx=-gx*5,ny=-gy*5,nl=Math.hypot(nx,ny,1);sh=0.42+0.86*clamp((nx*L[0]+ny*L[1]+L[2])/nl,0,1);}
    if(ita){const li=clamp(Math.round(Math.max(e,0)/10),0,481)*3;r=LUT[li]*sh;g=LUT[li+1]*sh;b=LUT[li+2]*sh;
      const gv=clamp(236*(0.55+0.45*sh),0,255);B[k]=gv;B[k+1]=gv;B[k+2]=gv;}
    else if(e>0){const li=clamp(Math.round(e/10),0,481)*3,s2=0.78+0.26*(sh-0.5);r=(LUT[li]*0.3+GREY[0]*0.7)*s2;g=(LUT[li+1]*0.3+GREY[1]*0.7)*s2;b=(LUT[li+2]*0.3+GREY[2]*0.7)*s2;
      B[k]=r;B[k+1]=g;B[k+2]=b;}
    else{const t=Math.sqrt(clamp(-e/4500,0,1));r=SEA0[0]+(SEA1[0]-SEA0[0])*t;g=SEA0[1]+(SEA1[1]-SEA0[1])*t;b=SEA0[2]+(SEA1[2]-SEA0[2])*t;B[k]=r;B[k+1]=g;B[k+2]=b;}
    A[k]=clamp(r,0,255);A[k+1]=clamp(g,0,255);A[k+2]=clamp(b,0,255);A[k+3]=255;B[k+3]=255;}}
  gA.putImageData(iA,0,0);gB.putImageData(iB,0,0);rasterBase=cA;rasterGrey=cB;}
function lakesAndBorders(g,sx,sy,mode){
  if(mode==='regioni'){GEO.regioni.forEach((r,i)=>{g.save();g.globalCompositeOperation='multiply';g.fillStyle=REGCOL[i%REGCOL.length];g.beginPath();r.r.forEach(s=>ringPath(g,s,sx,sy));g.fill('evenodd');g.restore();});
    g.lineJoin='round';GEO.regioni.forEach(r=>{g.beginPath();r.r.forEach(s=>ringPath(g,s,sx,sy));g.strokeStyle='rgba(255,255,255,.95)';g.lineWidth=4.5;g.stroke();g.strokeStyle='rgba(60,60,60,.7)';g.lineWidth=1.6;g.stroke();});}
  else{g.lineJoin='round';GEO.regioni.forEach(r=>{g.beginPath();r.r.forEach(s=>ringPath(g,s,sx,sy));g.strokeStyle='rgba(95,70,45,.30)';g.lineWidth=1.6;g.stroke();});}
  GEO.laghi.forEach(l=>{g.beginPath();l.r.forEach(s=>ringPath(g,s,sx,sy));g.fillStyle='#6AA8D8';g.fill('evenodd');g.strokeStyle='#3E78A8';g.lineWidth=1.4;g.stroke();});}
function makeTexture(mode){const w=2048,h=Math.round(w*MH/MW),c=mkCanvas(w,h),g=c.getContext('2d'),sx=w/GEO.wkm,sy=h/GEO.hkm;
  g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(mode==='regioni'?rasterGrey:rasterBase,0,0,w,h);lakesAndBorders(g,sx,sy,mode);
  const t=texOf(c);t.anisotropy=MAXANISO;return t;}

// ---------- rilievo e mare ----------
function buildMap(){const step=2,nx=Math.floor((NX-1)/step)+1,ny=Math.floor((NY-1)/step)+1,pos=new Float32Array(nx*ny*3),uv=new Float32Array(nx*ny*2),land=new Uint8Array(nx*ny);
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const gi=Math.min(i*step,NX-1),gj=Math.min(j*step,NY-1),e=DEM[gj*NX+gi],k=j*nx+i;
    const x=gi/(NX-1)*GEO.wkm,y=gj/(NY-1)*GEO.hkm,[wx,wz]=km2w(x,y);pos[k*3]=wx;pos[k*3+1]=hOf(e);pos[k*3+2]=wz;
    uv[k*2]=gi/(NX-1);uv[k*2+1]=1-gj/(NY-1);land[k]=e>0?1:0;}
  const idx=[];for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){const a=j*nx+i,b=a+1,c=a+nx,d=c+1;if(land[a]|land[b]|land[c]|land[d])idx.push(a,c,b,b,c,d);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('uv',new THREE.BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
  texFisica=makeTexture('fisica');
  mapMesh=new THREE.Mesh(g,new THREE.MeshLambertMaterial({map:texFisica}));mapMesh.name='rilievo';root.add(mapMesh);W.surfaces.push(mapMesh);
  seaMesh=new THREE.Mesh(new THREE.PlaneGeometry(MW,MH),new THREE.MeshLambertMaterial({map:texFisica,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}));
  seaMesh.rotation.x=-Math.PI/2;seaMesh.position.set(MX0+MW/2,BASE,MZ0+MH/2);root.add(seaMesh);W.surfaces.push(seaMesh);
  const slab=new THREE.Mesh(new THREE.BoxGeometry(MW,BASE-0.002,MH),new THREE.MeshLambertMaterial({color:col('#3B6E92')}));slab.position.set(MX0+MW/2,(BASE-0.002)/2,MZ0+MH/2);root.add(slab);
  contatto(MX0+MW/2,MZ0+MH/2,MW+0.35,MH+0.35,0.45,root,0.003);}

// ---------- fiumi: nastri adagiati sul rilievo ----------
const F=DATI_ITALIA.fiumi,MO=DATI_ITALIA.monti,LA=DATI_ITALIA.laghi,CA=DATI_ITALIA.capoluoghi,UN=DATI_ITALIA.unesco;
const rivers=[];
function densify(p,maxd){const out=[p[0]];for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i],d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.ceil(d/maxd);
  for(let k=1;k<=n;k++)out.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n]);}return out;}
function riverWidth(f){return 0.010+0.026*Math.sqrt(f.portata_media_m3s/1540);}
function buildRivers(){const mat=new THREE.MeshBasicMaterial({color:col('#2C78C8'),polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-4});
  GEO.fiumi.forEach(gf=>{const f=F.find(x=>x.id===gf.id);if(!f)return;const wp=densify(pts(gf.l).map(p=>km2w(p[0],p[1])),0.03);
    const n=wp.length,cum=[0];for(let i=1;i<n;i++)cum.push(cum[i-1]+Math.hypot(wp[i][0]-wp[i-1][0],wp[i][1]-wp[i-1][1]));
    const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*2*3),3));
    const idx=[];for(let i=0;i<n-1;i++){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3);}geo.setIndex(idx);
    const mesh=new THREE.Mesh(geo,mat.clone());mesh.frustumCulled=false;root.add(mesh);
    const R={f,wp,cum,len:cum[n-1],mesh,geo,u:0,target:0,row:-1,w:riverWidth(f)};R.home=wp.map(p=>[p[0],yAtW(p[0],p[1])+0.004,p[1]]);
    mesh.userData.pick=()=>openRiver(R);rivers.push(R);shapeRiver(R);});}
// u = 0 sulla cartina … 1 dritto nella zona confronto (con un arco in volo)
function shapeRiver(R){const n=R.wp.length,P=R.geo.attributes.position.array,u=smooth(R.u),lift=Math.sin(Math.PI*u)*0.55;

// ---------- siti UNESCO (livello «Siti UNESCO») ----------
// Uno spillo per sito (una sola InstancedMesh, quindi una draw call). I siti seriali o diffusi stanno su un punto
// rappresentativo scelto tra le componenti UNESCO (campo «punto», spiegato in UN.nota_punti). I siti a meno di 5 km
// (Tivoli, Padova) condividono un'etichetta che apre la scelta. Etichette: come monti e fiumi, quelle in RANK_UN sono
// sempre candidate e le altre solo entro 6,8 m dalla telecamera; in più declutterUnesco() scarta, ogni frame, quelle
// che sullo schermo si sovrapporrebbero a una più importante o più vicina.
const UCOL={culturale:'#4B3F8F',naturale:'#1E7A4C'};
const RANK_UN=new Set(['valcamonica','venezia','dolomiti','cinque-terre','firenze','roma','pompei','matera','alberobello','su-nuraxi','palermo','etna']);
const umarks=[];let usites=[],upins=null,homeL=null;
const _um=new THREE.Matrix4(),_u=new THREE.Vector3(),_uc=(()=>{const [x,z]=ll2w(12.6,42.4);return new THREE.Vector3(x,0.3,z);})();
function pinGeometry(){const a=new THREE.CylinderGeometry(0.0035,0.0035,0.065,6,1,true),b=new THREE.SphereGeometry(0.017,12,8);
  a.translate(0,0.0325,0);b.translate(0,0.072,0);const pos=[],nor=[],idx=[];let off=0;
  [a,b].forEach(p=>{pos.push(...p.attributes.position.array);nor.push(...p.attributes.normal.array);p.index.array.forEach(i=>idx.push(i+off));off+=p.attributes.position.count;});
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));g.setIndex(idx);return g;}
function placePins(){usites.forEach((s,i)=>{const k=state.show[s.tipo]?1:0;_um.makeScale(k,k,k).setPosition(s.x,s.y,s.z);upins.setMatrixAt(i,_um);});upins.instanceMatrix.needsUpdate=true;}
function buildUnesco(){   // dopo decode(): serve l'altimetria
  usites=UN.siti.map(s=>{const [x,z]=ll2w(s.lon,s.lat),y=yAtW(x,z);return {...s,x,z,y,v:new THREE.Vector3(x,y+0.095,z)};});
  upins=new THREE.InstancedMesh(pinGeometry(),new THREE.MeshLambertMaterial({color:0xffffff}),usites.length);upins.name='spilli-unesco';
  usites.forEach((s,i)=>upins.setColorAt(i,col(UCOL[s.tipo])));upins.instanceColor.needsUpdate=true;placePins();
  upins.visible=false;upins.userData.pick=h=>{const s=usites[h.instanceId];if(s)openSite(s,umarks.find(M=>M.sites.includes(s)));};root.add(upins);
  const free=usites.slice();
  while(free.length){const s=free[0],g=free.filter(t=>Math.hypot(t.x-s.x,t.z-s.z)*KM<5);g.forEach(t=>free.splice(free.indexOf(t),1));
    const v=new THREE.Vector3(g.reduce((a,t)=>a+t.x,0)/g.length,0,g.reduce((a,t)=>a+t.z,0)/g.length);v.y=Math.max(...g.map(t=>t.v.y));
    const nat=g.every(t=>t.tipo==='naturale'),M={sites:g,v,rank:g.some(t=>RANK_UN.has(t.id)),ok:false,w:0,h:0};
    M.label=addLabel({text:g.length>1?g[0].luogo+' · '+g.length+' siti':g[0].etichetta,world:'italia',small:true,cls:'unesco'+(nat?' nat':''),
      dot:UCOL[nat?'naturale':'culturale'],anchor:()=>M.v,visible:()=>state.layer==='unesco'&&M.ok,onClick:()=>g.length>1?openGroup(M):openSite(g[0],M)});
    umarks.push(M);}
  if(document.fonts)document.fonts.ready.then(()=>{umarks.forEach(M=>M.w=0);if(homeL)homeL.w=0;});}   // rimisura dopo il caricamento dei font
function declutterUnesco(){const on=state.layer==='unesco'&&!state.comparing;
  if(!on){umarks.forEach(M=>M.ok=false);return;}
  const W=innerWidth,H=innerHeight,cp=camera.position,sel=panelState&&panelState.umark,cand=[];
  for(const M of umarks){M.was=M.ok;M.ok=false;
    if(!M.sites.some(s=>state.show[s.tipo]))continue;
    const d=cp.distanceTo(M.v);if(M!==sel&&!M.rank&&d>=6.8)continue;
    _u.copy(M.v).project(camera);if(_u.z>1||_u.z<-1)continue;
    if(!M.w){M.w=M.label.el.offsetWidth;M.h=M.label.el.offsetHeight;}
    const x=(_u.x*0.5+0.5)*W,y=(-_u.y*0.5+0.5)*H;M.r=[x-M.w/2-3,y-M.h-2,x+M.w/2+3,y+2];
    M.key=(M===sel?-1e4:0)+(M.rank?-100:0)+d-(M.was?0.5:0);cand.push(M);}      // il bonus a chi era già visibile evita lo sfarfallio
  cand.sort((a,b)=>a.key-b.key);const kept=[];
  if(homeL&&homeL.on){_u.copy(homeL.anchor()).project(camera);const x=(_u.x*0.5+0.5)*W,y=(-_u.y*0.5+0.5)*H,w=homeL.w||(homeL.w=homeL.el.offsetWidth),h=homeL.el.offsetHeight;
    kept.push([x-w/2-3,y-h-2,x+w/2+3,y+2]);}                       // l'etichetta della scuola resta sempre libera
  const dk=dock.classList.contains('open')&&dock.getBoundingClientRect();if(dk)kept.push([dk.left,dk.top,dk.right,dk.bottom]);   // niente etichette sotto il dock
  kept.push([0,-1e4,W,64]);                                         // né sotto la barra in alto (alta 64 px)
  for(const M of cand){const r=M.r;if(kept.some(k=>r[0]<k[2]&&r[2]>k[0]&&r[1]<k[3]&&r[3]>k[1]))continue;M.ok=true;kept.push(r);}}
function openSite(s,M){const nat=s.tipo==='naturale',facts=[['Iscritto nel',String(s.anno)],['Tipo',nat?'sito naturale':'sito culturale'],[s.regioni.length>1?'Regioni':'Regione',s.regioni.join(', ')]];
  if(s.condiviso_con)facts.push(['Condiviso con',s.condiviso_con.join(', ')]);if(s.punto)facts.push(['Sulla carta',s.punto]);
  openPanel({title:s.nome,badges:[['Patrimonio dell\'umanità'],[nat?'Naturale':'Culturale','gold']],facts,text:[s.testo],
    note:s.diffuso?`Questo sito è formato da più luoghi (${s.componenti_italia} in Italia): lo spillo ne segna uno.`:null,
    doc:{nota:[s.note,UN.nota_conteggio].filter(Boolean).join(' '),fonti:s.fonti},
    actions:[{label:'Vola sul sito',fn:()=>flyClose(()=>s.v,1.0)},{label:'Che cos\'è l\'UNESCO?',cls:'ghost',fn:openUnescoInfo}]},()=>s.v,M&&M.label);

function openGroup(M){const n=M.sites.length;

function addCmp(id){if(state.sel.includes(id))return;if(state.sel.length>=5){toast('Al massimo 5 fiumi nel confronto');return;}state.sel.push(id);renderCmp();if(state.comparing)layoutCmp();}
function remCmp(id){state.sel=state.sel.filter(x=>x!==id);renderCmp();if(state.comparing)layoutCmp();}
function layoutCmp(){rivers.forEach(R=>{const i=state.sel.indexOf(R.f.id);if(state.comparing&&i>=0){R.row=i;R.target=1;R.mesh.material.color.copy(col(CMPCOL[i%5]));}else{R.target=0;}});}
function startCompare(){if(!state.sel.length){toast('Scegli almeno un fiume');return;}state.comparing=true;layoutCmp();closePanel();
  flyTo(new THREE.Vector3(-0.6,0.05,5.2),6.2,0,0.98);setTimeout(()=>{if(state.comparing)openCompare();},2600);renderCmp();}
function stopCompare(){state.comparing=false;layoutCmp();closePanel();flyTo(W.view.target,W.view.r,W.view.theta,W.view.phi);renderCmp();}
function updateRivers(dt){rivers.forEach(R=>{if(R.u===R.target)return;const sp=dt/2.2;R.u=R.target>R.u?Math.min(R.target,R.u+sp):Math.max(R.target,R.u-sp);
  if(R.u===0&&R.target===0){R.row=-1;R.mesh.material.color.copy(col('#2C78C8'));}shapeRiver(R);
