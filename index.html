// PRNG deterministico (RIGIOCABILITA §5.1)
function cyrb53(s,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
  h1=Math.imul(h1^h1>>>16,2246822507)^Math.imul(h2^h2>>>13,3266489909);h2=Math.imul(h2^h2>>>16,2246822507)^Math.imul(h1^h1>>>13,3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const shuffle=(arr,r)=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
// posti possibili per i bidoni, contro le pareti (x,z = punto davanti al bidone; rot = verso l'aula)
const POSTI=[
  {x:-4.86,z:-8.6,rot:Math.PI/2},{x:-4.86,z:-4.9,rot:Math.PI/2},{x:-4.86,z:2.2,rot:Math.PI/2},{x:-4.86,z:5.6,rot:Math.PI/2},
  {x:4.78,z:-8.4,rot:-Math.PI/2},{x:4.78,z:-4.9,rot:-Math.PI/2},{x:4.78,z:-1.4,rot:-Math.PI/2},{x:4.78,z:2.1,rot:-Math.PI/2},{x:4.78,z:5.5,rot:-Math.PI/2},
  {x:-3.7,z:-9.95,rot:0}];
const START={x:0.4,z:8.5};
const AREA={x0:-4.25,x1:4.15,z0:-9.0,z1:8.0};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
const fronte=p=>({x:p.x+Math.sin(p.rot)*0.55,z:p.z+Math.cos(p.rot)*0.55});   // dove si ferma il carrello
// genera una partita: n rifiuti (almeno 3 per bidone), 5 bidoni distanti fra loro, isole "merenda"
function genera(seed,n){const r=mulberry32(cyrb53(String(seed)));n=Math.max(15,Math.min(28,n||20));
  let posti;for(let k=0;k<200;k++){posti=shuffle(POSTI,r).slice(0,5);let ok=true;
    for(let i=0;i<5&&ok;i++)for(let j=i+1;j<5;j++)if(dist(posti[i],posti[j])<4.2){ok=false;break;}if(ok)break;}
  const bins=BIDONI.map((b,i)=>({...b,...posti[i],stop:fronte(posti[i])}));
  const perB={};RIFIUTI.forEach(t=>(perB[t.b]=perB[t.b]||[]).push(t));
  let tipi=[];BIDONI.forEach(b=>shuffle(perB[b.id],r).slice(0,3).forEach(t=>tipi.push(t)));
  const resto=shuffle(RIFIUTI.filter(t=>!tipi.includes(t)),r);while(tipi.length<n)tipi.push(resto.length?resto.pop():RIFIUTI[Math.floor(r()*RIFIUTI.length)]);
  tipi=shuffle(tipi,r);
  const isole=[0,1,2].map(()=>({x:AREA.x0+1.2+r()*(AREA.x1-AREA.x0-2.4),z:AREA.z0+1.5+r()*(AREA.z1-AREA.z0-3)}));
  const items=[];tipi.forEach((t,i)=>{let p,k=0;do{if(i%3!==2){const s=isole[i%3];p={x:s.x+(r()*2-1)*1.6,z:s.z+(r()*2-1)*1.6};}
      else p={x:AREA.x0+r()*(AREA.x1-AREA.x0),z:AREA.z0+r()*(AREA.z1-AREA.z0)};k++;}
    while(k<300&&(p.x<AREA.x0||p.x>AREA.x1||p.z<AREA.z0||p.z>AREA.z1||items.some(q=>dist(p,q)<0.55)||bins.some(b=>dist(p,b)<1.3)||dist(p,START)<0.8));
    items.push({uid:i,tipo:t,x:p.x,z:p.z,rot:r()*Math.PI*2});});
  return{seed:String(seed),bins,items,start:{...START}};}
// strategia "furba": a ogni giro sceglie il bidone che costa meno per rifiuto, raccoglie fino a 3 rifiuti di quel bidone
function costoFurbo(g){let pos={...g.start},rest=g.items.slice(),tot=0;
  while(rest.length){let best=null;
    g.bins.forEach(b=>{let mine=rest.filter(it=>it.tipo.b===b.id);if(!mine.length)return;let p={...pos},c=0,take=[];
      for(let k=0;k<3&&mine.length;k++){mine.sort((u,v)=>dist(p,u)-dist(p,v));const it=mine.shift();c+=dist(p,it);p=it;take.push(it);}
      c+=dist(p,b.stop);const v=c/take.length;if(!best||v<best.v)best={v,c,take,b};});
    tot+=best.c;pos={...best.b.stop};rest=rest.filter(it=>!best.take.includes(it));}
  return tot;}
// strategia "ingenua": prende i 3 rifiuti più vicini, qualunque bidone, poi passa dai bidoni necessari
function costoIngenuo(g){let pos={...g.start},rest=g.items.slice(),tot=0;
  while(rest.length){const bag=[];for(let k=0;k<3&&rest.length;k++){rest.sort((u,v)=>dist(pos,u)-dist(pos,v));const it=rest.shift();tot+=dist(pos,it);pos=it;bag.push(it);}
    let need=[...new Set(bag.map(it=>it.tipo.b))].map(id=>g.bins.find(b=>b.id===id));
    while(need.length){need.sort((u,v)=>dist(pos,u.stop)-dist(pos,v.stop));const b=need.shift();tot+=dist(pos,b.stop);pos={...b.stop};}}
  return tot;}
return{BIDONI,RIFIUTI,POSTI,AREA,genera,costoFurbo,costoIngenuo,dist,cyrb53,mulberry32};})();

/* =====================================================================

   Decisione centrale: quali tre rifiuti caricare insieme — i più vicini o quelli
   dello stesso bidone? I cinque bidoni (i NOSTRI, con i nostri cartelli) sono sparsi
   per l'aula: ogni viaggio consuma energia. Energia = 120% della strada di chi
   raggruppa per bidone (taratura: 400 partite simulate, chi prende i più vicini
   spende in media il 36% in più → resta a secco con qualche rifiuto a terra).
   Niente punti, niente classifiche: l'errore rimanda il rifiuto nel sacco con la
   spiegazione; alla fine c'è la riflessione (debrief).

  let g=mergeParts(P);

const VEL=/[?&]prova=1/.test(location.search)?9:1.8;   // prova=1: carrello veloce, solo per i collaudi automatici
function stepCart(dt){if(!S||S.fase!=='gioco'||!S.target)return;const t=S.target,dx=t.x-S.pos.x,dz=t.z-S.pos.z,d=Math.hypot(dx,dz);

/* =====================================================================
   VOLO INIZIALE — presenta l'aula magna (si salta con un clic, un tasto o «Salta»)
   Percorso: spline Catmull-Rom per la posizione e per il punto guardato; a ogni tappa
   una didascalia. Termina esattamente nella vista iniziale, così non ci sono scatti.
   ===================================================================== */
const intro=(()=>{const cap=document.getElementById('introCap'),skip=document.getElementById('introSkip'),bar=document.getElementById('introBar');
  const endPos=camPos(VIEW.target,fitRadius(VIEW.target,VIEW.r,VIEW.theta,VIEW.phi),VIEW.theta,VIEW.phi,new THREE.Vector3());
  const K=[ // posizione telecamera, punto guardato, didascalia, sottotitolo, secondi
    [[0,2.8,10.15],[0,1.0,1.5],'Aula magna','Scuola Sacra Famiglia · Orzinuovi',3.4],
    [[2.7,2.3,5.6],[-5.3,1.3,1.6],'21 metri per 10,7 · alta 3 metri','ricostruita dalla scansione 3D dell\'aula vera',3.8],
    [[0.4,1.75,-2.4],[-5.3,1.5,-1.0],'Verso il corridoio','finestre interne con le veneziane, pilastri e travi blu',3.6],
    [[-1.9,1.7,-6.9],[5.3,1.5,-4.4],'Dall\'altra parte, le vetrate','sulla campagna di Orzinuovi',3.6],
    [[-3.0,2.6,-9.7],[1.2,0.0,1.4],'E il pavimento a scacchi…','è qui che si caricano i mondi delle discipline',3.6],
    [[endPos.x,endPos.y,endPos.z],[VIEW.target.x,VIEW.target.y,VIEW.target.z],'Scegli un mondo dalle schede in alto','',2.6]];
  const P=new THREE.CatmullRomCurve3(K.map(k=>new THREE.Vector3(...k[0])),false,'centripetal');
  const L=new THREE.CatmullRomCurve3(K.map(k=>new THREE.Vector3(...k[1])),false,'centripetal');
  const T=K.map(k=>k[4]),TOT=T.slice(0,-1).reduce((a,b)=>a+b,0);
  let tm=0,lastSeg=-1;const look=new THREE.Vector3();
  const I={on:false,start(){I.on=true;tm=0;lastSeg=-1;skip.style.display='block';document.getElementById('help').classList.add('min');},
    update(dt){tm+=dt;let acc=0,seg=0;while(seg<K.length-2&&tm>acc+T[seg]){acc+=T[seg];seg++;}
      const loc=clamp((tm-acc)/T[seg],0,1),e=lerp(loc,smooth(loc),0.65),u=(seg+e)/(K.length-1);
      P.getPoint(u,camera.position);L.getPoint(u,look);camera.lookAt(look);bar.style.width=(Math.min(1,tm/TOT)*100)+'%';
      const show=Math.min(seg+(loc>0.55?1:0),K.length-1);
      if(show!==lastSeg){lastSeg=show;cap.classList.remove('on');setTimeout(()=>{cap.innerHTML=`${esc(K[show][2])}${K[show][3]?`<small>${esc(K[show][3])}</small>`:''}`;cap.classList.add('on');},show?260:0);
        if(show===K.length-1){tabsEl.classList.add('pulse');setTimeout(()=>tabsEl.classList.remove('pulse'),4600);}}
      if(tm>=TOT)I.stop(true);},
    stop(finished){if(!I.on)return;I.on=false;skip.style.display='none';bar.style.width='0';
      view.target.copy(VIEW.target);view.r=VIEW.r;view.theta=VIEW.theta;view.phi=VIEW.phi;goal.target.copy(VIEW.target);goal.r=VIEW.r;goal.theta=VIEW.theta;goal.phi=VIEW.phi;
      if(!finished){cap.classList.remove('on');tabsEl.classList.add('pulse');setTimeout(()=>tabsEl.classList.remove('pulse'),4600);}
      else setTimeout(()=>cap.classList.remove('on'),2600);
      const h=document.getElementById('help');h.classList.remove('min');document.getElementById('helpMin').textContent='nascondi';}};
  skip.onclick=()=>I.stop(false);
  canvas.addEventListener('pointerdown',()=>I.stop(false),true);addEventListener('keydown',()=>I.stop(false),true);
  canvas.addEventListener('wheel',()=>I.stop(false),{capture:true,passive:true});
  tabsEl.addEventListener('click',()=>I.stop(false),true);
  return I;})();

const clock=new THREE.Clock();let fpsAcc=0,fpsN=0,fpsChecked=false,elapsed=0;
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
const DTMAX=/[?&]prova=1/.test(location.search)?5:0.05;   // prova=1: solo per gli screenshot automatici
function loop(){const dt=Math.min(clock.getDelta(),DTMAX);elapsed+=dt;
  keyPan(dt);runTweens(dt);
  // il mondo si aggiorna solo quando è costruito; un errore non deve mai fermare il ciclo
  if(current&&current.built&&current.update){try{current.update(dt,elapsed);}catch(err){console.error(err);}}
  if(intro.on)intro.update(dt);else updateCamera(dt);renderer.render(scene,camera);updateLabels();updatePanel();
  // dopo 4 s, se il frame-rate è basso, si abbassa la risoluzione di rendering
  if(!fpsChecked&&elapsed>2){fpsAcc+=dt;fpsN++;if(fpsAcc>2){fpsChecked=true;const fps=fpsN/fpsAcc;
    if(fps<40&&pixelRatio>0.8){pixelRatio=0.8;renderer.setPixelRatio(pixelRatio);resize();}}}
  if(fpsBox){fpsF++;fpsT+=dt;if(fpsT>=0.5){const r=renderer.info.render;
    fpsBox.textContent=`${Math.round(fpsF/fpsT)} fps · ${r.calls} draw call · ${Math.round(r.triangles/1000)}k triangoli · risoluzione ${pixelRatio}`;fpsF=0;fpsT=0;}}
  requestAnimationFrame(loop);}
// ?fps=1 → contatore prestazioni (per le prove sugli iMac del laboratorio)
let fpsBox=null,fpsF=0,fpsT=0;
if(/[?&]fps=1/.test(location.search)){fpsBox=document.createElement('div');
  fpsBox.style.cssText='position:fixed;right:16px;top:74px;z-index:25;background:rgba(14,68,35,.9);color:#fff;font:600 14px Lexend,sans-serif;padding:6px 12px;border-radius:10px';
  document.body.appendChild(fpsBox);}
document.getElementById('helpMin').onclick=()=>{const h=document.getElementById('help');h.classList.toggle('min');
  document.getElementById('helpMin').textContent=h.classList.contains('min')?'mostra':'nascondi';};
renderTabs();updateCamera(1);
// link diretti per i docenti: ?mondo=tempo&t=153  (t = milioni di anni fa)
const QS=new URLSearchParams(location.search);
requestAnimationFrame(()=>requestAnimationFrame(()=>{document.getElementById('loading').classList.add('done');loop();
  const m=QS.get('mondo');if(!m&&QS.get('intro')!=='0')intro.start();
  if(m&&WORLDS.find(w=>w.id===m)){switchWorld(m).then(()=>{const w=current;
    if(QS.has('t')&&w&&w.setTime)w.setTime(parseFloat(QS.get('t')));if(QS.has('cam')){const c=QS.get('cam').split(',').map(Number);
      if(c.length===6)flyTo(new THREE.Vector3(c[0],c[1],c[2]),c[3],c[4],c[5]);}});}}));
window.__aula={scene,camera,renderer,switchWorld,flyTo,view,goal,WORLDS,intro,get current(){return current;}};
</script>
